<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="METAR Proche">
<!-- ==================================================================
     ICÔNE D'APPLICATION, version « maskable » : celle qu'Android ROGNE.
     Sa jumelle non rognée, et le pourquoi de la séparation, sont dans
     public/icon.svg. Ce fichier-ci est la SOURCE de icon-maskable-512.png,
     conservée pour pouvoir régénérer le PNG sans le redessiner.

     LA SEULE DIFFÉRENCE EST L'ÉCHELLE, et elle n'est pas décorative.
     Selon le lanceur, Android découpe l'icône en cercle, en goutte ou en
     écusson, et ne garantit que le disque central de 80 %. Le dessin est
     donc contenu dans les 60 % centraux (scale 4,8 au lieu de 6,8),
     quitte à paraître petit dans un carré : mieux vaut de l'air perdu
     qu'un rayon de soleil rogné. Vérifié par comptage de pixels le
     28/07/2026 : 0 pixel peint hors du disque de sécurité.
     ================================================================== -->
<rect width="512" height="512" fill="#0A1526"/>
<g transform="translate(102.4,102.4) scale(4.8)"
   fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Le soleil : disque + huit rayons, repère natif 24 recentré. -->
  <g stroke="#F5A623" stroke-width="2.727" transform="translate(19,19) scale(1.1) translate(-12,-12)">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </g>
  <!-- Le grand nuage, puis le petit. -->
  <g stroke="#EAF2FB" stroke-width="2" transform="translate(31,36) scale(1.5) translate(-12,-11)">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </g>
  <g stroke="#EAF2FB" stroke-width="3.75" transform="translate(50,44) scale(0.8) translate(-12,-11)">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </g>
</g>
</svg>
