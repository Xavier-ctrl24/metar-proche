// La langue est TOUJOURS passée en paramètre, jamais relue depuis les
// pastilles au fond d'une fonction d'affichage. Même raison que
// `buildResponse(…, lang)` côté serveur : un défaut implicite rendrait un
// oubli silencieux. En prime, cela ferme la fenêtre où l'utilisateur change
// de langue pendant la requête et où le chrome ne dirait plus la même langue
// que les phrases de l'API.
const T = (lang) => TEXTES[lang] ?? TEXTES.fr;

// Langue courante. Elle ne vit plus dans un <select> : les pastilles n'ont
// pas de valeur, donc c'est cette variable qui fait foi.
let langue = "fr";

// Remplit les trous `{nom}` d'un modèle. Aucun échappement ici : tout ce qui
// en sort passe par textContent, jamais par innerHTML.
const remplir = (modele, valeurs) =>
  modele.replace(/\{(\w+)\}/g, (_, cle) => valeurs[cle]);

// Séparateur décimal. Propriété STRUCTURELLE de la langue et non un choix de
// vocabulaire : le français écrit « 21,4 km », l'anglais « 21.4 km ». C'est la
// même règle que le .replace(".", ",") qui termine src/i18n/fr.ts.
const nombre = (v, lang) => (lang === "fr" ? String(v).replace(".", ",") : String(v));

// Dernier échec affiché, retenu pour pouvoir le RE-rendre si la langue change
// alors qu'aucune donnée n'est à l'écran (un échec ne déclenche pas de
// nouvelle requête, donc rien ne repasserait par afficherEchec sans cela).
let dernierEchec = null;
// Dernière position consultée, pour le bouton « Réessayer » de l'écran de panne.
let dernierePosition = null;

// ---------------------------------------------------------------
// LE CIEL. C'est ici que le contrat rencontre le système de design.
//
// Le contrat rend 24 jetons d'icône ; la maquette dessine 8 ciels. La
// correspondance est donc à NOTRE charge, et elle regroupe par FAMILLE
// visuelle : ce qui tombe (4 pluies + 2 averses) partage un ciel, ce qui
// bouche la vue (brouillard, brume, poussière, fumée) en partage un autre.
//
// Deux points à ne pas rediscuter sans raison :
//  - `unknown` ne prend PAS un ciel météo mais le neutre du chargement.
//    Un jeton illisible ne doit pas afficher un beau ciel bleu affirmatif.
//  - `dust`/`smoke` vont sur le ciel de brouillard, faute d'un ciel ocre
//    dans la maquette. En inventer un serait écrire du design, pas
//    l'appliquer. La famille est juste : ça bouche la vue.
// ---------------------------------------------------------------
const CIELS = {
  clear_day: "cavok",
  clear_night: "night",
  few_day: "sct", few_night: "sct",
  partly_cloudy_day: "sct", partly_cloudy_night: "sct",
  cloudy: "ovc", overcast: "ovc",
  fog: "fg", mist: "fg", dust: "fg", smoke: "fg",
  drizzle: "ra", rain_light: "ra", rain: "ra", rain_heavy: "ra",
  showers_day: "ra", showers_night: "ra",
  snow: "sn", sleet: "sn", hail: "sn", freezing_rain: "sn",
  thunderstorm: "ts",
  unknown: "neutral",
};

// Les ciels dont l'encre est SOMBRE, parce que le dégradé y est presque
// blanc. C'est cette liste, et elle seule, qui décide de la polarité des
// cartes de verre : sur ciel clair, un verre blanc serait invisible.
const CIELS_CLAIRS = new Set(["fg", "sn"]);

function poserCiel(jeton, isDay) {
  const ciel = CIELS[jeton] ?? "neutral";
  // La nuit s'applique à toutes les conditions, mais le ciel étoilé n'est
  // dessiné que pour le ciel clair : ailleurs, c'est un voile qui baisse
  // la lumière. `isDay === null` (jour/nuit inconnu) reste du jour, comme
  // `pickIcon` retombe déjà sur la variante diurne côté serveur.
  const nuit = isDay === false;
  const html = document.documentElement;
  html.dataset.sky = ciel;
  html.dataset.lum = nuit ? "night" : "day";
  // De nuit tout redevient sombre, donc l'encre redevient claire.
  html.dataset.pol = !nuit && CIELS_CLAIRS.has(ciel) ? "light" : "dark";
}

// ---------------------------------------------------------------
// LA PHRASE DE CONSEIL (29/07/2026)
//
// Sélecteur NEUTRE : il rend un JETON, jamais une phrase. Le vocabulaire
// vit dans TEXTES, sous la clé `c_<jeton>`. C'est exactement le découpage
// de `icon.ts` / `headlineText` côté serveur, et pour la même raison :
// Xavier peut réécrire les neuf phrases sans lire une seule condition, et
// les deux langues ne peuvent pas diverger sur QUAND la phrase apparaît.
//
// Pourquoi ici et non dans l'API : ce n'est pas une traduction du METAR
// mais une INTERPRÉTATION de valeurs déjà rendues par le contrat. La
// mettre côté serveur imposerait de toucher `types.ts`, donc au contrat.
//
// LES SEUILS SONT DES DÉCISIONS, PAS DES MESURES. Ils sont nommés et
// groupés ici pour qu'ils se discutent d'un coup d'œil. Ils sont
// délibérément PRUDENTS : une phrase qui s'affiche tout le temps ne veut
// plus rien dire, donc en cas de doute on ne dit rien (retour `null`).
// ---------------------------------------------------------------
const SEUILS = {
  ventKmh: 30,        // vitesse moyenne à partir de laquelle le vent gêne
  rafaleKmh: 50,      // ou rafale, qui gêne plus tôt qu'une moyenne
  brouillardM: 1000,  // visibilité sous laquelle on parle de brouillard dense
  froidC: 0,          // ressenti (et non température) : c'est lui qu'on subit
  chaudC: 30,
  idealMin: 15,       // fenêtre de la phrase « temps idéal »
  idealMax: 27,
};

// Les jetons dont le DESSIN contient un astre ou un éclair, donc les seuls
// où un halo chaud dit quelque chose de vrai. C'est la même distinction que
// la planche d'icônes : « ambre pour l'astre et l'éclair ».
const JETONS_ASTRE = new Set(["clear_day", "clear_night", "few_day", "few_night",
  "partly_cloudy_day", "partly_cloudy_night", "showers_day", "showers_night",
  "thunderstorm"]);

// Les jetons d'icône qui disent qu'il TOMBE quelque chose, par famille.
// LA GRÊLE N'EST PAS DE LA NEIGE, même si elle partage son ciel dans la
// table CIELS : ce regroupement-là est VISUEL, il ne fait pas de `hail` un
// synonyme de `snow`. Lui faire dire « neige en cours » serait exactement
// la faute évitée trois lignes plus bas sur `mist`/`dust`/`smoke`, qui
// partagent le ciel du brouillard sans forcément boucher la vue. Elle a
// donc son jeton et sa phrase.
const JETONS_NEIGE = new Set(["snow", "sleet"]);
const JETONS_PLUIE = new Set(["drizzle", "rain_light", "rain", "rain_heavy",
  "showers_day", "showers_night"]);
const JETONS_CIEL_CLAIR = new Set(["clear_day", "clear_night", "few_day", "few_night"]);

function conseilToken(r) {
  // L'ordre EST la règle : on ne dit qu'UNE chose, donc la plus grave
  // d'abord. Il reprend la priorité d'icône du contrat (orage → verglas →
  // grêle/neige → pluie → brouillard), pour que la phrase et le symbole
  // ne puissent pas raconter deux histoires différentes. Le vent s'y
  // glisse avant la pluie : sous la pluie, c'est le vent qui décide si le
  // parapluie sert à quelque chose.
  const jeton = r.icon;
  if (jeton === "thunderstorm") return "orage";
  if (jeton === "freezing_rain") return "verglas";
  if (jeton === "hail") return "grele";
  if (JETONS_NEIGE.has(jeton)) return "neige";

  // Brouillard : on exige la VALEUR de visibilité et pas seulement le
  // jeton. `mist`, `dust` et `smoke` partagent le ciel du brouillard sans
  // forcément boucher la vue ; annoncer « visibilité très réduite » à
  // 8 km serait faux. CAVOK écarte le cas d'office.
  const vis = r.visibility;
  if (vis && !vis.isCavok && vis.value !== null && vis.value < SEUILS.brouillardM) {
    return "brouillard";
  }

  const v = r.wind;
  if (v && (
    (v.speed !== null && v.speed >= SEUILS.ventKmh) ||
    (v.gust !== null && v.gust >= SEUILS.rafaleKmh)
  )) return "vent";

  if (JETONS_PLUIE.has(jeton)) return "pluie";

  // Le RESSENTI et non la température : c'est lui qui dit s'il faut se
  // couvrir. Absent (le contrat l'autorise), on se tait plutôt que de
  // retomber sur la température sèche, qui ment par grand vent.
  const t = r.temperature;
  const ressenti = t ? t.feelsLike : null;
  if (ressenti !== null && ressenti !== undefined) {
    if (ressenti <= SEUILS.froidC) return "froid";
    if (ressenti >= SEUILS.chaudC) return "chaud";
  }

  // « Temps idéal » : le cas le plus exigeant, parce que c'est le seul qui
  // INVITE à sortir. Il faut donc un ciel dégagé, du jour, et une
  // température franchement agréable. De nuit la phrase n'a pas de sens.
  const isDay = r.sun ? r.sun.isDay : null;
  if (isDay === true && JETONS_CIEL_CLAIR.has(jeton) &&
      ressenti !== null && ressenti !== undefined &&
      ressenti >= SEUILS.idealMin && ressenti <= SEUILS.idealMax) {
    return "ideal";
  }

  return null; // rien de notable à dire : on se tait, et la ligne disparaît
}

// ---------------------------------------------------------------
// LA MASCOTTE (30/07/2026)
//
// Elle n'a AUCUNE logique propre : elle se branche sur le jeton de conseil
// déjà calculé. C'est ce qui garantit qu'elle ne peut pas avoir l'air content
// pendant que la phrase d'à côté annonce un orage.
//
// TROIS EXPRESSIONS POUR DIX JETONS (arbitrage de Xavier). La table est ici et
// non dans le CSS pour la même raison que CIELS : c'est une correspondance,
// donc elle se relit et se change d'un coup d'œil. Tout jeton absent de cette
// table prend `m-neutre`, y compris un jeton futur qu'on aurait oublié
// d'y ranger : même réflexe de repli que `#i-unknown` et que le ciel neutre.
// ---------------------------------------------------------------
const EXPRESSIONS = {
  ideal: "m-content",
  // Les quatre situations où l'on demande au lecteur de faire attention. Le
  // vent, la pluie, la neige, le froid et le chaud n'y sont PAS : ils sont
  // désagréables, pas alarmants, et un personnage inquiet à chaque averse
  // finirait par ne plus rien signaler.
  orage: "m-souci",
  verglas: "m-souci",
  grele: "m-souci",
  brouillard: "m-souci",
};

// ---------------------------------------------------------------
// LE SCORE DE CONFORT EXTÉRIEUR (30/07/2026, demande de Xavier)
//
// CE QU'IL EST : une lecture unique de « fait-il bon dehors », composée de
// cinq entrées que le contrat rend déjà. Comme la phrase de conseil, il vit
// côté page parce qu'il INTERPRÈTE des valeurs et n'en ajoute aucune : le
// mettre côté serveur imposerait de toucher au contrat pour un calcul qui
// n'apporte pas de donnée nouvelle.
//
// LA DÉCISION QUI COMPTE, ET C'EST XAVIER QUI L'A TRANCHÉE : la carte
// DISPARAÎT dès qu'une seule des cinq entrées manque. Ce n'est pas de la
// prudence excessive, c'est une question d'honnêteté — « 94 % » calculé sur
// trois entrées sur cinq affirme une précision que la donnée n'a pas, et le
// libellé qui énumère les cinq entrées rend le mensonge explicite. Le contrat
// autorise `feelsLike`, `humidity` et `sun` à valoir null, donc le cas arrive
// pour de vrai sur les stations automatiques laconiques.
// C'est le même réflexe que `conseilToken`, qui refuse de juger le froid sur
// la température sèche : mieux vaut ne rien dire que dire à peu près.
//
// LES PÉNALITÉS SONT DES DÉCISIONS, PAS DES MESURES, exactement comme SEUILS.
// Elles partent de 100 et retirent. Aucune ne prétend à une base scientifique :
// ce sont des ordres de grandeur qui produisent un classement plausible, et
// ils attendent l'avis de Xavier. Le découpage les rend discutables une par
// une sans toucher au reste.
// ---------------------------------------------------------------
const SEUILS_CONFORT = {
  // Le RESSENTI, jamais la température sèche. Même argument que conseilToken :
  // 5 °C par vent fort ne se vit pas comme 5 °C au calme.
  idealMin: 18,       // en dessous, on retire par degré manquant
  idealMax: 24,       // au-dessus, on retire par degré excédentaire
  // RELEVÉS APRÈS MESURE et non choisis d'emblée : les premières valeurs
  // (3,2 et 2,6) notaient 38 °C ressentis « correct, sans plus », ce qui est
  // faux et même dangereux à dire. Le barème se juge sur ses SORTIES, pas sur
  // la plausibilité de ses coefficients.
  parDegreFroid: 3.6,
  parDegreChaud: 4.2,
  // L'humidité ne gêne qu'aux extrêmes : une plage large, et rien dedans.
  humMin: 35,
  humMax: 70,
  parPointHum: 0.35,
  // Le vent : rien jusqu'à une brise, puis linéaire. La rafale compte à part
  // parce qu'une rafale à 60 sur un vent moyen de 20 se subit vraiment.
  ventLibre: 12,
  parKmhVent: 1.1,
  parKmhRafale: 0.5,
  // Ciel et précipitations. Ce sont des forfaits et non des pentes : il pleut
  // ou il ne pleut pas.
  // Les forfaits de ciel sont calibrés pour que le phénomène SEUL suffise à
  // faire descendre le score dans la bonne tranche, sans l'aide d'un vent ou
  // d'un froid qui n'existent pas forcément. C'est le point qui a demandé le
  // plus de reprises : à 34, un orage sur une journée douce ressortait à 48 %
  // « peu agréable dehors », alors qu'on n'a rien à faire dehors sous
  // l'orage. Il faut donc 68 pour que l'orage seul passe sous 35.
  malusCouvert: 6,
  malusPluie: 28,     // 28 et non 22 : à 22, une pluie seule restait « agréable »
  malusNeige: 30,
  // LA GLACE À PART DE LA NEIGE, et pour la même raison que `hail` a son
  // propre jeton de conseil : grêle et pluie verglaçante ne sont pas de la
  // neige un peu plus froide, elles rendent le sol praticable ou non.
  malusGlace: 55,
  malusOrage: 68,
  // 30 et non 20 : à 20, un brouillard à 400 m ressortait « agréable dehors »,
  // ce qui est absurde. Calibré, comme les autres forfaits, pour que le
  // phénomène SEUL suffise à sortir de la tranche « agréable ».
  malusBrouillard: 30,
  malusAirCharge: 34,
  // 14 et non 8 : à 8, une nuit d'été douce ressortait « idéal pour être
  // dehors », ce qui n'est pas faux mais que le seuil « excellent » ne doit
  // pas décerner sans soleil. À 14, la même nuit devient « agréable ».
  malusNuit: 14,
  // Bornes des cinq qualificatifs. Valeur MINIMALE de chaque tranche.
  bonMin: 75,
  moyenMin: 55,
  mediocreMin: 35,
  excellentMin: 88,
};

const JETONS_COUVERT = new Set(["cloudy", "overcast"]);

// L'AIR CHARGÉ : poussière et fumée. Ils avaient été OUBLIÉS du barème, et
// c'est la même faute que `hail` rangé dans la neige — ils partagent le ciel
// `fg` dans la table CIELS, ce qui est un regroupement VISUEL, et cette
// parenté-là ne leur donnait aucune pénalité : une tempête de sable notait
// comme une journée dégagée. Ils ont donc leur propre forfait, plus lourd
// qu'un brouillard : on respire dedans.
const JETONS_AIR_CHARGE = new Set(["dust", "smoke"]);

/**
 * Rend `{ pct, cle }` ou `null` si une entrée manque.
 *
 * `cle` est un JETON de qualificatif et non une phrase : même découpage que
 * `conseilToken` et que `uvLevel` côté serveur. Xavier réécrit les cinq
 * phrases sans toucher à une borne.
 */
function confortScore(r) {
  const t = r.temperature;
  const v = r.wind;

  // LES CINQ ENTRÉES ANNONCÉES, vérifiées une par une. L'ordre suit celui du
  // libellé « température, humidité, vent, soleil, pluie », pour qu'on puisse
  // relire la garde en regardant l'écran.
  const ressenti = t ? t.feelsLike : null;          // température (ressentie)
  const hum = t ? t.humidity : null;                // humidité
  const vent = v ? v.speed : null;                  // vent
  const isDay = r.sun ? r.sun.isDay : null;         // soleil
  const jeton = r.icon;                             // pluie (et le reste du ciel)
  if (ressenti === null || ressenti === undefined) return null;
  if (hum === null || hum === undefined) return null;
  if (vent === null || vent === undefined) return null;
  if (isDay === null || isDay === undefined) return null;
  // Un jeton `unknown` n'est pas une information sur le ciel : c'est l'aveu
  // qu'on n'a pas su le lire. Il ne peut donc pas servir d'entrée « pluie ».
  if (!jeton || jeton === "unknown") return null;

  let score = 100;

  if (ressenti < SEUILS_CONFORT.idealMin) {
    score -= (SEUILS_CONFORT.idealMin - ressenti) * SEUILS_CONFORT.parDegreFroid;
  } else if (ressenti > SEUILS_CONFORT.idealMax) {
    score -= (ressenti - SEUILS_CONFORT.idealMax) * SEUILS_CONFORT.parDegreChaud;
  }

  if (hum < SEUILS_CONFORT.humMin) {
    score -= (SEUILS_CONFORT.humMin - hum) * SEUILS_CONFORT.parPointHum;
  } else if (hum > SEUILS_CONFORT.humMax) {
    score -= (hum - SEUILS_CONFORT.humMax) * SEUILS_CONFORT.parPointHum;
  }

  if (vent > SEUILS_CONFORT.ventLibre) {
    score -= (vent - SEUILS_CONFORT.ventLibre) * SEUILS_CONFORT.parKmhVent;
  }
  // La rafale ne compte que par son EXCÈS sur la moyenne : la moyenne a déjà
  // été facturée juste au-dessus, la compter deux fois punirait le même vent.
  const rafale = v ? v.gust : null;
  if (rafale !== null && rafale !== undefined && rafale > vent) {
    score -= (rafale - vent) * SEUILS_CONFORT.parKmhRafale;
  }

  // Le ciel. UN SEUL malus s'applique, le plus grave : l'orage contient déjà
  // la pluie, et les cumuler compterait deux fois la même averse.
  if (jeton === "thunderstorm") score -= SEUILS_CONFORT.malusOrage;
  else if (jeton === "hail" || jeton === "freezing_rain") score -= SEUILS_CONFORT.malusGlace;
  else if (JETONS_NEIGE.has(jeton)) score -= SEUILS_CONFORT.malusNeige;
  else if (JETONS_PLUIE.has(jeton)) score -= SEUILS_CONFORT.malusPluie;
  else if (JETONS_AIR_CHARGE.has(jeton)) score -= SEUILS_CONFORT.malusAirCharge;
  // LE BROUILLARD SE JUGE SUR LA VALEUR DE VISIBILITÉ, pas sur le jeton, et
  // c'est un alignement sur `conseilToken` qui prenait déjà cette précaution :
  // `mist` couvre une brume légère à 8 km, où il n'y a rien d'inconfortable.
  // Facturer 20 points sur le seul jeton était l'inverse exact du soin pris
  // dans la fonction d'à côté. Sans valeur lisible, on ne facture rien.
  else if (jeton === "fog" || jeton === "mist") {
    const vis = r.visibility;
    if (vis && !vis.isCavok && vis.value !== null && vis.value < SEUILS.brouillardM) {
      score -= SEUILS_CONFORT.malusBrouillard;
    }
  }
  else if (JETONS_COUVERT.has(jeton)) score -= SEUILS_CONFORT.malusCouvert;

  if (isDay === false) score -= SEUILS_CONFORT.malusNuit;

  // BORNÉ À [0, 100] : les pénalités s'additionnent et peuvent dépasser 100
  // sur un cas extrême (blizzard à -20 avec rafales), or « -14 % de confort »
  // n'a aucun sens. On borne, et on ne cherche pas à équilibrer les pénalités
  // pour que ça ne se produise jamais : c'est le résultat qui doit être juste,
  // pas l'arithmétique intermédiaire.
  const pct = Math.max(0, Math.min(100, Math.round(score)));

  let cle = "conf_mauvais";
  if (pct >= SEUILS_CONFORT.excellentMin) cle = "conf_excellent";
  else if (pct >= SEUILS_CONFORT.bonMin) cle = "conf_bon";
  else if (pct >= SEUILS_CONFORT.moyenMin) cle = "conf_moyen";
  else if (pct >= SEUILS_CONFORT.mediocreMin) cle = "conf_mediocre";

  return { pct, cle };
}

// Ciel de service : neutre pendant la recherche, chaud sur une panne.
// Les deux sont SOMBRES, donc polarité d'encre claire dans les deux cas.
function poserCielService(etat) {
  const html = document.documentElement;
  html.dataset.sky = etat === "panne" ? "err" : "neutral";
  html.dataset.lum = "day";
  html.dataset.pol = "dark";
}

// Rendu
// ---------------------------------------------------------------

// Une carte de rubrique : icône, intitulé, phrase déjà rédigée par l'API.
// L'icône est décorative (aria-hidden) : l'intitulé à côté dit la même chose.
// `majeur` donne à la carte le poids visuel supérieur (voir .card.majeur) :
// une seule rubrique le porte aujourd'hui, le vent.
function carteTexte(intitule, phrase, icone, majeur) {
  const div = document.createElement("div");
  div.className = majeur ? "card majeur" : "card";
  div.innerHTML =
    `<div class="row-head">` +
    `<svg class="ico ico-dt" viewBox="0 0 64 64" aria-hidden="true" focusable="false">` +
    `<use href="#${icone}"/></svg><span class="label"></span></div>` +
    `<div class="row-txt"></div>`;
  div.querySelector(".label").textContent = intitule;
  div.querySelector(".row-txt").textContent = phrase;
  return div;
}

// La carte du vent : même en-tête, mais une rose des vents en plus.
// `t` est un paramètre OBLIGATOIRE depuis le 30/07/2026 : la rose des vents
// porte les quatre points cardinaux, qui sont du TEXTE traduit. Le rendre
// facultatif aurait fait une boussole muette ou à moitié anglaise sans qu'une
// seule erreur ne se signale. Même règle que le 3e paramètre de
// `buildResponse` côté serveur, et pour la même raison.
function carteVent(intitule, phrase, vent, t) {
  // LA SEULE carte majeure de la page (29/07/2026, demande de Xavier). Le
  // vent conditionne ce qu'on fait de sa journée bien plus que la
  // visibilité ; les traiter à poids égal était une hiérarchie plate.
  const div = carteTexte(intitule, "", "d-vent", true);
  const txt = div.querySelector(".row-txt");
  txt.remove();

  const ligne = document.createElement("div");
  ligne.className = "wind-row";

  // Pas de rose si le vent est calme ou sans direction : une aiguille qui
  // pointe le nord par défaut affirmerait quelque chose de faux.
  const oriente = vent && !vent.isCalm && (vent.isVariable || vent.directionDeg !== null);
  if (oriente) ligne.append(roseDesVents(vent, t));
  const p = document.createElement("div");
  p.className = "row-txt";
  p.style.marginTop = "0";
  p.textContent = phrase;
  ligne.append(p);
  div.append(ligne);
  return div;
}

// ---------------------------------------------------------------
// LA ROSE DES VENTS (30/07/2026, demande de Xavier)
//
// Ce qui existait était un rond de 44 px avec un triangle CSS dedans. Le
// défaut n'était pas le dessin, c'était le REPÈRE : une flèche seule dans un
// cercle montre une direction sans dire par rapport à quoi, donc le lecteur ne
// peut rien en tirer. D'où les quatre lettres cardinales, qui sont l'ajout
// utile ; le reste (graduations, moyeu, chiffre) sert à les rendre lisibles.
//
// CONSTRUIT EN SVG et non par des bordures CSS : il faut des graduations à des
// angles justes, du texte placé et une aiguille orientable, tous nets à toutes
// les densités d'écran.
//
// LES DEUX RÈGLES DE L'ANCIEN CADRAN SONT CONSERVÉES, et elles n'ont pas
// changé de raison :
//  - l'aiguille montre où le vent VA (le METAR donne d'où il VIENT, d'où le
//    demi-tour) ;
//  - aucune aiguille n'existe sans direction connue (garde dans `carteVent`).
// ---------------------------------------------------------------
const SVGNS = "http://www.w3.org/2000/svg";
const elSvg = (nom, attrs) => {
  const e = document.createElementNS(SVGNS, nom);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  return e;
};

function roseDesVents(vent, t) {
  // Repère de 48, centre en (24,24). Un repère rond simplifie tous les
  // calculs d'angle et rend les valeurs ci-dessous lisibles à la relecture.
  const svg = elSvg("svg", { viewBox: "0 0 48 48", "aria-hidden": "true", focusable: "false" });
  svg.setAttribute("class", vent.isVariable ? "rose vrb" : "rose");

  svg.append(elSvg("circle", { class: "ring", cx: 24, cy: 24, r: 20 }));

  // Les huit graduations. Les quatre cardinales sont plus longues : c'est ce
  // qui permet de lire un angle intermédiaire sans compter les traits.
  for (let i = 0; i < 8; i += 1) {
    const a = (i * 45 - 90) * Math.PI / 180;
    const cardinal = i % 2 === 0;
    const r1 = cardinal ? 15.5 : 17;
    const r2 = 19;
    svg.append(elSvg("line", {
      class: "tick",
      x1: 24 + Math.cos(a) * r1, y1: 24 + Math.sin(a) * r1,
      x2: 24 + Math.cos(a) * r2, y2: 24 + Math.sin(a) * r2,
    }));
  }

  // Les quatre lettres, POSÉES À L'INTÉRIEUR de l'anneau. À l'extérieur elles
  // auraient débordé de la carte à gauche et à droite : la boussole est déjà
  // au bord. `dominant-baseline` recentre verticalement le glyphe, sans quoi
  // le nord et le sud paraîtraient décalés vers le bas de la moitié d'une
  // hauteur de lettre.
  const lettres = [
    [t.rose_n, 0, "n"], [t.rose_e, 90, ""], [t.rose_s, 180, ""], [t.rose_w, 270, ""],
  ];
  for (const [txt, deg, extra] of lettres) {
    const a = (deg - 90) * Math.PI / 180;
    const el = elSvg("text", {
      class: `card-l ${extra}`.trim(),
      x: 24 + Math.cos(a) * 11.4, y: 24 + Math.sin(a) * 11.4,
      "dominant-baseline": "central",
    });
    el.textContent = txt;
    svg.append(el);
  }

  // L'AIGUILLE. Groupe orientable autour du centre, pour que la rotation ne
  // touche ni les lettres ni les graduations — une boussole dont le nord
  // tourne n'est plus une boussole.
  const g = elSvg("g", { class: "needle" });
  g.setAttribute("style", "transform-origin: 24px 24px;");
  g.append(elSvg("line", { class: "needle-tail", x1: 24, y1: 24, x2: 24, y2: 32.5 }));
  // La tête est un triangle plein, pointe en haut : dessinée à 0° (vers le
  // nord), c'est la rotation du groupe qui l'oriente.
  g.append(elSvg("path", { class: "needle-head", d: "M24,6.5 L28.4,16.5 L19.6,16.5 Z" }));

  if (!vent.isVariable) {
    // Le demi-tour : le METAR dit d'où le vent VIENT, l'aiguille montre où il
    // VA. C'est la règle héritée de l'ancien cadran, et la seule ligne de
    // cette fonction dont une erreur inverserait le sens du vent.
    g.setAttribute("transform", `rotate(${(vent.directionDeg + 180) % 360} 24 24)`);
  }
  svg.append(g);

  // Le moyeu masque le croisement queue/tête et sert de fond au chiffre.
  svg.append(elSvg("circle", { class: "hub", cx: 24, cy: 24, r: 8.4 }));

  // LA VITESSE AU CENTRE. La boussole était la seule illustration de la page
  // à ne pas porter la valeur qu'elle illustre : on lisait la direction sur
  // le dessin et la vitesse dans la phrase à côté. Sans vitesse connue, le
  // moyeu reste vide plutôt que d'afficher un zéro qui voudrait dire calme.
  if (vent.speed !== null && vent.speed !== undefined) {
    const spd = elSvg("text", { class: "spd", x: 24, y: 24, "dominant-baseline": "central" });
    spd.textContent = String(vent.speed);
    svg.append(spd);
  }
  return svg;
}

// ---------------------------------------------------------------
// LES DEUX CARTES À CHIFFRE (30/07/2026) : indice UV et score de confort.
//
// Un seul constructeur pour les deux, parce qu'elles disent la même CHOSE
// sous deux formes : une valeur, sa place sur une échelle, une phrase. Deux
// fonctions auraient fabriqué deux dialectes visuels pour une même idée.
// ---------------------------------------------------------------

/**
 * @param intitule  l'intitulé de rubrique, déjà traduit
 * @param icone     le symbole du sprite
 * @param valeur    le nombre à afficher (déjà entier)
 * @param unite     « UV » ou « % », déjà traduite
 * @param fraction  0..1, la part de jauge franchie
 * @param phrase    la phrase déjà traduite
 * @param sousTexte facultatif : la ligne « sur quoi le calcul repose »
 */
function carteChiffre(intitule, icone, valeur, unite, fraction, phrase, sousTexte) {
  const div = carteTexte(intitule, "", icone);
  div.querySelector(".row-txt").remove();

  const ligne = document.createElement("div");
  ligne.className = "chiffre-row";

  const n = document.createElement("div");
  n.className = "chiffre";
  // textContent et non innerHTML pour le nombre, puis un <small> ajouté à
  // côté : la règle du fichier est qu'aucune valeur ne traverse innerHTML.
  n.textContent = String(valeur);
  const u = document.createElement("small");
  u.textContent = unite;
  n.append(u);

  const bloc = document.createElement("div");
  bloc.className = "chiffre-txt";

  const jauge = document.createElement("div");
  jauge.className = "jauge";
  const barre = document.createElement("i");
  // La jauge est bornée à [0, 1] ici et pas seulement chez l'appelant : une
  // fraction hors bornes ferait déborder la barre de son chemin, ce qui se
  // verrait comme un défaut d'affichage plutôt que comme une valeur fausse.
  barre.style.transform = `scaleX(${Math.max(0, Math.min(1, fraction))})`;
  jauge.append(barre);

  const p = document.createElement("p");
  p.className = "phrase";
  p.textContent = phrase;

  bloc.append(jauge, p);
  if (sousTexte) {
    // La ligne des entrées du calcul. Elle réutilise `.label`, le style
    // d'intitulé déjà mesuré : inventer une taille et une couleur ici aurait
    // produit un contraste non vérifié.
    const s = document.createElement("span");
    s.className = "label";
    s.style.display = "block";
    s.style.marginTop = ".4rem";
    s.textContent = sousTexte;
    bloc.append(s);
  }

  ligne.append(n, bloc);
  div.append(ligne);
  return div;
}

// L'ÉCHELLE UV S'ARRÊTE À 11 POUR LA JAUGE, et pas à la valeur maximale
// observable : l'OMS nomme « extrême » tout ce qui dépasse 11, donc une jauge
// graduée jusqu'à 15 écraserait toute l'échelle utile dans ses deux premiers
// tiers. Un UV de 13 remplit donc la jauge entièrement, ce qui est exact :
// c'est le maximum de ce que l'échelle sait dire.
const UV_JAUGE_MAX = 11;

function carteUv(t, uv) {
  return carteChiffre(
    t.uvLabel, "d-uv", uv.value, t.uvUnite,
    uv.value / UV_JAUGE_MAX,
    // Le jeton vient du serveur, la phrase de la table : si le serveur
    // ajoutait un sixième niveau sans qu'on traduise, on aurait une carte
    // sans phrase plutôt qu'une carte avec « undefined ».
    t[`uv_${uv.level}`] ?? "",
  );
}

function carteConfort(t, score) {
  return carteChiffre(
    t.confortLabel, "d-confort", score.pct, t.confortUnite,
    score.pct / 100,
    t[score.cle] ?? "",
    // La liste des entrées du calcul. Elle est là parce qu'un pourcentage
    // sans énoncé de ses entrées demande une confiance qu'il n'a pas méritée.
    t.confortBase,
  );
}

// La carte des mesures : trois colonnes chiffrées sous une seule rubrique.
function carteMesures(intitule, mesures) {
  const div = carteTexte(intitule, "", "d-mesures");
  div.querySelector(".row-txt").remove();
  const bloc = document.createElement("div");
  bloc.className = "mesures";
  for (const [etiquette, valeur] of mesures) {
    const col = document.createElement("div");
    col.className = "mesure";
    col.innerHTML = `<span class="label"></span><b></b>`;
    col.querySelector(".label").textContent = etiquette;
    col.querySelector("b").textContent = valeur;
    bloc.append(col);
  }
  div.append(bloc);
  return div;
}

function rendreNotice(titre, suite, options) {
  const o = options ?? {};
  $("card").hidden = true;
  $("skel").hidden = true;
  $("notice").hidden = false;
  $("notice").textContent = "";

  if (o.marque) {
    const m = document.createElement("div");
    m.className = o.marque === "attente" ? "mark attente" : "mark";
    m.textContent = o.marque === "attente" ? "" : "!";
    $("notice").append(m);
  }
  const b = document.createElement("b");
  b.textContent = titre;
  const s = document.createElement("span");
  s.textContent = suite;
  $("notice").append(b, s);

  if (o.action) {
    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = "cta plein";
    bouton.textContent = o.action;
    bouton.addEventListener("click", o.onAction);
    $("notice").append(bouton);
  }
}

function afficherEchec(code, status, lang) {
  const t = T(lang);
  const [titre, suite] = t[code] ?? t.inattendu;
  const detail = status ? remplir(t.codeHttp, { status }) : "";
  dernierEchec = { code, status };
  poserCielService("panne");
  rendreNotice(titre + detail, suite, {
    marque: "erreur",
    // « Réessayer » n'a de sens que si l'on sait quoi réessayer ; sans
    // position connue, on renvoie vers la feuille de localisation.
    action: t.reessayer,
    onAction: () => (dernierePosition ? consulter(...dernierePosition) : ouvrirFeuille()),
  });
}

function afficherChargement(lang) {
  poserCielService("attente");
  $("notice").hidden = true;
  $("card").hidden = true;
  $("skel").hidden = false;
  $("skelTxt").textContent = T(lang).chargement;
}

// LE METAR, FONCTION D'EXPERT (29/07/2026). Il n'ouvre plus la page : il
// se déplie. `aria-expanded` porte l'état pour les technologies
// d'assistance, `hidden` pour tout le monde ; les deux sont réglés au même
// endroit pour qu'ils ne puissent pas se contredire.
function majRawToggle(lang) {
  const ouvert = !$("rawWrap").hidden;
  // LE LIBELLÉ VA DANS SON <span>, JAMAIS SUR LE BOUTON (30/07/2026). Depuis
  // qu'il porte une icône et un chevron, un `textContent` sur le bouton les
  // effacerait tous les deux — et à la PREMIÈRE bascule de langue seulement,
  // donc dans un cas qu'on ne rencontre pas en développant. C'est exactement
  // le piège déjà rencontré sur `openSheet` le 29/07/2026.
  $("rawToggleTxt").textContent = ouvert ? T(lang).cacherMetar : T(lang).voirMetar;
  $("rawToggle").setAttribute("aria-expanded", String(ouvert));
}

// Même dépliant, même règle, pour les coordonnées passées en mode expert.
function majCoordToggle(lang) {
  const ouvert = !$("coordWrap").hidden;
  $("coordToggleTxt").textContent = ouvert ? T(lang).cacherCoord : T(lang).voirCoord;
  $("coordToggle").setAttribute("aria-expanded", String(ouvert));
}

// Applique la langue à tout ce qui ne dépend PAS d'une réponse de l'API :
// commandes, intitulés, et l'écran de service en cours.
function appliquerChrome(lang) {
  const t = T(lang);
  document.documentElement.lang = lang;
  for (const b of $("langs").children) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  $("rawLabel").textContent = t.rawLabel;
  $("sunLabel").textContent = t.sunLabel;
  $("stationLabel").textContent = t.stationLabel;
  $("badge").textContent = t.badge;
  // Le libellé du dépliant dépend de son ÉTAT, pas seulement de la langue :
  // basculer en anglais alors que le METAR est ouvert doit donner « Hide »
  // et non « Show ». C'est la régression du 28/07/2026 (la page à moitié
  // française) sous une autre forme : tout libellé statique se règle ICI.
  majRawToggle(lang);
  // TEXTCONTENT INTERDIT sur ce bouton : il contient une icône, et la lui
  // écraser la ferait disparaître à la première bascule de langue.
  $("openSheetTxt").textContent = t.changerLieu;
  $("sheetTitre").textContent = t.ouEtesVous;
  $("closeSheet").textContent = t.fermer;
  $("hereTxt").textContent = t.boutonIci;
  $("go").textContent = t.boutonConsulter;
  $("skelTxt").textContent = t.chargement;
  $("sources").textContent = t.sources;
  $("lat").setAttribute("aria-label", t.labelLat);
  $("lon").setAttribute("aria-label", t.labelLon);
  // Recherche de ville. Le repère de saisie et le nom accessible sont
  // traduits, contrairement à « latitude »/« longitude » qui restent des
  // termes techniques identiques dans les deux langues.
  $("ville").placeholder = t.champVille;
  $("ville").setAttribute("aria-label", t.labelVille);
  $("chercher").textContent = t.boutonChercher;
  majCoordToggle(lang);
  // Un message de recherche déjà affiché doit suivre la bascule de langue,
  // sinon il resterait figé dans l'autre. On le REJOUE plutôt que de le
  // traduire : seule sa clé est mémorisée, jamais son texte.
  if (derniereCleVille) messageVille(derniereCleVille, lang);
  $("langs").setAttribute("aria-label", t.labelLangue);
  // Les repères de saisie restent en minuscules et identiques dans les deux
  // langues (« latitude », « longitude ») : ce sont des termes techniques.
  if ($("card").hidden && $("skel").hidden) {
    if (dernierEchec) afficherEchec(dernierEchec.code, dernierEchec.status, lang);
    else {
      // Le ciel se remet au neutre AVEC le message : sans cette ligne, un
      // écran d'accueil réaffiché après une panne gardait le fond chaud de
      // la panne et disait donc deux choses contradictoires à la fois.
      poserCielService("attente");
      rendreNotice(t.chercheTitre, t.chercheSuite, { marque: "attente" });
    }
  }
}

// Position du soleil sur sa course, en fraction de 0 à 1.
// Renvoie null aux hautes latitudes, où lever et coucher peuvent manquer
// (jour ou nuit polaire) : on n'invente pas une course qui n'existe pas.
function fractionDuJour(obs, lever, coucher) {
  if (!obs || !lever || !coucher) return null;
  const min = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const a = min(lever), b = min(coucher), t = min(obs);
  if (b <= a) return null; // course à cheval sur minuit : on s'abstient
  return Math.min(1, Math.max(0, (t - a) / (b - a)));
}

// Pose le disque sur l'arc, et coupe le trait plein là où il en est.
// On interroge le tracé (getPointAtLength) au lieu de recalculer la courbe
// à côté : deux formules finiraient par diverger, un seul chemin non.
function poserSoleil(f) {
  const arc = $("arcFull"), plein = $("arcDone");
  const L = arc.getTotalLength();
  const p = arc.getPointAtLength(L * f);
  $("sunDot").setAttribute("cx", p.x); $("sunDot").setAttribute("cy", p.y);
  $("sunHalo").setAttribute("cx", p.x); $("sunHalo").setAttribute("cy", p.y);
  plein.setAttribute("stroke-dasharray", `${L * f} ${L}`);
}

function afficher(r, lang) {
  const t = T(lang);

  // 1. La lumière ET le ciel viennent de la STATION, pas du navigateur.
  poserCiel(r.icon, r.sun ? r.sun.isDay : null);
  document.documentElement.lang = lang;

  dernierEchec = null;
  $("notice").hidden = true;
  $("skel").hidden = true;
  $("card").hidden = false;

  $("raw").textContent = r.raw;
  $("headline").textContent = r.text.headline || t.headlineDefaut;
  const aTemp = r.temperature && r.temperature.value !== null;
  $("tempV").textContent = aTemp ? String(r.temperature.value) : "";
  $("tempDeg").hidden = !aTemp;

  // 1 bis. L'icône de tête. Repli sur #i-unknown pour un jeton inconnu ou
  // nul : c'est un nuage en pointillé, donc un dessin et jamais un carré
  // vide. Même réflexe que le repli `neutral` de la table CIELS.
  const jetonSur = r.icon && document.getElementById(`i-${r.icon}`) ? r.icon : "unknown";
  $("heroUse").setAttribute("href", `#i-${jetonSur}`);
  // Le halo ne s'allume en ambre que si le dessin contient un astre ou un
  // éclair. Ailleurs il reste neutre : voir .hero-ico.astre.
  document.querySelector(".temp-row").classList.toggle("astre", JETONS_ASTRE.has(jetonSur));

  // 1 ter. La phrase de conseil. Jeton d'abord, mot ensuite : si le
  // sélecteur ne trouve rien de notable à dire, la ligne DISPARAÎT plutôt
  // que d'occuper la place avec une banalité.
  const conseil = conseilToken(r);
  const phraseConseil = conseil ? t[`c_${conseil}`] : null;
  $("conseil").textContent = phraseConseil ?? "";
  // C'est la LIGNE ENTIÈRE qui se masque, mascotte comprise (30/07/2026).
  // Masquer la seule phrase laisserait le petit nuage sourire dans le vide,
  // ce qui est pire qu'une ligne absente : un personnage sans réplique donne
  // l'impression d'un texte qui n'a pas chargé.
  $("conseilRow").hidden = !phraseConseil;
  // La mascotte se branche sur le jeton DÉJÀ calculé, elle n'en recalcule
  // aucun : c'est ce qui garantit qu'elle ne peut pas avoir l'air content
  // pendant que la phrase annonce un orage. Repli `m-neutre` pour tout jeton
  // absent de la table, y compris un jeton futur qu'on aurait oublié d'y
  // ranger — même réflexe que le repli `#i-unknown`.
  $("mascotteUse").setAttribute("href", `#${EXPRESSIONS[conseil] ?? "m-neutre"}`);

  // 1 quater. Le badge : ce que cette application est seule à pouvoir dire.
  $("badge").textContent = t.badge;

  // 2. Provenance : quelle station, à quelle distance, et de quand date la
  // mesure. Chaque morceau est une phrase entière du dictionnaire.
  // L'HEURE LOCALE N'EST PLUS AFFICHÉE (elle demandait une soustraction au
  // lecteur) mais elle reste LUE : c'est elle qui place le soleil sur son
  // arc, plus bas. Ne pas la croire inutilisée.
  const s = r.station;
  $("lieu").textContent = remplir(t.lieu, { nom: s.name ?? s.icao ?? t.stationInconnue });

  // La distance passe en capsule, arrondie au kilomètre. `nombre` reste
  // nécessaire malgré l'arrondi : il vaut aussi pour les distances à trois
  // chiffres et garde la règle du séparateur décimal en un seul endroit.
  const aDistance = s.distanceKm !== null;
  $("capsule").hidden = !aDistance;
  if (aDistance) {
    $("capsuleTxt").textContent =
      remplir(t.capsuleKm, { km: nombre(Math.round(s.distanceKm), lang) });
  }

  // Fraîcheur, en une seule phrase. `ageMinutes` peut manquer sur un METAR
  // dont l'horodatage est illisible : on le dit plutôt que d'écrire
  // « il y a null min ».
  const aAge = r.ageMinutes !== null && r.ageMinutes !== undefined;
  $("obs").textContent = !aAge
    ? t.majInconnue
    : remplir(r.isStale ? t.majPerime : t.maj, { min: r.ageMinutes });
  $("obs").className = r.isStale ? "obs stale" : "obs";

  // 3. Le relevé. Une carte n'apparaît que si le backend a quelque chose à
  // en dire : un METAR muet sur les nuages ne produit pas de carte vide.
  // Chaque entrée pointe une phrase DÉJÀ écrite par le backend (bloc `text`),
  // jamais une valeur à formater ici ; seul l'INTITULÉ appartient à la page.
  const dl = $("report");
  dl.textContent = "";

  // LE CONFORT EN TÊTE DU RELEVÉ (30/07/2026). C'est une SYNTHÈSE des autres
  // cartes : la mettre après elles obligerait à lire le détail avant le
  // résumé. Elle disparaît entièrement si une de ses cinq entrées manque,
  // voir `confortScore` — un pourcentage calculé sur trois entrées sur cinq
  // afficherait une précision que la donnée n'a pas.
  const score = confortScore(r);
  if (score) dl.append(carteConfort(t, score));

  if (r.text.wind) dl.append(carteVent(t.ligneVent, r.text.wind, r.wind, t));

  // Ligne de synthèse chiffrée, composée ici parce qu'elle n'existe pas
  // comme phrase dans le contrat : ce sont des VALEURS, pas du texte.
  const temp = r.temperature, mesures = [];
  if (temp && temp.feelsLike !== null) mesures.push([t.labelRessenti, remplir(t.valRessenti, { v: temp.feelsLike })]);
  if (temp && temp.humidity !== null) mesures.push([t.labelHumidite, remplir(t.valHumidite, { v: temp.humidity })]);
  if (r.pressure && r.pressure.value !== null) mesures.push([t.labelPression, remplir(t.valPression, { v: r.pressure.value })]);
  if (mesures.length) dl.append(carteMesures(t.ligneMesures, mesures));

  // L'EMPLACEMENT DE L'UV, et non la carte elle-même. L'indice UV vient d'un
  // AUTRE point d'entrée, appelé en parallèle : il peut arriver après cet
  // affichage, ou jamais. Réserver sa place ici plutôt que d'ajouter la carte
  // à la fin quand elle arrive lui garantit une position STABLE dans la page
  // — sinon l'ordre des cartes dépendrait de la latence du réseau, donc
  // changerait d'une consultation à l'autre.
  const slot = document.createElement("div");
  slot.id = "uvSlot";
  // `hidden` et pas un simple vide : un conteneur vide dans une grille avec
  // gouttière laisserait un trou visible entre deux cartes.
  slot.hidden = true;
  dl.append(slot);
  majCarteUv(lang);

  const SUITE = [
    [t.ligneVisibilite, r.text.visibility, "d-visibilite"],
    [t.ligneNuages, r.text.clouds, "d-nuages"],
    [t.lignePhenomenes, r.text.phenomena, "d-phenomenes"],
  ];
  for (const [intitule, phrase, icone] of SUITE) {
    if (!phrase) continue;
    dl.append(carteTexte(intitule, phrase, icone));
  }

  // 4. La course du soleil, à la position de la station.
  const f = r.sun ? fractionDuJour(r.observedLocal, r.sun.sunrise, r.sun.sunset) : null;
  $("sun").hidden = f === null;
  if (f !== null) {
    poserSoleil(f);
    $("sunrise").textContent = remplir(t.lever, { heure: r.sun.sunrise });
    $("sunset").textContent = remplir(t.coucher, { heure: r.sun.sunset });
  }

  // 5. Détail technique, pour la mise au point.
  $("tech").textContent =
    `${r.station.icao ?? "—"} · ${r.icon} · ${r.station.bearingDeg}° · ${r.station.timezone ?? t.fuseauInconnu}` +
    (r.warnings.length ? ` · ${r.warnings.join(" · ")}` : "");
}

// ---------------------------------------------------------------
// OÙ VIT L'API (29/07/2026, application Android)
//
// Sur le web, la page et la fonction sont sur le même domaine : une adresse
// RELATIVE suffit, et c'est ce qui a toujours été écrit.
// Dans l'APK, non. Capacitor sert la page depuis un serveur de fichiers
// INTERNE au téléphone, à l'origine `https://localhost`, et cet APK ne
// contient aucune fonction serveur : `/api/nearest` y tomberait dans le
// vide. Il faut donc l'adresse absolue de Vercel.
// ---------------------------------------------------------------

// Origine du serveur de fichiers embarqué par Capacitor (défaut Android :
// schéma `https`, hôte `localhost`). Si ces valeurs changent un jour dans
// capacitor.config.ts, c'est CETTE constante qu'il faut suivre.
const ORIGINE_APK = "https://localhost";

// Adresse de production, vérifiée le 29/07/2026 (200, LFST). C'est la
// SEULE URL en dur du code : la page web, elle, ne s'en sert jamais.
const API_PROD = "https://metar-proche-three.vercel.app";

function baseApi() {
  // Lu à l'APPEL et non au chargement : le pont natif de Capacitor s'injecte
  // dans la page, et rien ne garantit qu'il existe déjà quand ce script est
  // évalué. Le lire au dernier moment supprime la question.
  const natif = !!(window.Capacitor && window.Capacitor.isNativePlatform
    && window.Capacitor.isNativePlatform());
  if (!natif) return ""; // page web ordinaire : relatif, comme avant

  // LE PIÈGE DU LIVE RELOAD, et la raison pour laquelle on ne teste pas
  // seulement « suis-je dans une application ». Avec le rechargement à chaud,
  // la WebView charge le serveur vite du poste de développement, où
  // /api/nearest route vers le VRAI handleNearest. Renvoyer l'adresse de
  // production dans ce cas ferait croire qu'on teste son code local pendant
  // qu'on interroge la production : un modification d'api/ resterait sans
  // effet visible, sans le moindre message d'erreur.
  // La bonne question n'est donc pas « suis-je natif » mais « suis-je servi
  // par le serveur de fichiers de l'APK ».
  if (location.origin !== ORIGINE_APK) return "";

  return API_PROD;
}

// ---------------------------------------------------------------
// L'INDICE UV (30/07/2026)
//
// APPEL SÉPARÉ ET NON BLOQUANT, arbitrage de Xavier. La météo ne l'attend
// jamais : les deux requêtes partent ensemble, celle du METAR s'affiche dès
// qu'elle revient, et l'UV vient se poser après s'il revient. Une source
// lente ou en panne ne peut donc pas dégrader le service qui existait avant
// elle. C'est aussi pour ça qu'un échec UV est SILENCIEUX — pas de message,
// pas de carte : l'utilisateur venu voir la météo l'a déjà sous les yeux, et
// lui annoncer la panne d'un supplément serait du bruit.
//
// LA GÉNÉRATION EST LA GARDE ESSENTIELLE, et sans elle le défaut serait
// difficile à voir : deux consultations rapprochées (bascule de langue, choix
// d'une ville) lancent deux appels UV. Si le premier revient APRÈS le second,
// il écrirait l'UV de Brumath sur la page de Reykjavik. Un compteur
// incrémenté à chaque consultation suffit : une réponse dont la génération
// n'est plus la courante est jetée.
// ---------------------------------------------------------------
let generationUv = 0;
// Le dernier UV connu pour la position affichée, ou null. Mémorisé et non
// seulement posé : `afficher` est rappelé à chaque bascule de langue, et sans
// cette mémoire la carte disparaîtrait puis réapparaîtrait à chaque fois.
let uvCourant = null;

/**
 * (Re)pose la carte UV dans son emplacement réservé. Idempotente : on peut
 * l'appeler autant de fois qu'on veut, y compris avant que l'UV n'existe.
 */
function majCarteUv(lang) {
  const slot = document.getElementById("uvSlot");
  if (!slot) return; // le relevé n'est pas affiché (chargement, panne)
  slot.textContent = "";
  slot.hidden = uvCourant === null;
  if (uvCourant === null) return;
  slot.append(carteUv(T(lang), uvCourant));
}

async function chargerUv(lat, lon, lang, generation) {
  try {
    const res = await fetch(`${baseApi()}/api/uv?lat=${lat}&lon=${lon}`);
    if (generation !== generationUv) return; // réponse périmée : on la jette
    if (!res.ok) return;                     // échec silencieux, voir plus haut
    const body = await res.json();
    if (generation !== generationUv) return; // la lecture du corps prend du temps
    // On vérifie la FORME et pas seulement le code HTTP : notre propre point
    // d'entrée pourrait un jour changer, et une carte affichant « undefined UV »
    // serait pire que pas de carte.
    if (typeof body.value !== "number" || typeof body.level !== "string") return;
    uvCourant = body;
    majCarteUv(lang);
  } catch {
    // Hors ligne, ou service inaccessible. Silencieux, toujours pour la même
    // raison : la météo est déjà affichée.
  }
}

async function consulter(lat, lon) {
  // La langue est LUE UNE FOIS ici, puis transmise partout : la requête et
  // l'affichage parlent forcément la même, même si les pastilles changent
  // pendant que la réponse voyage.
  const lang = langue;
  dernierePosition = [lat, lon];
  appliquerChrome(lang);
  afficherChargement(lang);
  $("lat").value = lat.toFixed(2);
  $("lon").value = lon.toFixed(2);
  const url = `${baseApi()}/api/nearest?lat=${lat}&lon=${lon}&lang=${lang}&units=metric`;

  // L'UV PART EN MÊME TEMPS, et surtout SANS `await` : c'est cette absence
  // d'attente qui rend l'appel non bloquant. L'UV connu de la position
  // précédente est oublié tout de suite, sinon on afficherait l'UV de
  // Brumath au-dessus de la météo de Sydney le temps que le nouveau arrive.
  generationUv += 1;
  uvCourant = null;
  void chargerUv(lat, lon, lang, generationUv);

  try {
    const res = await fetch(url);
    // On lit d'abord en TEXTE. Un serveur en panne renvoie une page HTML, et
    // `res.json()` lèverait : l'incident du 27/07/2026 a montré qu'un plantage
    // à 500 se retrouvait alors affiché comme « source météo injoignable »,
    // c'est-à-dire en accusant la source d'une faute qui était la nôtre.
    const texte = await res.text();
    let body = null;
    try { body = JSON.parse(texte); } catch { /* ce n'est pas du JSON */ }

    if (body === null) return afficherEchec("serveur", res.status, lang);
    if (!res.ok) return afficherEchec(body.error, null, lang);
    afficher(body, lang);
  } catch {
    // Ici, et ici seulement, la requête n'a jamais abouti : navigateur hors
    // ligne, ou service inaccessible. C'est le seul vrai cas « injoignable ».
    afficherEchec("hors_ligne", null, lang);
  }
}

function localiser() {
  fermerFeuille();
  if (!navigator.geolocation) return consulter(48.73, 7.71);
  afficherChargement(langue);
  navigator.geolocation.getCurrentPosition(
    (p) => consulter(p.coords.latitude, p.coords.longitude),
    // Refus ou échec : on sert quand même quelque chose plutôt qu'un écran
    // mort. Décision déjà prise et toujours valable : la maquette propose un
    // écran « GPS refusé », qui la contredirait.
    () => consulter(48.73, 7.71),
    { timeout: 8000 },
  );
}

// ---------------------------------------------------------------
// La feuille. `hidden` est retiré AVANT la classe pour que la transition
// ait un état de départ à animer ; il est remis à la fin de la fermeture.
// ---------------------------------------------------------------
let fermetureEnCours = null;
function ouvrirFeuille() {
  clearTimeout(fermetureEnCours);
  $("sheet").hidden = false;
  // On force un CALCUL de mise en page plutôt que d'attendre une frame
  // (requestAnimationFrame) : lire offsetHeight oblige le navigateur à
  // fixer l'état de départ tout de suite, donc la transition part bien de
  // translateY(110%). Un rAF ne se déclenche PAS dans un onglet qui ne
  // compose pas d'image, et la feuille resterait alors hors écran.
  void $("sheet").offsetHeight;
  $("sheet").classList.add("on");
  $("veil").classList.add("on");
}
function fermerFeuille() {
  $("sheet").classList.remove("on");
  $("veil").classList.remove("on");
  fermetureEnCours = setTimeout(() => { $("sheet").hidden = true; }, 700);
}

// ---------------------------------------------------------------
// RECHERCHE DE VILLE (29/07/2026)
//
// La page n'interroge JAMAIS le géocodeur directement, bien qu'il accepte
// les appels navigateur : passer par /api/geocode évite d'envoyer la saisie
// de l'utilisateur et son adresse IP à un tiers. C'est l'engagement pris au
// moment du choix de la source, et `baseApi()` s'applique donc ici aussi.
//
// PAS D'AUTOCOMPLÉTION À LA FRAPPE, et c'est un choix : ce serait une requête
// par caractère contre un service gratuit, pour un gain nul quand on tape un
// nom qu'on connaît déjà. On valide par le bouton ou par Entrée.
// ---------------------------------------------------------------

// Vrai tant qu'une recherche est en vol. Empêche qu'un double appui n'en
// lance deux, dont la plus lente écraserait la plus récente.
let rechercheEnVol = false;

// On mémorise la CLÉ du message affiché, jamais son texte. C'est ce qui
// permet de le rejouer dans l'autre langue quand l'utilisateur bascule : le
// même réflexe que `dernierEchec` pour l'écran de panne. Retenir la phrase
// aurait laissé un message figé en français au milieu d'une page anglaise,
// c'est-à-dire la régression du 28/07 en miniature.
let derniereCleVille = null;

function messageVille(cle, lang) {
  derniereCleVille = cle;
  const texte = cle ? T(lang ?? langue)[cle] : "";
  $("villeMsg").textContent = texte;
  $("villeMsg").hidden = !texte;
}

// Vide la liste de choix. Appelée à chaque nouvelle recherche : sans ça, les
// résultats de la requête précédente resteraient cliquables sous les
// nouveaux, et mèneraient ailleurs que ce que le champ affiche.
function viderChoix() {
  $("choix").textContent = "";
  $("choix").hidden = true;
}

// La ligne d'homonymie : « Texas, United States ». Les deux champs peuvent
// manquer, d'où le filtrage AVANT la jointure — sinon on obtiendrait une
// virgule orpheline en tête ou en queue.
const lieuDetail = (p) => [p.admin1, p.country].filter(Boolean).join(", ");

function afficherChoix(places, lang) {
  viderChoix();
  messageVille("plusieursVilles", lang);
  for (const p of places) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    // textContent et non innerHTML : ces chaînes viennent du réseau.
    b.textContent = p.name;
    const detail = lieuDetail(p);
    if (detail) {
      const s = document.createElement("small");
      s.textContent = detail;
      b.append(s);
    }
    b.addEventListener("click", () => {
      fermerFeuille();
      viderChoix();
      messageVille(null);
      consulter(p.latitude, p.longitude);
      // NB : `consulter` renseigne #lat et #lon, donc la bascule de langue
      // (qui les relit) continue de fonctionner après une recherche.
    });
    li.append(b);
    $("choix").append(li);
  }
  $("choix").hidden = false;
}

async function chercherVille() {
  if (rechercheEnVol) return;
  // La langue est lue UNE FOIS, comme dans `consulter` : la réponse de la
  // source dépend d'elle (les régions y sont traduites), donc une bascule
  // pendant le voyage mélangerait les deux langues à l'écran.
  const lang = langue;
  const nom = $("ville").value.trim();
  viderChoix();
  if (!nom) return messageVille("villeSaisieVide", lang);

  rechercheEnVol = true;
  messageVille("rechercheEnCours", lang);
  try {
    const url = `${baseApi()}/api/geocode?q=${encodeURIComponent(nom)}&lang=${lang}`;
    const res = await fetch(url);
    // Même prudence que dans `consulter` : on lit en TEXTE d'abord, car un
    // serveur en panne renvoie du HTML et `res.json()` lèverait.
    const texte = await res.text();
    let body = null;
    try { body = JSON.parse(texte); } catch { /* pas du JSON */ }

    if (body === null) return messageVille("villePanne", lang);
    if (!res.ok) {
      // « Introuvable » et « en panne » ne se confondent pas : le premier est
      // une faute de frappe, le second n'a rien à voir avec la saisie.
      return messageVille(
        body.error === "city_not_found" ? "villeIntrouvable"
          : body.error === "invalid_query" ? "villeSaisieVide"
            : "villePanne",
        lang);
    }

    const places = body.results ?? [];
    if (places.length === 0) return messageVille("villeIntrouvable", lang);
    // UNE seule correspondance : on y va directement. C'est le cas courant,
    // et faire choisir entre un seul élément serait une étape pour rien.
    if (places.length === 1) {
      fermerFeuille();
      messageVille(null);
      return consulter(places[0].latitude, places[0].longitude);
    }
    afficherChoix(places, lang);
  } catch {
    messageVille("villePanne", lang);
  } finally {
    rechercheEnVol = false;
  }
}

$("villeForm").addEventListener("submit", (e) => {
  // Sans ceci, la validation par Entrée rechargerait la page : le <form>
  // sert à obtenir Entrée gratuitement, pas à naviguer.
  e.preventDefault();
  chercherVille();
});

$("coordToggle").addEventListener("click", () => {
  $("coordWrap").hidden = !$("coordWrap").hidden;
  majCoordToggle(langue);
});

$("rawToggle").addEventListener("click", () => {
  $("rawWrap").hidden = !$("rawWrap").hidden;
  majRawToggle(langue);
});

$("openSheet").addEventListener("click", ouvrirFeuille);
$("closeSheet").addEventListener("click", fermerFeuille);
$("veil").addEventListener("click", fermerFeuille);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerFeuille(); });

$("go").addEventListener("click", () => {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  fermerFeuille();
  consulter(lat, lon);
});
$("here").addEventListener("click", localiser);

$("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === langue) return;
  langue = b.dataset.lang;
  const lat = Number($("lat").value), lon = Number($("lon").value);
  // Le chrome bascule TOUT DE SUITE, même sans position valide à consulter :
  // sinon changer de langue sur l'écran d'échec ne ferait rien du tout.
  if (Number.isFinite(lat) && Number.isFinite(lon)) consulter(lat, lon);
  else appliquerChrome(langue);
});

appliquerChrome(langue);
localiser();
</script>
</body>
</html>
