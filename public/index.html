  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
    U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url(/fonts/jetbrains-mono-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
    U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
    U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* ------------------------------------------------------------------
   Jetons du système. Les noms sont ceux du panneau « Variables CSS » de
   la maquette : reprendre le vocabulaire fait partie de l'application du
   système, ça évite qu'un jeton parte dans deux directions.
   ------------------------------------------------------------------ */
:root {
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;

  /* ÉCHELLE TYPOGRAPHIQUE, figée le 29/07/2026. Elle ne CHANGE presque rien
     au rendu, et c'est voulu : la page était déjà cohérente à une valeur
     près (12,5 px sur la ligne brute, seule taille hors gamme, ramenée à
     12). Son intérêt est ailleurs — la prochaine addition n'aura pas à
     réinventer une taille, elle en prendra une dans la liste. Les deux
     tailles fluides (titre, chiffre géant) restent en clamp() : elles
     dépendent de la largeur d'écran, pas de l'échelle.
     Les tailles sont en px et non en rem : elles doivent suivre le réglage
     de police du navigateur sans que la mise en page ne se disloque, et
     les cartes sont déjà dimensionnées par leur contenu. */
  --fs-micro: 9px;    /* intitulés des trois mesures chiffrées */
  --fs-label: 10px;   /* .label, capsule */
  --fs-mono: 11px;    /* commandes en chasse fixe */
  --fs-petit: 12px;   /* capsule, bornes du soleil, ligne brute */
  --fs-annexe: 14px;  /* fraîcheur */
  --fs-corps: 15px;   /* conseil, boutons, saisies */
  --fs-fort: 17px;    /* phrases des rubriques, nom de station */
  --fs-majeur: 19px;  /* la seule rubrique majeure : le vent */
  --fs-titre2: 22px;  /* titre de la feuille */
  --fs-titre1: 24px;  /* titre des écrans de service */

  --radius-card: 24px;
  /* Rayon des CONTRÔLES, ajouté le 29/07/2026 en passant sur la cohérence
     visuelle : les boutons étaient à 20 px et les champs de saisie à 18,
     sans raison. Un jeton, une valeur, plus de dérive possible. */
  --radius-ctl: 20px;
  --radius-sheet: 32px;
  --radius-pill: 999px;
  --card-blur: 24px;
  --space: 8px;

  --ease-sky: cubic-bezier(.2, .85, .2, 1);
  --dur-enter: 700ms;
  --dur-tap: 180ms;

  /* Réglages par défaut du ciel, écrasés par chaque [data-sky]. */
  --sky: linear-gradient(180deg, #101827 0%, #1C2941 60%, #2A3A57 100%);
  --glow: none;
  --fx: none;
  --fx-op: 0;
  --fx-anim: none;
  --c1: .12;   /* opacité du premier banc de nuages */
  --c2: .08;   /* opacité du second */
}

/* ------------------------------------------------------------------
   POLARITÉ D'ENCRE — le trou que la maquette ne montre pas.

   Elle ne dessine ses cartes de verre que sur CAVOK, un ciel bleu moyen.
   Or deux de ses huit ciels (fg, sn) sont presque blancs et passent
   l'encre en sombre. Sur ceux-là, `background: rgba(255,255,255,.13)` et
   `border: rgba(255,255,255,.2)` donnent du blanc sur blanc : la carte
   DISPARAÎT. Ses fondations ne règlent pas le cas, elles se contentent
   de déclarer --ink-on-dark et --ink-on-light.

   D'où un second jeu de jetons, choisi par la POLARITÉ et non par la
   condition : encre, verre, bordures et voile de lecture changent
   ensemble. Un seul endroit à corriger le jour où un ciel s'ajoute.

   TOUTES les valeurs ci-dessous sont MESURÉES et non estimées : une sonde
   a composé, pour les dix ciels x jour/nuit x 21 hauteurs d'écran, le
   dégradé + le voile de nuit + le voile de lecture + le verre de la
   carte, puis calculé le rapport WCAG réel. Les pires cas retenus sont
   dans le rapport de la session. Ne pas retoucher un de ces nombres
   sans repasser la sonde : ils tiennent ENSEMBLE, pas séparément.
   ------------------------------------------------------------------ */
:root, [data-pol="dark"] {           /* encre CLAIRE sur ciel SOMBRE */
  --ink: #FFFFFF;
  --ink-soft: rgba(255, 255, 255, .92);
  --ink-faint: rgba(255, 255, 255, .88);
  --card-bg: rgba(255, 255, 255, .14);
  --card-bg-strong: rgba(255, 255, 255, .22);
  /* Deux épaisseurs de bordure et non une : la maquette n'en connaît
     qu'une (.20), qui suffit sur son ciel bleu moyen et disparaît
     ailleurs. --ctl-border est celle des CONTRÔLES (boutons, saisies),
     tenue au-dessus de 3:1 parce qu'un bouton dont on ne voit pas le
     bord n'est plus un bouton. */
  --card-border: rgba(255, 255, 255, .46);
  --ctl-border: rgba(255, 255, 255, .58);
  --hair: rgba(255, 255, 255, .22);
  --btn-bg: #EAF2FB;
  --btn-ink: #0B1728;
  /* Les DEUX ACCENTS des icônes (astre, humide). Ils étaient validés le
     28/07/2026 puis PERDUS le jour même : le système de design a retiré
     l'icône de tête, plus rien ne les consommait, et personne n'a vu que
     `.c-sun`/`.c-wet` retombaient sur le repli `currentColor`. Le sprite
     serait donc redevenu monochrome à la seconde où l'on repose une icône
     météo. Ils reviennent ici, et attachés à la POLARITÉ et non à la
     condition : c'est le même axe qui décide déjà de l'encre et du verre,
     donc un seul endroit à corriger. Valeurs mesurées, voir CLAUDE.md. */
  --ico-sun: #F5A623;   /* ambre clair, sur ciel sombre */
  --ico-wet: #7FB3E8;   /* bleu éclairci, sur ciel sombre */
  /* ACCENT DE GUIDAGE (30/07/2026, demande de Xavier : « une couleur
     d'accent très discrète pour guider le regard »). Il ne fabrique AUCUNE
     couleur nouvelle : c'est --ico-sun, l'ambre déjà mesuré dans les deux
     polarités (9,34 de nuit, 3,23 de jour). Xavier a tranché en ce sens
     plutôt que pour une troisième teinte, et le gain n'est pas qu'un mesurage
     économisé : la page reste à DEUX accents, donc l'œil apprend un signal
     au lieu d'en démêler trois.
     RÈGLE D'EMPLOI, et elle n'est pas négociable : cet accent ne porte QUE
     des éléments GRAPHIQUES (filets, jauges, points, contours), jamais du
     texte. Le cuivre de jour tient 3,23:1, ce qui passe le seuil de 3:1 des
     éléments graphiques et échoue au 4,5:1 du texte. Écrire un mot en
     --accent serait donc une régression d'accessibilité invisible à l'œil.

     IL N'EST PAS ALIASÉ SUR --ico-sun, et il l'a été pendant une heure : la
     sonde a tranché. L'ambre des icônes est validé dans SON contexte, mesuré
     le 28/07 sur le ciel réellement affiché ce jour-là. Repassé sur les 20
     combinaisons de ciel x 21 hauteurs, sur fond de CARTE, il tombe à 2,25:1
     en polarité sombre (sct de jour, verre renforcé) et 2,16 en polarité
     claire (sn de jour). Sous le seuil de 3:1, donc inutilisable pour un
     accent qui, lui, se pose partout.
     Ce sont donc DEUX jetons de la même famille de teinte, à une clarté
     près : --ico-sun reste ce que Xavier a validé, --accent est la valeur la
     plus CHAUDE de cette famille qui passe le seuil sur tous les fonds de
     carte. Mesuré : 3,12:1 (pire cas sct/jour sur verre renforcé). Les
     candidats plus chauds ont été essayés et rejetés par la mesure —
     #FFC466 donne 2,89, ce qui est le genre d'écart que l'œil ne voit pas. */
  --accent: #FFCE80;
  /* REMPLISSAGE DES RANGÉES DÉPLIABLES (30/07/2026). Xavier demandait « un
     fond légèrement plus clair » sur le bouton du METAR. Éclaircir est
     exactement ce qu'il ne faut PAS faire ici, et la sonde l'a montré : posé
     en `--card-bg-strong`, le bouton empilait un second verre clair sur le
     verre de la carte, et son texte tombait de 5,00 à 3,23:1 — donc SOUS le
     seuil, alors qu'il le passait avant la retouche. Un fond « plus visible »
     qui efface son propre libellé.
     Le fond va donc dans le sens qui SÉPARE, et ce sens dépend de la
     polarité : plus SOMBRE là où l'encre est claire, plus CLAIR là où l'encre
     est sombre. Dans les deux cas le bouton se détache de la carte ET son
     texte gagne du contraste. Mesuré : texte 6,58 / bordure 3,70 /
     chevron 3,97 au pire cas (sct de jour).
     CE QUE CE FOND NE FAIT PAS, et il faut le savoir : sur les ciels les plus
     sombres (ts, night) assombrir de 18 % d'un fond déjà presque noir ne se
     voit quasiment pas. Ce n'est pas lui qui porte le « c'est un bouton »
     dans ces cas-là, ce sont la BORDURE de contrôle (déjà mesurée à 3:1
     depuis le 28/07), l'icône et le chevron — trois signaux qui ne dépendent
     d'aucun écart de luminosité. */
  --raw-fill: rgba(0, 0, 0, .18);
  --raw-fill-hi: rgba(0, 0, 0, .28);
  /* Dégradé du chiffre géant. Blanc pur en haut, crème à peine tiède en
     bas : l'écart est volontairement minuscule (255,255,255 -> 255,247,232),
     parce qu'un dégradé qu'on REMARQUE sur un chiffre de cette taille
     ressemble à un défaut d'affichage. Le pire cas de contraste est donc la
     couleur du BAS, mesurée comme le reste. */
  --temp-grad: linear-gradient(178deg, #FFFFFF 34%, #FFF7E8 100%);
  /* Assombrissement de lecture. Les dégradés de la maquette finissent
     presque blancs en bas (#E2F0FB sur CAVOK) : sans ce voile, une carte
     en bas d'écran serait du blanc sur du blanc. C'est le trou que la
     maquette ne montre pas, parce qu'elle ne dessine ses cartes que sur
     un CAVOK bleu moyen. */
  --scrim: linear-gradient(180deg,
      rgba(3, 9, 20, .46) 0%, rgba(3, 9, 20, .44) 22%,
      rgba(3, 9, 20, .60) 58%, rgba(3, 9, 20, .82) 100%);
}
[data-pol="light"] {                 /* encre SOMBRE sur ciel CLAIR */
  --ink: #16212C;
  --ink-soft: rgba(22, 33, 44, .92);
  --ink-faint: rgba(22, 33, 44, .88);
  /* Le verre ÉCLAIRCIT ici aussi, contrairement au premier réflexe : sur
     un ciel presque blanc, c'est la BORDURE sombre qui fait exister la
     carte, pas son fond. Un fond sombre aurait dégradé l'encre sombre
     posée dessus, donc échangé un problème contre un autre. */
  --card-bg: rgba(255, 255, 255, .34);
  --card-bg-strong: rgba(255, 255, 255, .44);
  --card-border: rgba(20, 32, 46, .70);
  --ctl-border: rgba(20, 32, 46, .78);
  --hair: rgba(20, 32, 46, .22);
  --btn-bg: #16212C;
  --btn-ink: #F2F7FC;
  /* Sur ciel presque blanc, l'ambre de la planche (#f5a623) tombe à 1,7:1 :
     c'est la correction du 28/07/2026, reprise telle quelle. Le cuivre
     reste chaud là où un ambre conforme aurait viré au brun. */
  --ico-sun: #C96A00;
  --ico-wet: #2B6CB0;
  /* Même famille de teinte que --ico-sun, une clarté en dessous, pour la
     raison mesurée et détaillée dans le bloc `dark` : le cuivre validé des
     icônes tombe à 2,16:1 sur une carte du ciel `sn` de jour, qui est le
     ciel le plus clair du jeu. Celui-ci donne 3,28:1 au pire cas. Il reste
     franchement cuivré — #8C4800 passait aussi (3,94) mais virait au brun,
     et c'est précisément l'écueil que l'entrée du 28/07 signale. */
  --accent: #9E5200;
  /* 26 % de #9E5200, écrit en dur pour la raison détaillée dans le bloc
     `dark` : aucune fonction CSS récente sur le chemin d'une jauge. */
  /* Le sens s'inverse, comme pour les deux accents et le dégradé du chiffre :
     ici l'encre est sombre, donc c'est en ÉCLAIRCISSANT que le bouton se
     détache et que son texte gagne. */
  --raw-fill: rgba(255, 255, 255, .32);
  --raw-fill-hi: rgba(255, 255, 255, .46);
  /* Sur ciel presque blanc, le dégradé va vers le SOMBRE et non vers le
     crème : s'éclaircir ici ferait perdre du contraste à chaque pixel
     gagné en style. Même inversion que les deux accents ci-dessus. */
  --temp-grad: linear-gradient(178deg, #16212C 34%, #2B2114 100%);
  /* Ces ciels-là s'éclaircissent vers le bas : l'encre sombre y gagne du
     contraste au lieu d'en perdre. Le voile n'a donc à agir qu'en haut,
     là où le dégradé est le plus foncé (#8D989E sur le brouillard). */
  --scrim: linear-gradient(180deg,
      rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, .06) 34%,
      rgba(255, 255, 255, .18) 100%);
}

/* ------------------------------------------------------------------
   LES HUIT CIELS. Dégradés, lueurs et effets repris tels quels du
   fichier de handoff : ce sont eux, l'identité du produit.
   ------------------------------------------------------------------ */
[data-sky="cavok"] {
  --sky: linear-gradient(180deg, #0F5FC4 0%, #3E93E8 44%, #9BD0F6 78%, #E2F0FB 100%);
  --glow: radial-gradient(40% 22% at 76% 16%, rgba(255, 244, 205, .9), transparent 70%);
  --c1: .10; --c2: .06;
}
[data-sky="sct"] {
  --sky: linear-gradient(180deg, #2A78CE 0%, #63A4E2 46%, #B4D5EE 80%, #E6EFF6 100%);
  --glow: radial-gradient(36% 20% at 22% 14%, rgba(255, 246, 214, .6), transparent 70%);
  --c1: .55; --c2: .40;
}
[data-sky="ovc"] {
  --sky: linear-gradient(180deg, #3E4C5C 0%, #697A8B 52%, #98A5B1 82%, #B7C0C8 100%);
  --glow: radial-gradient(60% 34% at 50% 22%, rgba(255, 255, 255, .18), transparent 74%);
  --c1: .30; --c2: .34;
}
[data-sky="fg"] {
  --sky: linear-gradient(180deg, #8D989E 0%, #B9C0C1 50%, #D6D9D6 82%, #E9EAE6 100%);
  --glow: radial-gradient(70% 44% at 50% 56%, rgba(255, 255, 255, .8), transparent 74%);
  --c1: .22; --c2: .20;
  --fx: radial-gradient(80% 50% at 50% 60%, rgba(255, 255, 255, .85), transparent 76%);
  --fx-op: .8; --fx-anim: mpBreathe 9s ease-in-out infinite;
}
[data-sky="ra"] {
  --sky: linear-gradient(180deg, #26374A 0%, #42586E 50%, #6C8095 84%, #8A9BAC 100%);
  --glow: radial-gradient(60% 30% at 50% 18%, rgba(255, 255, 255, .12), transparent 74%);
  --c1: .20; --c2: .24;
  --fx: repeating-linear-gradient(14deg, rgba(255, 255, 255, .3) 0 1px, transparent 1px 9px);
  --fx-op: .45; --fx-anim: mpRain 1.1s linear infinite;
}
[data-sky="sn"] {
  --sky: linear-gradient(180deg, #6E88AC 0%, #A7BED8 48%, #D5E3F1 80%, #EFF5FB 100%);
  --glow: radial-gradient(60% 30% at 50% 16%, rgba(255, 255, 255, .5), transparent 74%);
  --c1: .30; --c2: .26;
  --fx: radial-gradient(2.2px 2.2px at 30px 40px, rgba(255, 255, 255, .95), transparent),
        radial-gradient(2px 2px at 180px 120px, rgba(255, 255, 255, .85), transparent);
  --fx-op: .9; --fx-anim: mpSnow 12s linear infinite;
}
[data-sky="ts"] {
  --sky: linear-gradient(180deg, #11133A 0%, #33235F 44%, #54388A 74%, #2B2456 100%);
  --glow: radial-gradient(60% 34% at 58% 26%, rgba(160, 130, 240, .32), transparent 74%);
  --c1: .16; --c2: .20;
  --fx: radial-gradient(60% 34% at 60% 28%, rgba(210, 190, 255, .55), transparent 72%);
  --fx-op: 1; --fx-anim: mpFlash 7s ease-in-out infinite;
}
[data-sky="night"] {
  --sky: linear-gradient(180deg, #05091A 0%, #0D1734 52%, #1A2A50 84%, #243560 100%);
  --glow: radial-gradient(30% 16% at 78% 14%, rgba(190, 210, 255, .28), transparent 70%);
  --c1: .05; --c2: .04;
  --fx: radial-gradient(1.5px 1.5px at 40px 90px, #fff, transparent),
        radial-gradient(1.3px 1.3px at 240px 60px, #fff, transparent),
        radial-gradient(1.7px 1.7px at 140px 200px, #fff, transparent),
        radial-gradient(1.2px 1.2px at 320px 260px, #fff, transparent),
        radial-gradient(1.4px 1.4px at 80px 330px, #fff, transparent);
  --fx-op: 1; --fx-anim: mpTwinkle 6s ease-in-out infinite;
}
/* Deux ciels HORS maquette météo, repris de sa section « états système » :
   le neutre du chargement (le ciel reste muet tant que le METAR est
   inconnu, c'est sa légende) et le brun chaud de la panne. Le second est
   volontairement chaud et jamais rouge d'alarme : il ne fait pas froid
   dehors parce que notre réseau tousse. */
[data-sky="neutral"] {
  --sky: linear-gradient(180deg, #101827 0%, #1C2941 60%, #2A3A57 100%);
  --glow: none; --c1: .10; --c2: .08;
}
[data-sky="err"] {
  --sky: linear-gradient(180deg, #221A1C 0%, #3A2A2C 60%, #4C3639 100%);
  --glow: radial-gradient(50% 28% at 50% 30%, rgba(255, 200, 170, .12), transparent 74%);
  --c1: .06; --c2: .05;
}

/* La NUIT sur une condition qui n'a pas de dégradé nocturne dessiné :
   on baisse la lumière au lieu d'inventer un ciel. Le voile est bleu
   marine et non gris neutre — une nuit n'est pas une photo désaturée. */
[data-lum="night"] { --veil: 1; }
[data-lum="day"] { --veil: 0; }

/* ------------------------------------------------------------------
   Le ciel lui-même. FIXE dans la fenêtre (et non collé au document) :
   le contenu défile par-dessus, la bande claire du bas reste à sa
   place, et le voile de lecture garde donc un effet constant.
   ------------------------------------------------------------------ */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sky > * { position: absolute; inset: 0; }
.sky-base { background: var(--sky); transition: background var(--dur-enter) var(--ease-sky); }
.sky-glow { background: var(--glow); }
.sky-cloud {
  inset: -10% -20%;
  background:
    radial-gradient(60% 46% at 22% 30%, rgba(255, 255, 255, .9), transparent 70%),
    radial-gradient(52% 40% at 68% 22%, rgba(255, 255, 255, .7), transparent 72%);
  filter: blur(14px);
  opacity: var(--c1);
  animation: mpDrift 64s ease-in-out infinite alternate;
}
.sky-cloud.b {
  background:
    radial-gradient(46% 34% at 76% 44%, rgba(255, 255, 255, .75), transparent 72%),
    radial-gradient(40% 30% at 30% 56%, rgba(255, 255, 255, .55), transparent 74%);
  filter: blur(20px);
  opacity: var(--c2);
  animation: mpDrift2 92s ease-in-out infinite alternate;
}
.sky-fx { background: var(--fx); opacity: var(--fx-op); animation: var(--fx-anim); }
.sky-veil {
  background: linear-gradient(180deg, rgba(4, 8, 22, .80), rgba(8, 16, 40, .70));
  opacity: var(--veil);
  transition: opacity var(--dur-enter) var(--ease-sky);
}
.sky-scrim { background: var(--scrim); }

@keyframes mpDrift { from { transform: translate3d(-14%, 0, 0); } to { transform: translate3d(14%, 0, 0); } }
@keyframes mpDrift2 { from { transform: translate3d(12%, 0, 0); } to { transform: translate3d(-12%, 0, 0); } }
@keyframes mpBreathe { 0%, 100% { opacity: .42; transform: scale(1); } 50% { opacity: .78; transform: scale(1.06); } }
@keyframes mpRain { from { background-position: 0 -240px; } to { background-position: -60px 240px; } }
@keyframes mpSnow { from { background-position: 0 -200px, 0 -300px; } to { background-position: 40px 300px, -40px 400px; } }
@keyframes mpTwinkle { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }
@keyframes mpFlash { 0%, 92%, 100% { opacity: 0; } 94% { opacity: .55; } 96% { opacity: .1; } 97% { opacity: .4; } }
/* Respiration du halo de l'icône de tête et du disque solaire. Très lente
   et de faible amplitude : le but est qu'on ne la REMARQUE pas, seulement
   que l'écran ne paraisse pas mort. Opacité et échelle uniquement, donc
   composé par le GPU — aucune repeinte, aucun coût de batterie mesurable. */
@keyframes mpBreathe2 { 0%, 100% { opacity: .12; transform: scale(.96); } 50% { opacity: .24; transform: scale(1.04); } }
/* Le halo du soleil de l'arc est positionné par cx/cy : une mise à
   l'échelle le ferait glisser vers l'origine du SVG. On n'anime donc que
   ce qui ne déplace rien — l'opacité, et le rayon là où il est animable. */
@keyframes mpSunPulse { 0%, 100% { opacity: .20; r: 16px; } 50% { opacity: .36; r: 20px; } }
@keyframes mpRise { from { opacity: 0; transform: translate3d(0, 18px, 0); } to { opacity: 1; transform: none; } }

/* ANIMATIONS SOBRES (30/07/2026, demande de Xavier : « quelques animations
   sobres pour donner une sensation de fluidité »).
   RIEN N'A ÉTÉ AJOUTÉ AU CIEL, et c'était déjà la décision du 29/07 : il
   anime pluie, neige, étoiles, éclair, brouillard et dérive des nuages. Une
   couche de plus coûterait du GPU pour redire la même chose.
   TOUTES en `opacity` et `transform`, donc composées par le GPU sans une
   seule repeinte. Aucune n'anime une hauteur, une largeur ou une couleur —
   c'est la ligne à ne pas franchir sur un téléphone.
   CHACUNE DIT QUELQUE CHOSE, aucune n'est décorative : le balayage dit que
   la direction est variable, le remplissage de jauge dit qu'une valeur a été
   mesurée, le chevron dit qu'un bloc s'ouvre. Une animation qui n'informe de
   rien est du bruit qu'on paie en batterie. */
/* Le balayage d'une direction VARIABLE : l'aiguille hésite, elle ne tourne
   pas en rond. Amplitude ±34°, ce qui est l'ordre de grandeur d'un vent
   réellement variable, et non un tour complet qui suggérerait une girouette
   emballée. */
@keyframes mpSweep {
  0%, 100% { transform: rotate(-34deg); }
  50% { transform: rotate(34deg); }
}
/* Le chiffre du confort et celui de l'UV arrivent avec un très léger appui,
   pour que le regard s'y accroche une fois — pas à chaque consultation. */
@keyframes mpPop {
  from { opacity: 0; transform: scale(.86); }
  60% { opacity: 1; transform: scale(1.03); }
  to { opacity: 1; transform: scale(1); }
}

/* ------------------------------------------------------------------
   Mise en page. Maquette pensée pour 390 px de large : sur grand écran
   la page reste une COLONNE centrée plutôt que de s'étaler, parce que
   c'est une lecture, pas un tableau de bord.
   ------------------------------------------------------------------ */
* { box-sizing: border-box; }

html { background: #101827; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: transparent;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: color var(--dur-enter) var(--ease-sky);
}

main {
  position: relative;
  z-index: 1;
  /* Le halo du chiffre est plus LARGE que le chiffre (145 %) et centré sur
     lui : posé sur une température à trois caractères, il dépassait de 63 px
     à gauche de la page et créait une barre de défilement horizontale.
     `clip` et non `hidden` : `hidden` ferait de `main` un conteneur de
     défilement, ce qui casserait le collage du ciel et l'ancrage de la
     feuille ; `clip` coupe sans rien rendre défilable. Sur l'axe Y tout
     reste visible, donc rien d'autre n'est rogné. */
  overflow-x: clip;
  max-width: 27rem;
  margin: 0 auto;
  padding: max(1rem, env(safe-area-inset-top)) 1.5rem
           calc(2.5rem + env(safe-area-inset-bottom));
}

/* La carte de verre : LE composant du système. Tout ce qui porte de
   l'information est posé dessus. */
/* COMPACTION (30/07/2026, demande de Xavier : -20 à -30 %, arbitré à -25 %).
   Elle ne passe PAS par la seule marge intérieure : une carte, c'est deux
   marges plus un intitulé plus une phrase plus les écarts entre eux. Diviser
   la seule marge par quatre n'aurait rendu qu'une dizaine de pour cent, et
   collé le texte au bord pour rien. Les valeurs ci-dessous ont donc été
   MESURÉES et ajustées jusqu'à tomber dans la fourchette demandée, hauteurs
   réelles à l'appui (relevé dans le rapport de session).
   CE QUI A ÉTÉ VÉRIFIÉ APRÈS, et c'est la règle du projet : la sonde de
   contraste du 28/07 a été repassée. Compacter rapproche le texte du HAUT
   d'écran, là où le voile de lecture agit le moins — donc une compaction peut
   faire chuter un contraste sans qu'aucun pixel ne change de couleur. */
.card {
  padding: .62rem 1.05rem;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-card);
  background: var(--card-bg);
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
}

/* Intitulé en chasse fixe, très espacé : la signature typographique du
   système. La maquette le pose à 9 px et opacité .65 ; ces deux valeurs
   ensemble passent SOUS le seuil AA. Ici 10 px et une couleur pleine
   (--ink-faint, mesurée), parce qu'une appli météo se lit dehors. */
.label {
  font: 500 var(--fs-label)/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---- 1. Barre du haut : la bascule de langue ---- */
.top { display: flex; justify-content: flex-end; align-items: center; gap: .5rem; padding-top: .5rem; }

/* Le bouton de rafraîchissement (02/08/2026). Il emprunte TOUT à la bascule
   de langue — même verre, même rayon, même hauteur — pour que les deux
   lisent comme une seule barre de commandes et non comme deux ajouts
   successifs. 36 px de côté, donc largement au-dessus des 24 px de cible
   tactile (WCAG 2.5.8), et aucune couleur inventée : encre et verre sont
   des jetons déjà mesurés dans les deux polarités. */
.iconbtn {
  display: grid; place-items: center;
  width: 36px; height: 36px; flex: none;
  border: none; border-radius: var(--radius-pill);
  background: var(--card-bg-strong); color: var(--ink);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  cursor: pointer; transition: transform var(--dur-tap) ease;
}
.iconbtn .ico { font-size: 1.05rem; --sw: 5; }
.iconbtn:active { transform: rotate(-90deg); }

.langs {
  display: flex; gap: 2px; padding: 4px;
  border: none; border-radius: var(--radius-pill);
  background: var(--card-bg-strong);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
/* 8 px de haut et non 6 : la maquette dessine des pastilles de 23 px, et
   la cible tactile minimale est de 24 px (WCAG 2.5.8). Un pixel, mais du
   bon côté de la règle, et invisible à l'œil. */
.langs button {
  padding: 8px 12px; border: none; border-radius: var(--radius-pill);
  background: transparent; color: var(--ink);
  font: 500 var(--fs-mono)/1 var(--mono); letter-spacing: .08em;
  cursor: pointer; transition: background var(--dur-tap) ease, color var(--dur-tap) ease;
}
.langs button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); }

/* ---- 2. La carte de PROVENANCE, et la ligne brute derrière un bouton ----
   RENVERSEMENT DU 29/07/2026, demandé par Xavier. Jusqu'ici la chaîne
   METAR ouvrait la page : c'était l'artefact du sujet, la signature du
   produit selon la maquette. Mais pour le grand public — la cible
   déclarée du projet — c'est une suite de sigles illisible en première
   position, donc deux secondes perdues avant la moindre information.
   Ce qui la remplace dit la même chose en clair : QUELLE station,
   à quelle distance, et de quand date la mesure. Le METAR ne disparaît
   pas, il devient une fonction d'EXPERT, dépliée à la demande. */
.station-card { margin-top: 1rem; }
.station-nom {
  display: flex; align-items: center; justify-content: space-between;
  gap: .75rem; margin-top: .6rem;
}
.station-nom > span { font-size: var(--fs-fort); font-weight: 500; letter-spacing: -.01em; }

/* La capsule de distance. Elle remplace le « , à 21,4 km » collé au nom :
   une distance est une mesure, elle se lit mieux détachée et arrondie au
   kilomètre (le dixième de km n'apporte rien à qui cherche sa météo). */
.capsule {
  display: inline-flex; align-items: center; gap: .3rem; flex: none;
  padding: .3rem .6rem;
  border: 1px solid var(--card-border); border-radius: var(--radius-pill);
  background: var(--card-bg-strong);
  font: 500 var(--fs-petit)/1 var(--mono); letter-spacing: .04em;
  color: var(--ink-soft);
}
.capsule .ico { font-size: 13px; --sw: 5; }

/* La fraîcheur, en une phrase et non deux. « Observé à 15:00 heure locale
   · il y a 6 min » demandait au lecteur de faire la soustraction ; « mis à
   jour il y a 6 min » se comprend sans réfléchir. L'heure locale de la
   station n'est pas perdue pour autant : elle continue de positionner le
   soleil sur son arc. */
.obs { display: block; margin-top: .45rem; font-size: var(--fs-annexe); color: var(--ink-soft); }
.stale { color: var(--ink); font-weight: 600; }

/* Le dépliant du METAR. Bordure de CONTRÔLE et non de carte : c'est un
   bouton, il doit se voir comme tel (1.4.11).
   RENFORCÉ le 30/07/2026 (demande de Xavier : « qu'il soit immédiatement
   reconnu comme un bouton »). Il avait un contour réglementaire et un fond
   TRANSPARENT, donc il ressemblait à une ligne de texte encadrée posée dans
   une carte — sur un téléphone, rien ne disait qu'on pouvait appuyer.
   Trois ajouts, exactement ceux demandés : un fond (--card-bg-strong, le
   jeton déjà mesuré, JAMAIS un rgba inventé), une icône de terminal à gauche
   qui annonce la nature du contenu, et un chevron à droite qui annonce le
   geste. Le chevron n'est pas décoratif : c'est lui, et non le libellé, qui
   dit dans quel sens ça va bouger, et il pivote à l'ouverture.
   L'ICÔNE ET LE CHEVRON SONT DÉCORATIFS AU SENS ACCESSIBLE (aria-hidden) :
   le libellé du bouton porte déjà tout le sens, et `aria-expanded` porte déjà
   l'état. Leur donner un nom accessible ajouterait deux formulations à
   traduire et à valider pour redire ce qui est déjà dit. */
.raw-btn {
  display: flex; align-items: center; gap: .55rem;
  width: 100%; margin-top: .7rem; padding: .62rem .8rem;
  border: 1px solid var(--ctl-border); border-radius: var(--radius-ctl);
  background: var(--raw-fill); color: var(--ink-soft);
  font: 500 var(--fs-mono)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  cursor: pointer;
  transition: background var(--dur-tap) ease, transform var(--dur-tap) ease;
}
/* Le libellé pousse le chevron au bord droit : c'est ce qui donne au bouton
   sa silhouette de rangée dépliable, reconnaissable avant même d'être lue. */
.raw-btn > span:first-of-type { flex: 1; text-align: left; }
.raw-btn .ico { font-size: 13px; --sw: 5; flex: none; opacity: .8; }
/* L'accent sur le chevron, et c'est le seul endroit du bouton qui en porte :
   il désigne le GESTE possible, ce que le reste du bouton ne fait qu'annoncer.
   Élément graphique, donc emploi légitime de l'accent (voir --accent).

   FAUSSE PISTE À NE PAS REFAIRE, et elle vaut d'être consignée parce qu'elle
   a coûté un aller-retour complet. Cette rotation a été crue CASSÉE : le
   `transform` calculé du chevron valait la matrice identité alors que la règle
   existait, que son sélecteur correspondait (vérifié par `matches`), qu'aucune
   autre règle ne la concurrençait et qu'aucun `!important` ne traînait. J'en ai
   conclu que le moteur refusait un `transform` sur un `<svg>` racine, et j'ai
   ajouté une enveloppe `<span>` pour le contourner. C'était faux.
   La vraie cause était la MÉTHODE DE MESURE : le volet navigateur ne composait
   pas d'image, donc les TRANSITIONS ne s'exécutaient pas, et
   `getComputedStyle` rendait l'état de DÉPART de la transition — c'est-à-dire
   identité — quel que soit le temps d'attente. Le journal de ce dépôt le dit
   depuis le 28/07/2026 et je ne l'ai pas appliqué.
   Mesuré correctement (`transition: none !important` puis relecture) : le
   `<svg>` racine ET un `<span>` rendent tous deux matrix(-1,0,0,-1,0,0).
   L'enveloppe a donc été retirée. LEÇON GÉNÉRALE : avant de conclure qu'une
   propriété CSS ne s'applique pas, vérifier que l'instrument peut la voir. */
.raw-btn .chev {
  flex: none; width: 11px; height: 11px; opacity: .95; color: var(--accent);
  transition: transform 260ms var(--ease-sky);
}
.raw-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
/* Le survol APPUIE le remplissage dans le même sens, il ne l'inverse pas :
   un bouton qui s'éclaircit puis s'assombrit selon le thème enverrait deux
   messages opposés pour un même geste. */
.raw-btn:hover { background: var(--raw-fill-hi); }
/* L'enfoncement au doigt. 1 px, pas plus : sur un bouton pleine largeur, un
   déplacement visible ressemble à un défaut d'affichage. C'est le RETOUR qui
   compte, pas son amplitude. */
.raw-btn:active { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) {
  .raw-btn, .raw-btn .chev { transition: none; }
}
.raw {
  margin: .9rem 0 0; padding-top: .9rem;
  border-top: 1px solid var(--hair);
  font: 500 var(--fs-petit)/1.55 var(--mono);
  letter-spacing: .02em; word-spacing: .22em;
  word-break: break-word;
  color: var(--ink-soft);
}
.raw .label { display: block; margin-bottom: .6rem; }

/* ---- 3. Le message en clair ---- */
.hero { padding: 1.75rem 0 0; }

/* L'ICÔNE DE TÊTE REVIENT (29/07/2026, demande de Xavier). Elle avait été
   retirée le 28/07 sur son arbitrage inverse — « le ciel dit déjà le temps
   qu'il fait, la doubler serait deux signaux pour une information ».
   L'argument qui l'emporte aujourd'hui : le ciel est un FOND, il se lit
   par imprégnation ; un symbole se lit d'un coup d'œil. Les 24 icônes
   étaient restées dans le sprite justement pour ce jour-là.
   Toujours pas de nom accessible : `text.headline` juste dessous dit déjà
   la même chose, et lui en écrire un créerait une formulation de plus à
   traduire et à faire valider. */
/* La ligne « chiffre + icône ». `space-between` et non un `gap` : le
   chiffre est fluide (clamp sur 33vw), donc sa largeur change avec
   l'écran ; c'est l'icône qui doit venir à lui, calée à droite, et non
   l'inverse. `align-items: center` aligne les deux CENTRES OPTIQUES —
   caler sur la ligne de base ferait flotter l'icône, qui n'en a pas. */
/* L'ICÔNE EST COLLÉE AU CHIFFRE (29/07/2026, retour de Xavier). Elle était
   poussée au bord droit par `space-between` : l'œil devait traverser toute
   la largeur pour relier les deux signaux, ce qui défait justement ce que
   leur mise sur une même ligne cherchait. Ils forment maintenant un seul
   bloc, calé à gauche. */
.temp-row {
  display: flex; align-items: center; justify-content: flex-start;
  gap: .35rem; margin-top: .35rem;
}

/* Taille fluide comme le chiffre, mais d'amplitude plus faible : à 33vw
   le nombre grandit vite, et une icône qui suivrait le même rythme
   finirait par lui disputer la vedette. Le rapport visé est d'environ
   deux tiers de la hauteur du chiffre, mesuré plus bas. */
.hero-ico {
  position: relative; flex: none;
  width: clamp(4rem, 19vw, 5.2rem); height: clamp(4rem, 19vw, 5.2rem);
}
.hero-ico .ico { width: 100%; height: 100%; --sw: 2.6; position: relative; z-index: 1; }
/* LE HALO A CHANGÉ D'ANCRAGE (29/07/2026, retour de Xavier). Il était
   centré derrière l'ICÔNE, donc il éclairait le signal secondaire ; posé
   derrière le CHIFFRE, il attire l'œil sur ce que la page a de plus
   important à dire. Il reste un pseudo-élément unique, animé en opacité et
   en échelle seulement, donc composé par le GPU sans aucune repeinte.
   `position: absolute` le sort du flux, donc il n'est PAS un élément de
   la flexbox `.temp` et ne décale rien. `z-index: -1` le range derrière le
   chiffre sans sortir de `main`, qui a déjà son propre plan (z-index 1). */
.temp::before {
  content: ""; position: absolute; z-index: -1;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 145%; height: 125%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--halo-ico) 0%, transparent 72%);
  opacity: .16;
  animation: mpBreathe2 7s ease-in-out infinite;
}
/* LE HALO N'EST AMBRÉ QUE S'IL Y A UN ASTRE, et ce n'est pas une coquetterie.
   Un halo chaud sous un temps de pluie ou de brouillard peindrait une source
   de lumière que le METAR ne rapporte pas : c'est la même faute que donnerait
   un beau ciel bleu sur le jeton `unknown`. Par défaut il prend donc
   l'encre, qui n'affirme rien ; la classe `.astre` est posée par le script
   sur les seuls jetons qui portent soleil, lune ou éclair. Elle vit
   désormais sur `.temp-row`, qui contient à la fois le chiffre et l'icône. */
.temp-row { --halo-ico: var(--ink); }
.temp-row.astre { --halo-ico: var(--ico-sun); }

.headline {
  margin: 0;
  font: 400 clamp(2rem, 9vw, 2.5rem)/1.05 var(--sans);
  letter-spacing: -.03em;
  text-wrap: pretty;
}

/* ---- 3 bis. LA PHRASE DE CONSEIL ----
   Une ligne, sous le titre, qui traduit la mesure en conséquence
   pratique. C'est la seule chose de cette page qui ne vienne ni du METAR
   ni du bloc `text` de l'API : elle est DÉDUITE de valeurs numériques par
   `conseilToken` (voir le script). Découpage volontairement identique à
   celui de `icon.ts` / `headlineText` : un sélecteur NEUTRE rend un jeton,
   le vocabulaire vit dans TEXTES. Xavier peut donc réécrire les phrases
   sans toucher à une seule condition. */
.conseil {
  margin: .5rem 0 0;
  font-size: var(--fs-corps); line-height: 1.4;
  color: var(--ink-soft); text-wrap: pretty;
}

/* Le chiffre géant. Instrument Sans s'arrête à la graisse 400 : la
   maquette écrit 200, le navigateur rend 400. On écrit donc 400, pour
   que le fichier dise ce qui se passe vraiment. */
.temp {
  display: flex; align-items: flex-start; gap: 2px;
  position: relative; /* ancre le halo, qui est en absolu */
  /* La marge est passée sur .temp-row : posée ici, elle décalerait le
     chiffre vers le bas À L'INTÉRIEUR de la ligne, donc le désalignerait
     de l'icône que ce centrage vient justement d'accorder. */
  /* GRAISSE 500 (29/07/2026). Le commentaire précédent disait « Instrument
     Sans s'arrête à 400 » : c'est FAUX et ça méritait d'être corrigé plutôt
     que recopié. Le fichier est VARIABLE et déclaré `font-weight: 400 700`
     plus haut — ce qui n'existe pas, c'est le 200 que demandait la maquette,
     sous la borne basse. 500 est donc réellement rendu, et c'est ce que
     « un peu plus épais » veut dire ici : la différence se sent sans se voir. */
  font: 500 clamp(5rem, 33vw, 8.1rem)/.86 var(--sans);
  letter-spacing: -.06em;
  font-variant-numeric: tabular-nums;
}

/* LE CHIFFRE COMME SIGNATURE (29/07/2026, demande de Xavier : « une
   sensation de volume, pas d'effet visible »). Un dégradé très court, du
   blanc pur vers un crème à peine tiède, appliqué au GLYPHE lui-même. Sur
   ciel clair (polarité light) il descend vers un brun sombre plutôt que
   vers le crème : un dégradé qui s'éclaircit y perdrait du contraste au
   lieu d'en donner.
   SOUS @supports, ET CE N'EST PAS UNE PRÉCAUTION DE STYLE : la technique
   exige `color: transparent`, donc là où `background-clip: text` n'est pas
   gérée, le chiffre deviendrait purement INVISIBLE. C'est la seule règle de
   cette feuille dont l'échec ne dégrade pas l'affichage mais l'efface. */
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .temp {
    background-image: var(--temp-grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    /* Le dégradé est peint sur la BOÎTE : sans cette ligne, il s'étirerait
       sur toute la hauteur de ligne et le crème n'atteindrait jamais le bas
       du glyphe. */
    -webkit-text-fill-color: transparent;
  }
}
/* LE DEGRÉ SE PEINT LUI-MÊME, et c'est une réparation (29/07/2026).
   Le dégradé du chiffre impose `-webkit-text-fill-color: transparent` sur
   `.temp`, et le remplissage s'HÉRITE. Or `.deg` porte `opacity: .6`, qui
   l'isole dans son propre groupe de composition : le dégradé du parent,
   clippé sur le texte, ne l'atteint donc plus. Résultat, le « ° » restait
   dans le document, occupait sa place (20 x 45 px mesurés) et se laissait
   même atteindre au pointage — mais n'était peint avec aucune couleur.
   Un caractère parfaitement présent et parfaitement invisible : le pire cas
   à diagnostiquer, parce que rien dans le DOM ne signale l'anomalie.
   On lui redonne donc un remplissage EXPLICITE, qui reprend l'encre du
   thème et suit donc les deux polarités. */
.temp .deg {
  font-size: .42em; opacity: .6; margin-top: .18em; letter-spacing: 0;
  color: var(--ink);
  -webkit-text-fill-color: var(--ink);
}

/* ---- 4. La course du soleil ----
   Fabriquée avec des champs que le backend calcule vraiment, à la
   position de la station : le point dit où en est la journée LÀ-BAS. */
/* COMPACTÉE le 30/07/2026 (demande de Xavier). Elle mesurait 211 px, plus
   que n'importe quelle autre carte, pour trois informations : deux heures et
   une position sur un arc. L'arc n'a PAS été supprimé — c'est lui qui rend la
   position lisible d'un coup d'œil, un chiffre ne le ferait pas — il a été
   aplati : le viewBox passe de 300x110 à 300x74, donc l'arc s'écrase au lieu
   de rétrécir, et garde toute sa largeur pour situer le disque.
   L'INTITULÉ ET LES DEUX BORNES PASSENT SUR LA MÊME LIGNE, ce qui économise
   une ligne entière : lever et coucher n'ont plus besoin d'un intitulé
   « COURSE DU SOLEIL » au-dessus d'eux pour être compris, les deux petites
   icônes le disent. */
.sun { margin-top: .55rem; }
/* Le disque respire, très lentement. Il marque déjà une position vraie ;
   ce battement dit seulement que la page est vivante. */
#sunHalo { animation: mpSunPulse 5.5s ease-in-out infinite; }
/* `> svg` ET NON `svg`, et ce sélecteur est une CORRECTION du 30/07/2026.
   La règle visait l'arc, seul SVG de la carte à l'époque. Depuis que les deux
   bornes portent chacune leur icône, un sélecteur descendant les attrapait
   aussi : `width: 100%` leur donnait la largeur de la carte, et la carte
   passait de 211 à 295 px — l'inverse exact de la compaction demandée. Le
   défaut ne se voyait qu'à la MESURE, une icône démesurée ressemblant à un
   choix graphique tant qu'on ne compare pas les hauteurs. */
.sun > svg { display: block; width: 100%; height: auto; margin-top: .1rem; overflow: visible; }
.sun-ends {
  display: flex; justify-content: space-between; align-items: center; margin-top: 0;
  font: 500 var(--fs-petit)/1 var(--mono); letter-spacing: .06em; color: var(--ink-soft);
}
/* Les deux bornes portent chacune leur petite icône : un lever et un
   coucher. Elles remplacent l'intitulé de la carte, qui disait en dix
   caractères espacés ce que deux symboles de 11 px disent mieux. */
.sun-ends span { display: inline-flex; align-items: center; gap: .3rem; }
/* Les heures sont dans un <b> pour rester associées à leur icône : on
   neutralise la graisse par défaut du navigateur, qui n'a rien à faire ici. */
.sun-ends b { font-weight: 500; }
.sun-ends .ico { font-size: 11px; --sw: 5; color: var(--accent); }
/* L'arc PARCOURU prend l'accent (30/07/2026). C'est l'emploi le plus utile
   qu'on pouvait en faire : le trait plein et le trait pointillé se
   ressemblaient trop pour qu'on voie d'un coup d'œil où en est la journée.
   Élément graphique, donc l'accent y est légitime : mesuré à 3,12:1 au pire
   cas sur fond de carte, pour un seuil de 3:1. */
#arcDone { stroke: var(--accent); stroke-opacity: .85; }

/* ---- 5. Le relevé ---- */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; margin-top: .55rem; }
.grid .card { grid-column: span 3; }
/* #uvSlot (script) est un EMBALLAGE, posé dans la grille pour réserver la
   place de l'UV avant qu'il n'arrive (voir le commentaire JS à sa création).
   C'est donc LUI l'item de grille, pas la carte qu'il contient : la règle
   `.grid .card` ne l'atteint pas (`grid-column` n'agit que sur un enfant
   DIRECT du conteneur grille), et il retombait sur 1 colonne sur 3, d'où une
   carte UV étriquée à côté des autres. */
.grid #uvSlot { grid-column: span 3; }

.row-head { display: flex; align-items: center; gap: .5rem; }
.row-txt { margin-top: .28rem; font-size: var(--fs-fort); letter-spacing: -.01em; }

/* CARTE MAJEURE (29/07/2026). Toutes les rubriques avaient exactement le
   même poids visuel, alors qu'elles n'ont pas la même importance : le
   vent décide si l'on sort en vélo, la visibilité presque jamais.
   La hiérarchie ne passe PAS par la largeur — `.grid .card` occupe déjà
   les trois colonnes, donc « plus large » n'existe pas ici. Elle passe
   par ce qui reste : la hauteur (respiration interne), la taille de
   l'icône, et celle de la phrase. */
.card.majeur { padding: .85rem 1.2rem; }
.card.majeur .ico-dt { font-size: 1.5rem; --sw: 4; }
.card.majeur .row-txt { margin-top: .42rem; font-size: var(--fs-majeur); }
.card.majeur .wind-row { margin-top: .6rem; }

/* ---- 5 bis. LA ROSE DES VENTS ----
   Refonte complète du 30/07/2026 (demande de Xavier). Ce qui existait était
   un cercle de 44 px avec un triangle CSS dedans : ça montrait une direction
   sans jamais dire par rapport à QUOI. Une flèche seule dans un rond est
   illisible — le lecteur doit deviner où est le nord, donc il ne lit rien.

   Ce qui a été ajouté, et chaque élément répond à un manque précis :
   les QUATRE LETTRES cardinales, qui donnent le repère absent ; les huit
   graduations, qui rendent l'angle appréciable au coup d'œil ; l'AIGUILLE en
   deux moitiés (queue sourde, tête d'accent), qui dit le sens sans avoir à le
   déduire ; et le CHIFFRE au centre, la vitesse, parce que la boussole était
   la seule à ne pas porter la valeur qu'elle illustre.

   DEUX RÈGLES HÉRITÉES ET CONSERVÉES, elles n'ont pas changé de raison :
   l'aiguille montre où le vent VA (le METAR donne d'où il VIENT, d'où le
   demi-tour dans le script), et il n'y a AUCUNE aiguille si la direction est
   inconnue ou le vent calme — une aiguille au nord par défaut affirmerait un
   fait que le METAR ne rapporte pas.

   POURQUOI EN SVG et non en CSS comme l'ancien cadran : il faut un cercle,
   des graduations à des angles justes, du texte placé et une aiguille
   orientable, le tout net à toutes les densités d'écran. En bordures CSS,
   chacun de ces éléments serait un bricolage séparé. */
.wind-row { display: flex; align-items: center; gap: .85rem; margin-top: .5rem; }
.rose { width: 56px; height: 56px; flex: none; display: block; overflow: visible; }
/* L'anneau et les graduations sont de l'encre sourde : ils sont le REPÈRE,
   pas l'information. C'est l'aiguille qui informe, donc c'est elle qui prend
   l'accent. Une boussole entièrement colorée n'aurait plus de hiérarchie. */
.rose .ring { fill: none; stroke: var(--card-border); stroke-width: 1; }
.rose .tick { stroke: var(--ink); stroke-opacity: .34; stroke-width: 1; stroke-linecap: round; }
.rose .card-l {
  fill: var(--ink); fill-opacity: .62;
  font: 500 7px/1 var(--mono); letter-spacing: .04em; text-anchor: middle;
}
/* Le nord est le seul repère qui compte pour lire les trois autres : il est
   donc un peu plus appuyé. Toujours en encre et non en accent — c'est du
   TEXTE, et l'accent est interdit sur le texte (voir --accent). */
.rose .card-l.n { fill-opacity: .95; }
/* L'aiguille en deux moitiés. La queue en encre sourde, la tête en accent :
   c'est la seule information de la boussole, donc la seule chose colorée. */
.rose .needle-tail { stroke: var(--ink); stroke-opacity: .40; stroke-width: 2; stroke-linecap: round; }
.rose .needle-head { fill: var(--accent); }
/* Le moyeu masque le croisement de l'aiguille et sert de fond au chiffre. */
.rose .hub { fill: var(--card-bg-strong); stroke: var(--card-border); stroke-width: .8; }
.rose .spd {
  fill: var(--ink); font: 500 9px/1 var(--sans); text-anchor: middle;
  font-variant-numeric: tabular-nums;
}
/* Le groupe orientable. La TRANSITION est ce qui rend la boussole vivante
   sans rien animer en boucle : au premier affichage l'aiguille part du nord
   et se pose sur sa valeur, donc le mouvement DIT que l'angle est une
   mesure. Elle vit sur le groupe et pas sur le SVG, sinon les lettres
   cardinales tourneraient avec — et une boussole dont le nord bouge n'est
   plus une boussole. */
.rose .needle { transition: transform 900ms var(--ease-sky); }
/* Vent variable : l'aiguille balaie au lieu de tourner en rond. Un tour
   complet suggérerait une girouette folle ; VRB veut dire « la direction
   change », pas « le vent tourne en permanence dans le même sens ». */
.rose.vrb .needle { animation: mpSweep 7s ease-in-out infinite; transition: none; }
@media (prefers-reduced-motion: reduce) {
  .rose .needle { transition: none; }
  .rose.vrb .needle { animation: none; }
}

/* Les mesures chiffrées : trois colonnes dans une seule carte. La
   maquette en fait trois cartes séparées ; les regrouper garde la
   rubrique « mesures » et son icône, qui existent depuis la version
   précédente et que le relevé perdrait sinon. */
.mesures { display: flex; gap: .5rem; margin-top: .38rem; }
.mesure { flex: 1; min-width: 0; }
.mesure + .mesure { border-left: 1px solid var(--hair); padding-left: .5rem; }
.mesure b { display: block; font: 400 clamp(1.05rem, 5vw, 1.3rem)/1.1 var(--sans); letter-spacing: -.02em; }
.mesure .label { display: block; margin-bottom: .45rem; font-size: var(--fs-micro); letter-spacing: .16em; }

/* ---- 5 ter. INDICE UV ET SCORE DE CONFORT (30/07/2026) ----
   Les deux seules cartes de la page qui affichent un GRAND CHIFFRE hors du
   héros. Elles partagent donc leur mise en page (`.chiffre-card`) : le
   chiffre à gauche, la jauge et la phrase à droite. Les traiter séparément
   aurait fabriqué deux dialectes visuels pour une même idée.

   CE QUI LES SÉPARE EN REVANCHE, et il ne faut pas le perdre de vue : l'UV
   est une MESURE venue d'une source (elle peut manquer, et alors la carte
   n'existe pas), le confort est un CALCUL fait dans la page à partir de
   valeurs déjà rendues. Voir le script pour la conséquence : le confort
   disparaît dès qu'une de ses cinq entrées manque, parce qu'un pourcentage
   calculé sur trois entrées sur cinq afficherait une précision fausse. */
.chiffre-row { display: flex; align-items: center; gap: .85rem; margin-top: .35rem; }
.chiffre {
  flex: none; min-width: 3.1rem;
  font: 500 clamp(1.7rem, 9vw, 2.2rem)/1 var(--sans);
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  animation: mpPop 520ms var(--ease-sky) both;
}
/* Le DÉNOMINATEUR (« /5 », « /11 ») en petit et en chasse fixe : il accompagne le
   chiffre sans lui disputer la place. Même rapport que le « ° » au chiffre
   géant du héros. */
.chiffre small {
  display: block; margin-top: .18rem;
  font: 500 var(--fs-micro)/1 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
}
.chiffre-txt { flex: 1; min-width: 0; }
.chiffre-txt .phrase {
  margin: 0; font-size: var(--fs-corps); line-height: 1.3;
  color: var(--ink-soft); text-wrap: pretty;
}

/* LA JAUGE A ÉTÉ RETIRÉE des deux cartes le 31/07/2026 (demande de Xavier).
   Elle situait la valeur sur son échelle, ce que le chiffre seul ne faisait
   pas — mais le dénominateur (« 3/5 », « 5/11 ») le dit maintenant en toutes
   lettres, et la barre le redisait une seconde fois.
   SONT PARTIS AVEC ELLE, plutôt que de dormir : les règles `.jauge`, l'image
   clé `mpFill` et le jeton `--accent-ghost`, qui n'existait que pour son
   chemin. C'est la leçon `--ico-sun` du 29/07 : ce qu'on laisse en place sans
   emploi ne meurt pas, il attend, et son repli est ce qu'on verra. Elles
   restent dans l'historique git, avec la longue note sur `color-mix` que
   portait `--accent-ghost` — le piège reste vrai, il n'a simplement plus de
   jeton où se poser. */
@media (prefers-reduced-motion: reduce) {
  .chiffre { animation: none; }
}

/* L'UV n'a pas de ligne « sur quoi le calcul repose » (ce n'est pas un
   calcul, c'est une mesure) : sans elle, sa carte était plus basse que celle
   du confort, qui en a une. `visibility: hidden` et non `display: none` sur
   le remplaçant : la ligne garde sa place sans rien afficher, `aria-hidden`
   l'écarte des lecteurs d'écran. On réserve la HAUTEUR d'une ligne
   d'intitulé, pas une valeur devinée : les deux cartes restent alignées quel
   que soit le nombre de mots que Xavier choisit pour ses phrases. */
.chiffre-card .label.reserve { visibility: hidden; }

/* ---- 5 quater. NUAGIO ----
   Voir le long commentaire du sprite (#n-corps) pour ce qu'il représente et
   pourquoi il est construit en deux étages. Ici : la taille, le trait, les
   couleurs et les quatre animations.

   IL EST TOUJOURS AFFICHÉ, dans les TROIS états de la page et non dans le
   seul `#card` : `afficherChargement` montre `#skel` et `afficherEchec`
   montre `#notice`, tous deux avec `#card` masqué. Une seule instance dans
   la carte aurait donc rendu impossibles les expressions « réfléchit » et
   « perplexe » que Xavier demande. Trois instances, un seul jeu de symboles :
   c'est gratuit, et c'est `poserNuagio` qui les règle toutes d'un coup.

   LA PHRASE EST SOUS LUI et non à côté (« Sous Nuagio, afficher une courte
   phrase ») : la ligne devient une colonne. La phrase, elle, garde le droit
   de DISPARAÎTRE quand il n'y a rien à conseiller — on n'invente pas une
   banalité permanente pour lui tenir compagnie, ce qui est la raison même
   pour laquelle la ligne se masquait avant.

   IL RESTE DÉCORATIF (aria-hidden). La phrase dit tout ce qu'il exprime, et
   les trois états ont chacun leur texte : lui donner un nom accessible
   ajouterait une formulation à traduire et à valider pour ne rien dire de
   neuf. Même raisonnement que pour l'icône de tête. */
/* `.nuagio-row` A ÉTÉ SUPPRIMÉE le 31/07/2026, avec l'instance de héros
   qu'elle contenait. La phrase de conseil reste seule et porte elle-même sa
   marge : garder la rangée aurait laissé un espace de 10 px sur les
   consultations où il n'y a rien à conseiller, c'est-à-dire les plus
   fréquentes — un blanc qu'on aurait pris pour un défaut de mise en page. */
.nuagio {
  /* ~64 px comme demandé, mais ADAPTATIF : la borne basse protège les
     petits écrans, le `vw` du milieu suit la largeur, et la borne haute
     empêche Nuagio de venir disputer la vedette au chiffre géant. La
     hauteur suit le repère 32x34, jamais une valeur devinée. */
  --n-size: clamp(3.5rem, 16vw, 4.25rem);
  /* L'ÉPAISSEUR DE TRAIT SE MESURE, ELLE NE SE REPREND PAS (règle établie
     le 28/07/2026 sur les icônes, et signalée en dette sur l'icône de tête).
     Le repère fait 32 unités de large pour ~64 px rendus, donc 1 unité vaut
     ~2 px : 1,2 donne ~2,4 px, soit 3,75 % de la largeur — la même
     proportion que l'icône de tête (3,5 px sur 86). Mesuré au rendu, pas
     déduit du sprite, dont le repère fait 64. */
  --n-sw: 1.2;
  flex: none; display: block;
  width: var(--n-size); height: calc(var(--n-size) * 34 / 32);
  overflow: visible; color: var(--ink);
  /* TOUT CE QUI EST HÉRITABLE EST POSÉ ICI, exactement comme `.ico` du sprite
     d'icônes, et pour la raison expliquée en long dans le commentaire de
     #n-corps : un sélecteur descendant n'atteint pas le contenu cloné par
     `<use>`, mais l'héritage le traverse. Sans ce `fill: none`, le nuage
     serait un APLAT NOIR — c'est le défaut trouvé et corrigé le 30/07/2026.
     Les formes qui doivent s'écarter de ce réglage (visage plus fin, aplats,
     joues, humide) le font en attribut ou en `style` sur elles-mêmes.
     La joue prend `--accent` et lui seul porte du GRAPHIQUE, jamais du texte
     (3,28:1 en polarité claire : au-dessus du seuil graphique de 3:1, en
     dessous du seuil de texte de 4,5:1). Goutte et flocons prennent
     `--ico-wet`, déjà mesuré dans les deux polarités (4,62 / 8,28). Aucune
     teinte inventée. */
  fill: none; stroke: currentColor; stroke-width: var(--n-sw);
  stroke-linecap: round; stroke-linejoin: round;
  /* Valeurs de repos du regard : œil ouvert, paupière effacée. Ce sont elles
     qu'on voit si l'animation ne joue pas (mouvement réduit, moteur qui
     refuse). Un visage normal, jamais un œil masqué. */
  --n-oeil-g: 1; --n-oeil-d: 1; --n-paup-g: 0; --n-paup-d: 0;
  animation: mpRise 620ms var(--ease-sky) 160ms both,
             nClignement 24s linear infinite;
}

/* ---- LES QUATRE ANIMATIONS ----
   Toutes en `transform` ou en `opacity` uniquement, donc composées sans
   repeinte. C'est la contrainte « peu consommatrices de ressources ».

   1. LE FLOTTEMENT. Le nuage est en l'air : l'immobilité parfaite est ce
      qui, ici, aurait l'air d'un bug. Moins d'une unité de dessin.
   2. LE BALANCEMENT remplace le flottement quand il y a du vent — il ne
      s'y AJOUTE pas. Deux animations sur `transform` se remplaceraient
      l'une l'autre au lieu de se composer, d'où une seule règle qui porte
      les deux mouvements. Le seuil est celui de `conseilToken` (jeton
      `vent`), jamais un nouveau : un seuil neuf serait une décision de
      plus à soumettre à Xavier.
   3. LE TREMBLEMENT, pour le froid et la neige. Même raison, même forme.
   4. LE CLIGNEMENT ET LE CLIN D'ŒIL sont un SEUL cycle de 24 s et non
      deux animations superposées : superposées, elles porteraient toutes
      deux l'opacité et la seconde gagnerait en permanence. Un clignement
      des deux yeux vers 28 %, un clin de l'œil droit seul vers 73 %. La
      paupière est l'exact inverse de l'œil, sinon on verrait l'un à
      travers l'autre. Ces deux-là sont déclarées en `style` SUR les yeux,
      dans le sprite, parce qu'elles vivent dans l'ombre du `<use>` ; les
      trois premières sont ici, parce que leur groupe vit dans le document.
   Les keyframes, elles, sont globales : elles se nomment, elles ne se
   sélectionnent pas, donc la frontière du `<use>` ne les concerne pas. */
.nuagio .n-body {
  transform-box: fill-box; transform-origin: 50% 88%;
  animation: nFloat 4.6s ease-in-out infinite;
}
.nuagio.n-vent .n-body { animation: nSway 3.4s ease-in-out infinite; }
.nuagio.n-frisson .n-body { animation: nShiver 1.7s ease-in-out infinite; }
@keyframes nFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-.7px); }
}
@keyframes nSway {
  0%, 100% { transform: translateY(0) rotate(-2.6deg); }
  50% { transform: translateY(-.6px) rotate(2.6deg); }
}
@keyframes nShiver {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-.35px); }
  75% { transform: translateX(.35px); }
}
/* LE REGARD PASSE PAR DES PROPRIÉTÉS PERSONNALISÉES, ET C'EST LE POINT DE
   CONCEPTION À NE PAS DÉFAIRE. Les yeux vivent dans l'ombre du `<use>` ;
   animer directement leur `opacity` depuis la feuille du document supposerait
   que le moteur applique nos animations au contenu CLONÉ, ce que je n'ai PAS
   pu prouver ici (l'instrument disponible ne franchit pas cette frontière, et
   ce dépôt sait ce que vaut une conclusion tirée d'un instrument aveugle).
   Les propriétés personnalisées, elles, s'HÉRITENT — c'est déjà ce qui fait
   marcher `--n-sw` et `--accent` sur les mêmes formes, et c'est vérifiable.
   On anime donc quatre variables sur la RACINE, qui est un élément du
   document, et les yeux ne font que les lire.
   L'interpolation n'est pas nécessaire : sans `@property`, une propriété
   personnalisée s'anime par PALIERS, et un clignement est justement une
   bascule et non un fondu. */
@keyframes nClignement {
  0%, 27.6% { --n-oeil-g: 1; --n-oeil-d: 1; --n-paup-g: 0; --n-paup-d: 0; }
  /* clignement des deux yeux */
  28.2%, 29% { --n-oeil-g: 0; --n-oeil-d: 0; --n-paup-g: 1; --n-paup-d: 1; }
  29.6%, 71.6% { --n-oeil-g: 1; --n-oeil-d: 1; --n-paup-g: 0; --n-paup-d: 0; }
  /* clin d'œil : l'œil DROIT seul */
  72.4%, 74.6% { --n-oeil-g: 1; --n-oeil-d: 0; --n-paup-g: 0; --n-paup-d: 1; }
  75.4%, 100% { --n-oeil-g: 1; --n-oeil-d: 1; --n-paup-g: 0; --n-paup-d: 0; }
}
/* MOUVEMENT RÉDUIT. Couper l'animation de la racine suffit à arrêter AUSSI
   le clignement, puisqu'il ne vit plus que dans les quatre variables qu'elle
   porte : elles retombent alors sur leurs valeurs de repos, déclarées dans la
   même règle. Œil ouvert, paupière effacée, personnage immobile. Même leçon
   que le jeton orphelin `--ico-sun` (29/07) : ce qu'on voit quand plus rien
   ne joue, c'est la valeur de repli, et elle se choisit exprès. */
@media (prefers-reduced-motion: reduce) {
  .nuagio, .nuagio .n-body,
  .nuagio.n-vent .n-body, .nuagio.n-frisson .n-body { animation: none !important; }
}
/* Les deux écrans de service sont centrés en texte, mais `.nuagio` est un
   bloc de largeur fixe : sans cette marge automatique il se collerait à
   gauche pendant que le message reste au centre. */
/* NUAGIO DANS LA CARTE DE CONFORT (31/07/2026). Il y partage sa ligne avec le
   chiffre et la jauge, alors qu'il occupait seul la largeur du héros : à sa
   taille d'origine il aurait poussé la jauge hors de la carte sur un écran de
   375 px. Seule `--n-size` change, JAMAIS `--n-sw` : l'épaisseur est exprimée
   dans le repère 32x34 du dessin, donc elle suit l'échelle toute seule et la
   proportion mesurée le 31/07 (~3,75 % de la largeur rendue) est conservée par
   construction. C'est exactement ce que les classes `.sc*` du sprite d'icônes
   doivent faire à la main, et ici on n'a rien à faire. */
.confort-card .nuagio { --n-size: clamp(2.6rem, 12vw, 3.3rem); }
.notice .nuagio, .skel .nuagio { margin: 0 auto; }
.skel .nuagio { margin-bottom: .8rem; }

/* ---- 6. Pied : action principale et détail technique ---- */
.foot { margin-top: 1.4rem; }
.cta {
  width: 100%; padding: 1.05rem;
  border: 1px solid var(--ctl-border); border-radius: var(--radius-ctl);
  background: var(--card-bg-strong);
  backdrop-filter: blur(var(--card-blur)); -webkit-backdrop-filter: blur(var(--card-blur));
  color: var(--ink); font: 500 var(--fs-corps)/1 var(--sans); letter-spacing: -.01em;
  cursor: pointer; transition: background var(--dur-tap) ease;
}
/* Le bouton principal porte désormais une icône : « Changer de lieu »
   était juste, mais muet — on ne savait pas ce qui allait s'ouvrir. Le
   repère de lieu le dit avant le mot. */
.cta { display: flex; align-items: center; justify-content: center; gap: .55rem; }
.cta .ico { font-size: 17px; --sw: 4.5; }
.cta:hover { background: var(--card-border); }
.cta.plein { background: var(--btn-bg); color: var(--btn-ink); border-color: transparent; }
.cta.plein:hover { filter: brightness(1.08); }

.tech {
  margin: .9rem 0 0; text-align: center;
  font: 400 var(--fs-mono)/1.5 var(--mono); letter-spacing: .08em;
  color: var(--ink-faint); text-transform: uppercase;
}
/* L'attribution : même famille que la ligne technique, mais sans la casse
   forcée — un nom de domaine et un nom de licence se lisent tels qu'ils
   s'écrivent, et « CC BY 4.0 » en capitales espacées deviendrait illisible.
   `--ink-faint` est l'encre déjà mesurée : discrète, jamais sous le seuil. */
.sources {
  margin-top: .45rem; text-transform: none; letter-spacing: .04em;
  text-wrap: pretty;
}

/* ---- 6 bis. Le soutien (01/08/2026) ----
   AUCUN JETON NEUF, et c'est la règle établie le 29/07 : « tout composant
   neuf se bâtit sur les jetons DÉJÀ mesurés ; un rgba() inventé passe tous
   les contrôles qu'on peut faire à l'œil et aucun de ceux qui comptent ».
   Ce bloc n'a donc pas une seule couleur à lui.
   Tout ce qui suit vit DANS la feuille `#sheetSoutien` (la carte de verre en
   bas de page a été retirée le jour même sur retour de Xavier), donc dans une
   polarité toujours sombre : les jetons lus ici sont ceux que `.sheet`
   redéfinit, jamais ceux du ciel courant. */

/* Le second bouton du pied. Sa seule règle propre est l'écart avec le bouton
   de lieu — `.cta` porte déjà tout le reste. */
#openSoutien { margin-top: .5rem; }

/* La bulle et Nuagio. Nuagio est RÉDUIT ici : son défaut fait ~64 px, trop
   fort pour un bloc qui doit rester en retrait. L'épaisseur de trait suit
   toute seule, `--n-sw` étant relative au repère — c'est la même propriété
   que celle exploitée par `.confort-card .nuagio`. */
.soutien-bulle {
  display: flex; align-items: center; justify-content: center;
  gap: .5rem; margin-top: 1.1rem;
}
.soutien-bulle .nuagio { --n-size: clamp(2.4rem, 11vw, 3rem); flex: none; }
/* La bulle de dialogue : encre ATTÉNUÉE et non l'encre pleine, pour qu'elle
   reste en dessous du titre dans la hiérarchie du regard. Le fond est
   `--card-bg`, que `.sheet` redéfinit pour sa propre polarité — et NON
   `--raw-fill`, qui suit la polarité de la PAGE et donnerait un fond clair
   sous l'encre claire de la feuille dès que le ciel est pâle. C'est le
   « blanc sur blanc » déjà mesuré le 28/07, sous une autre forme.
   Le petit bec pointe vers Nuagio ; purement décoratif, aucune couleur à lui. */
.bulle {
  position: relative; margin: 0; padding: .55rem .75rem;
  border: 1px solid var(--card-border); border-radius: var(--radius-ctl);
  background: var(--card-bg);
  font: 400 var(--fs-petit)/1.45 var(--sans); color: var(--ink-soft);
  text-align: left; text-wrap: pretty;
}
.bulle::before {
  content: ""; position: absolute; left: -5px; top: 50%;
  width: 8px; height: 8px; margin-top: -4px;
  border-left: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border);
  background: var(--card-bg); transform: rotate(45deg);
}

.soutien-txt {
  margin: 1.1rem 0 0;
  font: 400 var(--fs-corps)/1.5 var(--sans); color: var(--ink-soft);
  text-wrap: pretty;
}

/* LE BOUTON D'ACTION de la feuille. « Plus coloré » passe par la variante
   `.plein`, qui existe déjà et dont les deux couleurs (--btn-bg / --btn-ink)
   sont mesurées dans les DEUX polarités. Le réflexe qu'on évite ici est celui
   du 30/07 : empiler un second verre clair (`--card-bg-strong`) sur le verre
   avait fait tomber le libellé du bouton METAR de 5,00 à 3,23:1, c'est-à-dire
   un fond « plus visible » qui efface son propre texte. `--accent` était
   exclu aussi : il ne porte que du graphique, jamais du texte.
   L'élévation au survol se fait en `transform` et en `filter` — jamais une
   ombre, que ce système n'a pas et qu'il faudrait mesurer dans les deux
   polarités. `:active` ramène à zéro : c'est le retour tactile sur mobile,
   où le survol n'existe pas. */
.soutien-cta {
  /* C'est un `<a>` : `.cta` a été écrite pour un `<button>` et ne prévoyait
     donc ni le soulignement ni la taille de boîte d'un lien. Deux lignes,
     et le lien est visuellement le même bouton que les autres. */
  text-decoration: none; box-sizing: border-box;
  transition: background var(--dur-tap) ease, filter var(--dur-tap) ease,
              transform var(--dur-tap) ease;
}
.soutien-cta:hover { transform: translateY(-1px); }
.soutien-cta:active { transform: translateY(0); filter: brightness(.96); }

/* ---- 7. États de service ---- */
.notice { padding: 25vh 0 2rem; text-align: center; }
.notice b { display: block; font: 400 var(--fs-titre1)/1.25 var(--sans); letter-spacing: -.02em; margin-bottom: .6rem; }
.notice span { display: block; color: var(--ink-soft); text-wrap: pretty; }
.notice .cta { margin-top: 1.6rem; }
/* `.mark` (la pastille « ! » et son jumeau en pointillé) a été RETIRÉE le
   30/07/2026 : Nuagio occupe son créneau. On supprime la règle plutôt que de
   la laisser dormir — la leçon d'`--ico-sun` est qu'un style dont plus
   personne ne se sert ne meurt pas, il attend, et qu'on le retrouve un jour
   sous une forme qu'on n'avait pas prévue. */
.notice .nuagio { margin-bottom: 1.2rem; }

/* Squelette de chargement : le ciel reste neutre tant que le METAR est
   inconnu. Il fallait un état DISTINCT de l'écran d'accueil, qui servait
   jusqu'ici les deux à la fois.
   LES BARRES CHATOYANTES SONT RETIRÉES le 02/08/2026 (demande de Xavier),
   règles ET markup, plutôt que simplement masquées : ce dépôt sait ce que
   coûte un style qui dort (voir --ico-sun, 29/07). Le squelette se réduit
   donc à Nuagio et à sa phrase. */
.skel { text-align: center; padding-top: 18vh; }
.skel p { margin: 0; }

/* ---- 8. La feuille « où êtes-vous ? » ----
   Elle remplace le <details> discret de la version précédente : dans
   cette mise en page il n'y avait plus d'endroit pour lui, et la
   maquette en fait l'action principale du bas d'écran. */
.veil {
  position: fixed; inset: 0; z-index: 2;
  background: rgba(4, 12, 24, .5);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 420ms ease;
}
.veil.on { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
  max-width: 27rem; margin: 0 auto;
  padding: 1.5rem 1.5rem calc(2.1rem + env(safe-area-inset-bottom));
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  border-top: 1px solid rgba(255, 255, 255, .16);
  /* LA FEUILLE PEUT DÉSORMAIS ÊTRE PLUS HAUTE QUE L'ÉCRAN (29/07/2026).
     Elle ne portait que trois contrôles ; elle porte maintenant la
     recherche, jusqu'à cinq propositions et les coordonnées dépliées, soit
     685 px mesurés. Sur un écran court (667 px), elle sortait par le HAUT,
     et comme elle est `fixed` en bas, la partie perdue était inatteignable :
     le bouton « Consulter » devenait inaccessible sans qu'on voie pourquoi.
     Plafond à 88 % de la hauteur visible, et on défile à l'intérieur. */
  max-height: 88vh;
  overflow-y: auto;
  overscroll-behavior: contain; /* le défilement ne se propage pas à la page */
  background: rgba(12, 22, 38, .92);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  color: #EAF2FB;
  transform: translateY(110%);
  transition: transform var(--dur-enter) var(--ease-sky);
}
.sheet.on { transform: translateY(0); }
/* La feuille garde SA propre polarité : elle est toujours sombre, quel
   que soit le ciel derrière. C'est un plan au-dessus de la page, pas une
   carte posée dedans. */
.sheet {
  --ink: #EAF2FB; --ink-soft: rgba(234, 242, 251, .90); --ink-faint: rgba(234, 242, 251, .82);
  --card-bg: rgba(255, 255, 255, .10);
  --card-border: rgba(255, 255, 255, .28); --ctl-border: rgba(255, 255, 255, .38);
  --btn-bg: #EAF2FB; --btn-ink: #0B1728; --hair: rgba(255, 255, 255, .16);
}
.grip { width: 38px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .28); margin: 0 auto 1.1rem; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
.sheet-head h2 { margin: 0; font: 400 var(--fs-titre2)/1.2 var(--sans); letter-spacing: -.02em; }
/* Le « fermer » est un mot, donc haut de 11 px : on l'entoure de marge
   NÉGATIVE pour lui donner une cible de 27 px sans le déplacer d'un
   pixel. Le dessin ne bouge pas, le doigt gagne 16 px. */
.sheet-head button {
  border: none; background: none; color: var(--ink-soft); cursor: pointer;
  padding: 8px 6px; margin: -8px -6px;
  font: 500 var(--fs-mono)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
}
.champs { display: flex; gap: .5rem; margin-top: .75rem; }
.champs input {
  flex: 1; min-width: 0;
  padding: .95rem 1rem;
  border: 1px solid var(--ctl-border); border-radius: var(--radius-ctl);
  background: var(--card-bg); color: var(--ink);
  font: 400 var(--fs-corps)/1 var(--sans); font-variant-numeric: tabular-nums;
}
.champs input::placeholder { color: var(--ink-faint); }
.sheet .cta { margin-top: .75rem; }
/* Le bouton de recherche vit DANS la ligne de saisie : sa marge haute
   viendrait de `.sheet .cta` et le décalerait du champ. */
.cta-inline { width: auto; flex: none; margin-top: 0 !important; padding: .95rem 1.1rem; }

/* Message de la recherche de ville. Discret, mais jamais atténué au point
   d'être moins lisible que le reste : c'est souvent le seul retour qu'aura
   l'utilisateur quand sa saisie ne donne rien. */
.sheet-msg { margin: .75rem 0 0; font-size: var(--fs-annexe); color: var(--ink-soft); }

/* La liste de choix. Sans puces ni décor : ce sont des boutons, l'important
   est qu'on voie où appuyer. */
.choix { list-style: none; margin: .75rem 0 0; padding: 0; }
.choix button {
  width: 100%; text-align: left;
  padding: .8rem 1rem; margin-top: .4rem;
  border: 1px solid var(--ctl-border); border-radius: var(--radius-ctl);
  background: var(--card-bg); color: var(--ink);
  font: 400 var(--fs-corps)/1.3 var(--sans); cursor: pointer;
  transition: background var(--dur-tap) ease;
}
.choix button:hover { background: var(--card-bg-strong); }
/* La ligne d'homonymie (région, pays) : c'est ELLE qui permet de choisir,
   donc elle est plus discrète mais pas effacée. */
.choix small { display: block; margin-top: .15rem; font-size: var(--fs-petit); color: var(--ink-soft); }
.pastille {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid currentColor; display: inline-block; margin-right: .55rem;
  vertical-align: -1px;
}

/* ---- 9. Icônes de rubrique ----
   Le sprite en ligne survit à la refonte : aucune requête réseau, aucun
   CDN. Les 24 icônes météo, retirées de l'affichage le 28/07/2026, sont
   REPOSÉES depuis le 29/07 sur l'icône de tête : les avoir gardées dans
   le document a économisé la session qu'aurait coûtée leur redessin.
   --sw est l'épaisseur du trait dans le repère du dessin (viewBox 64). */
.ico {
  width: 1em; height: 1em; flex: none;
  fill: none; stroke: currentColor; stroke-width: var(--sw, 3);
  stroke-linecap: round; stroke-linejoin: round; overflow: visible;
}
/* Une primitive agrandie verrait son trait grossir d'autant : on divise. */
.sc08 { stroke-width: calc(var(--sw, 3) / 0.8); }
.sc11 { stroke-width: calc(var(--sw, 3) / 1.1); }
.sc13 { stroke-width: calc(var(--sw, 3) / 1.3); }
.sc15 { stroke-width: calc(var(--sw, 3) / 1.5); }
.sc17 { stroke-width: calc(var(--sw, 3) / 1.7); }
.sc19 { stroke-width: calc(var(--sw, 3) / 1.9); }
.sc22 { stroke-width: calc(var(--sw, 3) / 2.2); }
.sc26 { stroke-width: calc(var(--sw, 3) / 2.6); }
.c-sun { stroke: var(--ico-sun, currentColor); }
.c-wet { stroke: var(--ico-wet, currentColor); }
.dash { stroke-dasharray: 3 4; }
.ico-dt { font-size: 1.15rem; --sw: 4.4; color: var(--ink-faint); }

/* ---- 10. Entrées en scène. L'ordre EST la hiérarchie, et il a été
   RENVERSÉ le 29/07/2026 : le message en clair arrive maintenant en
   premier (sans délai), la provenance de la mesure ensuite (d1), puis la
   course du soleil (d2), le relevé (d3) et les commandes (d4). La ligne
   brute n'a plus de rang propre, elle vit repliée dans la carte d1. ---- */
.rise { animation: mpRise var(--dur-enter) var(--ease-sky) both; }
.d1 { animation-delay: 80ms; }
.d2 { animation-delay: 160ms; }
.d3 { animation-delay: 240ms; }
.d4 { animation-delay: 320ms; }
.d5 { animation-delay: 400ms; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }

/* La maquette ajoute neuf animations, dont un éclair qui flashe. Le
   coupe-circuit d'accessibilité les couvre toutes, y compris celles du
   ciel : il ne bouge pas. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- Le ciel. Six plans superposés, dans l'ordre où la maquette les
     empile : dégradé, lueur de l'astre, deux bancs de nuages qui
     dérivent, l'effet propre à la condition (pluie, neige, étoiles,
     éclair), le voile de nuit, puis le voile de lecture. -->
<div class="sky" aria-hidden="true">
  <div class="sky-base"></div>
  <div class="sky-glow"></div>
  <div class="sky-cloud"></div>
  <div class="sky-cloud b"></div>
  <div class="sky-fx"></div>
  <div class="sky-veil"></div>
  <div class="sky-scrim"></div>
</div>

<!-- ==================================================================
     SPRITE D'ICÔNES, en ligne : aucune requête réseau, aucun CDN.

     Deux étages : des PRIMITIVES (#p-...) centrées sur leur origine,
     puis les symboles composés par <use>.

     CE QUI A CHANGÉ LE 28/07/2026 : le système de design remplace
     l'icône météo de tête par le ciel lui-même. Les 24 icônes du
     contrat ne sont donc plus posées nulle part. Elles RESTENT ici,
     validées et prêtes, parce qu'elles ne coûtent rien à conserver et
     que les redessiner coûterait une session. Seules les 5 icônes de
     rubrique (#d-...) sont réellement affichées aujourd'hui.
     ================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs>

  <!-- Le nuage. Repère natif 24, recentré sur son origine. -->
  <g id="p-cloud" transform="translate(-12,-11)">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </g>

  <!-- Le soleil : disque + huit rayons. -->
  <g id="p-sun" transform="translate(-12,-12)">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </g>

  <!-- La lune : le seul dessin qui dise « nuit » sans un mot. -->
  <g id="p-moon" transform="translate(-12,-12)">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </g>

  <!-- Les gouttes, en repère final (64) : leur épaisseur suit celle de
       l'icône. Quatre densités, parce que le contrat en distingue quatre. -->
  <g id="p-drop1"><path d="M1.5,-5 -1.5,5"/></g>
  <g id="p-rain2"><path d="M-5.5,-5 -8.5,5 M8.5,-5 5.5,5"/></g>
  <g id="p-rain2w"><path d="M-13.5,-5 -16.5,5 M16.5,-5 13.5,5"/></g>
  <g id="p-rain3"><path d="M-9.5,-5 -12.5,5 M1.5,-5 -1.5,5 M12.5,-5 9.5,5"/></g>
  <g id="p-rain4"><path d="M-13.5,-5 -16.5,5 M-3.5,-5 -6.5,5 M6.5,-5 3.5,5 M16.5,-5 13.5,5"/></g>
  <g id="p-drizzle"><path d="M-9,-3 -11,3 M1,-3 -1,3 M11,-3 9,3"/></g>

  <g id="p-flake">
    <path d="M0,-8V8M-6.9,-4 6.9,4M-6.9,4 6.9,-4M-3,-5 0,-8 3,-5M-3,5 0,8 3,5"/>
  </g>
  <g id="p-bolt"><path d="M3,-9 -5,2 1,2 -3,10"/></g>
  <g id="p-hail">
    <circle cx="-9" cy="-1" r="1.8"/><circle cx="0" cy="2" r="1.8"/><circle cx="9" cy="-1" r="1.8"/>
  </g>
  <g id="p-glace"><path d="M-15,0H15"/></g>
  <g id="p-fog"><path d="M-22,-12H8M-14,-4H22M-22,4H14M-8,12H22"/></g>
  <g id="p-waves">
    <path d="M-21,-10c7,-8 14,-8 21,0s14,8 21,0M-21,0c7,-8 14,-8 21,0s14,8 21,0M-21,10c7,-8 14,-8 21,0s14,8 21,0"/>
  </g>
  <g id="p-plumes">
    <path d="M-14,18c0,-8 8,-10 0,-18s8,-10 0,-18M0,18c0,-8 8,-10 0,-18s8,-10 0,-18M14,18c0,-8 8,-10 0,-18s8,-10 0,-18"/>
  </g>

</defs>

<!-- LES 24 ICÔNES DU CONTRAT — en réserve, voir le commentaire plus haut. -->
<symbol id="i-clear_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc22" transform="translate(32,32) scale(2.2)"/>
</symbol>
<symbol id="i-clear_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc26" transform="translate(32,32) scale(2.6)"/>
</symbol>
<symbol id="i-few_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc13" transform="translate(21,20) scale(1.3)"/>
  <use href="#p-cloud" class="sc15" transform="translate(35,38) scale(1.5)"/>
</symbol>
<symbol id="i-few_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc13" transform="translate(21,20) scale(1.3)"/>
  <use href="#p-cloud" class="sc15" transform="translate(35,38) scale(1.5)"/>
</symbol>
<symbol id="i-partly_cloudy_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc11" transform="translate(19,19) scale(1.1)"/>
  <use href="#p-cloud" class="sc15" transform="translate(31,36) scale(1.5)"/>
  <use href="#p-cloud" class="sc08" transform="translate(50,44) scale(0.8)"/>
</symbol>
<symbol id="i-partly_cloudy_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc11" transform="translate(19,19) scale(1.1)"/>
  <use href="#p-cloud" class="sc15" transform="translate(31,36) scale(1.5)"/>
  <use href="#p-cloud" class="sc08" transform="translate(50,44) scale(0.8)"/>
</symbol>
<symbol id="i-cloudy" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc17" transform="translate(28,26) scale(1.7)"/>
  <use href="#p-cloud" class="sc11" transform="translate(44,42) scale(1.1)"/>
</symbol>
<symbol id="i-overcast" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc15" transform="translate(23,25) scale(1.5)"/>
  <use href="#p-cloud" class="sc13" transform="translate(45,27) scale(1.3)"/>
