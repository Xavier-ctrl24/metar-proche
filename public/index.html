<!doctype html>
<html lang="fr" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR Proche</title>
<meta name="description" content="La météo de la station d'observation la plus proche, en clair.">
<style>
/* ------------------------------------------------------------------
   Palette. Deux jeux complets, choisis par la LUMIÈRE DE LA STATION
   (sun.isDay renvoyé par l'API), et non par le thème du navigateur.
   C'est le parti pris de la page : on consulte Fidji, on voit sa nuit.
   ------------------------------------------------------------------ */
:root[data-sky="day"] {
  --bg: #e6eef5;          /* bleu de carte aéronautique, très pâle */
  --surface: #f7fafc;
  --ink: #12233b;         /* encre marine */
  --muted: #61748f;
  --line: #c3d2e2;
  --accent: #0e7c86;      /* cyan profond, couleur des isobares */
}
:root[data-sky="night"] {
  --bg: #0d1524;
  --surface: #141f33;
  --ink: #e8eef7;
  --muted: #8296b0;
  --line: #26344b;
  --accent: #e8b04b;      /* ambre de lampe : la lumière qu'on voit la nuit */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: clamp(1.25rem, 5vw, 4rem);
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  /* La bascule jour/nuit se voit : c'est le geste signature de la page. */
  transition: background-color .6s ease, color .6s ease;
}

main { max-width: 46rem; margin: 0 auto; }

/* ------------------------------------------------------------------
   1. La ligne brute. Elle ouvre la page parce que c'est L'ARTEFACT du
   sujet : la chaîne que personne ne sait lire, et dont tout le reste
   de la page est la traduction. Elle est donc en tête, en chasse fixe,
   et volontairement discrète : c'est la provenance, pas le message.
   ------------------------------------------------------------------ */
.raw {
  font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
  font-size: .8rem;
  letter-spacing: .02em;
  color: var(--muted);
  word-break: break-word;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}

/* ------------------------------------------------------------------
   2. Le message en clair.
   ------------------------------------------------------------------ */
.lede { display: flex; gap: 1.5rem; align-items: flex-start; padding: 2rem 0 1.5rem; }

.headline {
  margin: 0;
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  font-weight: 350;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.temp {
  margin-left: auto;
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
  white-space: nowrap;
}

.place { margin: 0; color: var(--muted); }
.place strong { color: var(--ink); font-weight: 600; }

/* Mention de fraîcheur : muette d'habitude, franche quand ça compte. */
.stale { color: var(--accent); font-weight: 600; }

/* ------------------------------------------------------------------
   3. Le relevé. Une liste de définitions : les intitulés reprennent
   les groupes du METAR lui-même, en français. La structure porte donc
   une information vraie, elle ne décore pas.
   ------------------------------------------------------------------ */
.report { border-top: 1px solid var(--line); margin: 0; padding-top: 1.25rem; }

.row { display: flex; gap: 1.25rem; padding: .5rem 0; align-items: baseline; }

.row dt {
  flex: 0 0 7.5rem;
  font-size: .78rem;
  text-transform: lowercase;
  letter-spacing: .08em;
  color: var(--muted);
}

.row dd { margin: 0; flex: 1; }

/* ------------------------------------------------------------------
   4. La course du soleil. Fabriquée avec des champs que le backend
   calcule vraiment (lever, coucher, heure d'observation), à la
   longitude de la station. Le point dit où en est la journée LÀ-BAS.
   ------------------------------------------------------------------ */
.sun { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.sun-track { position: relative; height: 1px; background: var(--line); margin: 1.5rem 0 .5rem; }
.sun-dot {
  position: absolute; top: 50%; width: 11px; height: 11px;
  margin: -5.5px 0 0 -5.5px; border-radius: 50%;
  background: var(--accent);
  transition: left .8s cubic-bezier(.22,1,.36,1);
}
.sun-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }

/* ------------------------------------------------------------------
   5. Commandes. Discrètes : la page sert à lire la météo, pas à régler
   un instrument. Elles ne s'ouvrent que si on les demande.
   ------------------------------------------------------------------ */
.tools { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; font-size: .9rem; }
.tools summary { cursor: pointer; color: var(--muted); }
.tools summary:hover { color: var(--ink); }
.fields { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; align-items: center; }

input, select, button {
  font: inherit; font-size: .9rem;
  padding: .45rem .7rem;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 3px;
}
input { width: 7.5rem; font-variant-numeric: tabular-nums; }
button { cursor: pointer; border-color: var(--accent); color: var(--accent); font-weight: 600; }
button:hover { background: var(--accent); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tech {
  margin-top: 1rem; font-size: .78rem; color: var(--muted);
  font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
}

/* États de service. Un écran vide invite à agir, une erreur dit quoi faire. */
.notice { padding: 2rem 0; color: var(--muted); }
.notice b { display: block; color: var(--ink); font-size: 1.15rem; font-weight: 500; margin-bottom: .35rem; }

[hidden] { display: none !important; }

/* Apparition en deux temps : la ligne brute, puis sa traduction. */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.reveal { animation: rise .5s ease both; }
.reveal-late { animation: rise .5s ease .18s both; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 30rem) {
  .lede { flex-direction: column; gap: .5rem; }
  .temp { margin-left: 0; }
  .row { flex-direction: column; gap: .1rem; }
  .row dt { flex-basis: auto; }
}
</style>
</head>
<body>
<main>

  <!-- État de départ et messages de service. Le contenu ci-dessous est le
       repli AVANT exécution du script : dès qu'il tourne, appliquerChrome()
       le réécrit dans la langue choisie. -->
  <div class="notice" id="notice">
    <b>Recherche de la station la plus proche</b>
    Autorisez la localisation, ou saisissez une position plus bas.
  </div>

  <!-- Le relevé, masqué tant qu'il n'y a rien à montrer -->
  <article id="card" hidden>
    <p class="raw reveal" id="raw"></p>

    <div class="lede reveal-late">
      <h1 class="headline" id="headline"></h1>
      <div class="temp" id="temp"></div>
    </div>

    <p class="place reveal-late" id="place"></p>

    <dl class="report reveal-late" id="report"></dl>

    <section class="sun reveal-late" id="sun">
      <div class="sun-track"><span class="sun-dot" id="sunDot"></span></div>
      <div class="sun-ends">
        <span id="sunrise"></span>
        <span id="sunset"></span>
      </div>
    </section>
  </article>

  <details class="tools">
    <summary id="toolsTitre">Choisir une position</summary>
    <div class="fields">
      <input id="lat" type="number" step="0.01" placeholder="latitude" aria-label="Latitude">
      <input id="lon" type="number" step="0.01" placeholder="longitude" aria-label="Longitude">
      <!-- Les noms de langue restent des ENDONYMES (« Français », jamais
           « French ») : c'est la convention d'un sélecteur de langue, et non
           une chaîne oubliée à la traduction. -->
      <select id="lang" aria-label="Langue">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
      <button id="go">Consulter</button>
      <button id="here" type="button">Me localiser</button>
    </div>
    <p class="tech" id="tech"></p>
  </details>

</main>

<script>
// ---------------------------------------------------------------
// Le client ne décode RIEN. Il affiche ce que l'API a déjà rédigé :
// c'est la règle du projet, et c'est pour ça que ce fichier est court.
// ---------------------------------------------------------------

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------
// TEXTES DE LA PAGE (le « chrome »).
//
// L'API traduit déjà le bloc `text` (vent, visibilité, nuages...). Mais tout
// ce qui entoure ces phrases appartient à la page : intitulés, provenance,
// messages d'échec, boutons. Ils étaient écrits en français en dur, donc
// `lang=en` rendait une page à moitié anglaise (constat du 28/07/2026).
//
// PHRASES ENTIÈRES, JAMAIS DE FRAGMENTS RECOLLÉS. C'est la leçon déjà payée
// dans src/i18n/en.ts avec le repère `{i}` : « il y a 22 min » place le
// marqueur temporel DEVANT, l'anglais le place DERRIÈRE (« 22 min ago »).
// Un dictionnaire mot à mot recollé par concaténation produirait de l'anglais
// faux. Chaque entrée porte donc sa phrase complète, avec des trous `{nom}`
// remplis au rendu.
//
// EN ATTENTE DE VALIDATION : les formulations anglaises ci-dessous sont une
// PROPOSITION de Claude, comme celles de src/i18n/en.ts, et non un acquis.
// La règle du projet veut que Xavier écrive les phrases destinées au public.
// ---------------------------------------------------------------
const TEXTES = {
  fr: {
    chercheTitre: "Recherche de la station la plus proche",
    chercheSuite: "Autorisez la localisation, ou saisissez une position plus bas.",

    ligneVent: "vent",
    ligneVisibilite: "visibilité",
    ligneNuages: "nuages",
    lignePhenomenes: "phénomènes",
    ligneMesures: "mesures",

    headlineDefaut: "Relevé disponible",
    stationInconnue: "Station inconnue",
    lieu: "{nom}, à {km} km",
    lieuSansDistance: "{nom}",
    observe: "Observé à {heure} heure locale",
    observeSansHeure: "Observé",
    age: "il y a {min} min",
    agePerime: "relevé vieux de {min} minutes",

    ressenti: "ressenti {v}°",
    humidite: "humidité {v} %",
    pression: "{v} hPa",

    lever: "lever {heure}",
    coucher: "coucher {heure}",
    fuseauInconnu: "fuseau inconnu",

    outilsTitre: "Choisir une position",
    boutonConsulter: "Consulter",
    boutonIci: "Me localiser",
    labelLat: "Latitude",
    labelLon: "Longitude",
    labelLangue: "Langue",

    // Messages d'échec : dire ce qui s'est passé et quoi faire, sans jargon.
    codeHttp: " (code {status})",
    inattendu: ["Réponse inattendue", "Réessayez dans un instant."],
    invalid_position: ["Position inutilisable", "Vérifiez la latitude (-90 à 90) et la longitude (-180 à 180)."],
    no_station: ["Aucune station à proximité", "Il n'y a pas d'aéroport observateur dans cette zone. Essayez une position plus proche d'une ville."],
    only_stale: ["Aucune observation récente", "Les stations du secteur n'ont rien publié depuis plus de trois heures."],
    network_error: ["Source météo injoignable", "Le service d'observation ne répond pas. Réessayez dans un instant."],
    // Les deux ci-dessous ne viennent PAS de l'API : ce sont nos propres pannes,
    // et les nommer distinctement évite d'accuser la source météo à tort.
    serveur: ["Le service a rencontré une erreur", "Ce n'est pas la météo qui manque, c'est notre serveur qui a échoué."],
    hors_ligne: ["Service inaccessible", "Vérifiez votre connexion, puis réessayez."],
  },
  en: {
    chercheTitre: "Looking for the nearest station",
    chercheSuite: "Allow location access, or enter a position below.",

    ligneVent: "wind",
    ligneVisibilite: "visibility",
    ligneNuages: "clouds",
    lignePhenomenes: "weather",
    ligneMesures: "readings",

    headlineDefaut: "Observation available",
    stationInconnue: "Unknown station",
    lieu: "{nom}, {km} km away",
    lieuSansDistance: "{nom}",
    observe: "Observed at {heure} local time",
    observeSansHeure: "Observed",
    age: "{min} min ago",
    agePerime: "observation is {min} minutes old",

    ressenti: "feels like {v}°",
    humidite: "humidity {v} %",
    pression: "{v} hPa",

    lever: "sunrise {heure}",
    coucher: "sunset {heure}",
    fuseauInconnu: "unknown time zone",

    outilsTitre: "Choose a position",
    boutonConsulter: "Show",
    boutonIci: "Locate me",
    labelLat: "Latitude",
    labelLon: "Longitude",
    labelLangue: "Language",

    codeHttp: " (code {status})",
    inattendu: ["Unexpected response", "Please try again in a moment."],
    invalid_position: ["Unusable position", "Check the latitude (-90 to 90) and the longitude (-180 to 180)."],
    no_station: ["No station nearby", "There is no reporting airport in this area. Try a position closer to a town."],
    only_stale: ["No recent observation", "Stations in this area have published nothing for more than three hours."],
    network_error: ["Weather source unreachable", "The observation service is not responding. Please try again in a moment."],
    serveur: ["The service hit an error", "The weather is not what is missing here: our own server failed."],
    hors_ligne: ["Service unreachable", "Check your connection, then try again."],
  },
};

// La langue est TOUJOURS passée en paramètre, jamais relue depuis le <select>
// au fond d'une fonction d'affichage. Même raison que `buildResponse(…, lang)`
// côté serveur : un défaut implicite rendrait un oubli silencieux. En prime,
// cela ferme la fenêtre où l'utilisateur change de langue pendant la requête
// et où le chrome ne dirait plus la même langue que les phrases de l'API.
const T = (lang) => TEXTES[lang] ?? TEXTES.fr;

// Remplit les trous `{nom}` d'un modèle. Aucun échappement ici : tout ce qui
// en sort passe par textContent, jamais par innerHTML.
const remplir = (modele, valeurs) =>
  modele.replace(/\{(\w+)\}/g, (_, cle) => valeurs[cle]);

// Séparateur décimal. Propriété STRUCTURELLE de la langue et non un choix de
// vocabulaire : le français écrit « 21,4 km », l'anglais « 21.4 km ». C'est la
// même règle que le .replace(".", ",") qui termine src/i18n/fr.ts, et le
// défaut visible sur la capture (« à 21.4 km » en français).
const nombre = (v, lang) => (lang === "fr" ? String(v).replace(".", ",") : String(v));

// Dernier échec affiché, retenu pour pouvoir le RE-rendre si la langue change
// alors qu'aucune donnée n'est à l'écran (un échec ne déclenche pas de
// nouvelle requête, donc rien ne repasserait par afficherEchec sans cela).
let dernierEchec = null;

function rendreNotice(titre, suite) {
  $("card").hidden = true;
  $("notice").hidden = false;
  $("notice").innerHTML = `<b></b><span></span>`;
  $("notice").firstChild.textContent = titre;
  $("notice").lastChild.textContent = suite;
}

function afficherEchec(code, status, lang) {
  const t = T(lang);
  const [titre, suite] = t[code] ?? t.inattendu;
  const detail = status ? remplir(t.codeHttp, { status }) : "";
  dernierEchec = { code, status };
  rendreNotice(titre + detail, suite);
}

// Applique la langue à tout ce qui ne dépend PAS d'une réponse de l'API :
// commandes, intitulés, et l'écran de service en cours. Appelée au démarrage
// et à chaque changement de langue.
function appliquerChrome(lang) {
  const t = T(lang);
  document.documentElement.lang = lang;
  $("toolsTitre").textContent = t.outilsTitre;
  $("go").textContent = t.boutonConsulter;
  $("here").textContent = t.boutonIci;
  $("lat").setAttribute("aria-label", t.labelLat);
  $("lon").setAttribute("aria-label", t.labelLon);
  $("lang").setAttribute("aria-label", t.labelLangue);
  // Les repères de saisie restent en minuscules et identiques dans les deux
  // langues (« latitude », « longitude ») : ce sont des termes techniques.
  if ($("card").hidden) {
    if (dernierEchec) afficherEchec(dernierEchec.code, dernierEchec.status, lang);
    else rendreNotice(t.chercheTitre, t.chercheSuite);
  }
}

// Position du soleil sur sa course, en fraction de 0 à 1.
// Renvoie null aux hautes latitudes, où lever et coucher peuvent manquer
// (jour ou nuit polaire) : on n'invente pas une course qui n'existe pas.
function fractionDuJour(obs, lever, coucher) {
  if (!obs || !lever || !coucher) return null;
  const min = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const a = min(lever), b = min(coucher), t = min(obs);
  if (b <= a) return null; // course à cheval sur minuit : on s'abstient
  return Math.min(1, Math.max(0, (t - a) / (b - a)));
}

function afficher(r, lang) {
  const t = T(lang);

  // 1. La lumière de la page vient de la STATION, pas du navigateur.
  document.documentElement.dataset.sky = r.sun && r.sun.isDay === false ? "night" : "day";
  document.documentElement.lang = lang;

  dernierEchec = null;
  $("notice").hidden = true;
  $("card").hidden = false;

  $("raw").textContent = r.raw;
  $("headline").textContent = r.text.headline || t.headlineDefaut;
  $("temp").textContent = r.temperature && r.temperature.value !== null ? `${r.temperature.value}°` : "";

  // 2. Provenance : quelle station, à quelle distance, et à quelle heure
  // LOCALE de la station. L'âge n'est signalé que s'il devient gênant.
  // Chaque morceau est une phrase entière du dictionnaire : « à 21,4 km »
  // devient « 21.4 km away », ce qu'une concaténation ne saurait pas faire.
  const s = r.station;
  const nom = s.name ?? s.icao ?? t.stationInconnue;
  const lieu = s.distanceKm !== null
    ? remplir(t.lieu, { nom, km: nombre(s.distanceKm, lang) })
    : remplir(t.lieuSansDistance, { nom });
  const heure = r.observedLocal
    ? remplir(t.observe, { heure: r.observedLocal })
    : t.observeSansHeure;
  const age = r.isStale
    ? remplir(t.agePerime, { min: r.ageMinutes })
    : remplir(t.age, { min: r.ageMinutes });

  $("place").innerHTML = `<strong></strong><span><br><span id="obs"></span> · <span id="ageTxt"></span></span>`;
  $("place").firstChild.textContent = lieu;
  $("obs").textContent = heure;
  $("ageTxt").textContent = age;
  if (r.isStale) $("ageTxt").className = "stale";

  // 3. Le relevé. Une ligne n'apparaît que si le backend a quelque chose
  // à en dire : un METAR muet sur les nuages ne produit pas de ligne vide.
  // Chaque entrée pointe une phrase DÉJÀ écrite par le backend (bloc `text`),
  // jamais une valeur à formater ici ; seul l'INTITULÉ appartient à la page.
  const LIGNES = [
    [t.ligneVent, r.text.wind],
    [t.ligneVisibilite, r.text.visibility],
    [t.ligneNuages, r.text.clouds],
    [t.lignePhenomenes, r.text.phenomena],
  ];
  const dl = $("report");
  dl.textContent = "";
  for (const [intitule, phrase] of LIGNES) {
    if (!phrase) continue;
    const div = document.createElement("div");
    div.className = "row";
    const dt = document.createElement("dt");
    dt.textContent = intitule;
    const dd = document.createElement("dd");
    dd.textContent = phrase;
    div.append(dt, dd);
    dl.append(div);
  }
  // Ligne de synthèse chiffrée, composée ici parce qu'elle n'existe pas
  // comme phrase dans le contrat : ce sont des VALEURS, pas du texte.
  const temp = r.temperature, chiffres = [];
  if (temp && temp.feelsLike !== null) chiffres.push(remplir(t.ressenti, { v: temp.feelsLike }));
  if (temp && temp.humidity !== null) chiffres.push(remplir(t.humidite, { v: temp.humidity }));
  if (r.pressure && r.pressure.value !== null) chiffres.push(remplir(t.pression, { v: r.pressure.value }));
  if (chiffres.length) {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<dt></dt><dd></dd>`;
    div.firstChild.textContent = t.ligneMesures;
    div.lastChild.textContent = chiffres.join(" · ");
    dl.append(div);
  }

  // 4. La course du soleil, à la longitude de la station.
  const f = r.sun ? fractionDuJour(r.observedLocal, r.sun.sunrise, r.sun.sunset) : null;
  $("sun").hidden = f === null;
  if (f !== null) {
    $("sunDot").style.left = `${f * 100}%`;
    $("sunrise").textContent = remplir(t.lever, { heure: r.sun.sunrise });
    $("sunset").textContent = remplir(t.coucher, { heure: r.sun.sunset });
  }

  // 5. Détail technique, pour la mise au point.
  $("tech").textContent =
    `icon=${r.icon} · cap ${r.station.bearingDeg}° · ${r.station.timezone ?? t.fuseauInconnu}` +
    (r.warnings.length ? ` · ${r.warnings.join(" · ")}` : "");
}

async function consulter(lat, lon) {
  // La langue est LUE UNE FOIS ici, puis transmise partout : la requête et
  // l'affichage parlent forcément la même, même si le <select> change pendant
  // que la réponse voyage.
  const lang = $("lang").value;
  appliquerChrome(lang);
  $("lat").value = lat.toFixed(2);
  $("lon").value = lon.toFixed(2);
  const url = `/api/nearest?lat=${lat}&lon=${lon}&lang=${lang}&units=metric`;
  try {
    const res = await fetch(url);
    // On lit d'abord en TEXTE. Un serveur en panne renvoie une page HTML, et
    // `res.json()` lèverait : l'incident du 27/07/2026 a montré qu'un plantage
    // à 500 se retrouvait alors affiché comme « source météo injoignable »,
    // c'est-à-dire en accusant la source d'une faute qui était la nôtre.
    const texte = await res.text();
    let body = null;
    try { body = JSON.parse(texte); } catch { /* ce n'est pas du JSON */ }

    if (body === null) return afficherEchec("serveur", res.status, lang);
    if (!res.ok) return afficherEchec(body.error, null, lang);
    afficher(body, lang);
  } catch {
    // Ici, et ici seulement, la requête n'a jamais abouti : navigateur hors
    // ligne, ou service inaccessible. C'est le seul vrai cas « injoignable ».
    afficherEchec("hors_ligne", null, lang);
  }
}

function localiser() {
  if (!navigator.geolocation) return consulter(48.73, 7.71);
  navigator.geolocation.getCurrentPosition(
    (p) => consulter(p.coords.latitude, p.coords.longitude),
    // Refus ou échec : on sert quand même quelque chose plutôt qu'un écran mort.
    () => consulter(48.73, 7.71),
    { timeout: 8000 },
  );
}

$("go").addEventListener("click", () => {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  if (Number.isFinite(lat) && Number.isFinite(lon)) consulter(lat, lon);
});
$("here").addEventListener("click", localiser);
$("lang").addEventListener("change", () => {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  // Le chrome bascule TOUT DE SUITE, même sans position valide à consulter :
  // sinon changer de langue sur l'écran d'échec ne ferait rien du tout.
  if (Number.isFinite(lat) && Number.isFinite(lon)) consulter(lat, lon);
  else appliquerChrome($("lang").value);
});

appliquerChrome($("lang").value);
localiser();
</script>
