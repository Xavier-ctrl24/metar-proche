<!doctype html>
<html lang="fr" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR Proche</title>
<meta name="description" content="La météo de la station d'observation la plus proche, en clair.">
<style>
/* ------------------------------------------------------------------
   Palette. Deux jeux complets, choisis par la LUMIÈRE DE LA STATION
   (sun.isDay renvoyé par l'API), et non par le thème du navigateur.
   C'est le parti pris de la page : on consulte Fidji, on voit sa nuit.
   ------------------------------------------------------------------ */
:root[data-sky="day"] {
  --bg: #e6eef5;          /* bleu de carte aéronautique, très pâle */
  --surface: #f7fafc;
  --ink: #12233b;         /* encre marine */
  --muted: #61748f;
  --line: #c3d2e2;
  --accent: #0e7c86;      /* cyan profond, couleur des isobares */
  /* Les deux accents des icônes, repris de la planche de Xavier : l'ambre
     de l'astre et de l'éclair, le bleu de tout ce qui est mouillé.
     L'ambre est CUIVRÉ ici et non jaune : le #f5a623 de la planche ne fait
     que 1,7:1 sur ce fond très pâle, sous le seuil de 3:1 des éléments
     graphiques. Mesuré, pas estimé. Ce cuivre tient 3,3:1 en restant chaud ;
     descendre plus bas virerait au brun. C'est exactement la correction
     faite au bleu de nuit, mais dans l'autre sens. */
  --ico-sun: #c96a00;
  --ico-wet: #2b6cb0;
}
:root[data-sky="night"] {
  --bg: #0d1524;
  --surface: #141f33;
  --ink: #e8eef7;
  --muted: #8296b0;
  --line: #26344b;
  --accent: #e8b04b;      /* ambre de lampe : la lumière qu'on voit la nuit */
  /* Le bleu de la planche est illisible sur le fond nuit (#0d1524) : on
     l'éclaircit ici plutôt que de le figer en dur dans le SVG. C'est tout
     l'intérêt de passer les accents par des variables de thème. */
  --ico-sun: #e8b04b;
  --ico-wet: #7fb3e8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: clamp(1.25rem, 5vw, 4rem);
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  /* La bascule jour/nuit se voit : c'est le geste signature de la page. */
  transition: background-color .6s ease, color .6s ease;
}

main { max-width: 46rem; margin: 0 auto; }

/* ------------------------------------------------------------------
   1. La ligne brute. Elle ouvre la page parce que c'est L'ARTEFACT du
   sujet : la chaîne que personne ne sait lire, et dont tout le reste
   de la page est la traduction. Elle est donc en tête, en chasse fixe,
   et volontairement discrète : c'est la provenance, pas le message.
   ------------------------------------------------------------------ */
.raw {
  font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
  font-size: .8rem;
  letter-spacing: .02em;
  color: var(--muted);
  word-break: break-word;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}

/* ------------------------------------------------------------------
   2. Le message en clair.
   ------------------------------------------------------------------ */
.lede { display: flex; gap: 1.5rem; align-items: flex-start; padding: 2rem 0 1.5rem; }

.headline {
  margin: 0;
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  font-weight: 350;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.temp {
  margin-left: auto;
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
  white-space: nowrap;
}

.place { margin: 0; color: var(--muted); }
.place strong { color: var(--ink); font-weight: 600; }

/* Mention de fraîcheur : muette d'habitude, franche quand ça compte. */
.stale { color: var(--accent); font-weight: 600; }

/* ------------------------------------------------------------------
   3. Le relevé. Une liste de définitions : les intitulés reprennent
   les groupes du METAR lui-même, en français. La structure porte donc
   une information vraie, elle ne décore pas.
   ------------------------------------------------------------------ */
.report { border-top: 1px solid var(--line); margin: 0; padding-top: 1.25rem; }

.row { display: flex; gap: 1.25rem; padding: .5rem 0; align-items: baseline; }

.row dt {
  flex: 0 0 7.5rem;
  font-size: .78rem;
  text-transform: lowercase;
  letter-spacing: .08em;
  color: var(--muted);
}

.row dd { margin: 0; flex: 1; }

/* ------------------------------------------------------------------
   4. La course du soleil. Fabriquée avec des champs que le backend
   calcule vraiment (lever, coucher, heure d'observation), à la
   longitude de la station. Le point dit où en est la journée LÀ-BAS.
   ------------------------------------------------------------------ */
.sun { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.sun-track { position: relative; height: 1px; background: var(--line); margin: 1.5rem 0 .5rem; }
.sun-dot {
  position: absolute; top: 50%; width: 11px; height: 11px;
  margin: -5.5px 0 0 -5.5px; border-radius: 50%;
  background: var(--accent);
  transition: left .8s cubic-bezier(.22,1,.36,1);
}
.sun-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }

/* ------------------------------------------------------------------
   5. Commandes. Discrètes : la page sert à lire la météo, pas à régler
   un instrument. Elles ne s'ouvrent que si on les demande.
   ------------------------------------------------------------------ */
.tools { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; font-size: .9rem; }
.tools summary { cursor: pointer; color: var(--muted); }
.tools summary:hover { color: var(--ink); }
.fields { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; align-items: center; }

input, select, button {
  font: inherit; font-size: .9rem;
  padding: .45rem .7rem;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 3px;
}
input { width: 7.5rem; font-variant-numeric: tabular-nums; }
button { cursor: pointer; border-color: var(--accent); color: var(--accent); font-weight: 600; }
button:hover { background: var(--accent); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tech {
  margin-top: 1rem; font-size: .78rem; color: var(--muted);
  font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
}

/* États de service. Un écran vide invite à agir, une erreur dit quoi faire. */
.notice { padding: 2rem 0; color: var(--muted); }
.notice b { display: block; color: var(--ink); font-size: 1.15rem; font-weight: 500; margin-bottom: .35rem; }

[hidden] { display: none !important; }

/* ------------------------------------------------------------------
   6. Icônes. Dessinées d'après la planche de Xavier (icones.png) :
   trait seul, pas d'aplat, deux accents seulement.

   Elles sont un SPRITE SVG en ligne, en bas du document. Aucune requête
   réseau, aucun fichier à servir, aucun CDN : c'est la même règle que le
   reste de la page. On les pose avec <use href="#i-...">.

   --sw est l'épaisseur du trait, exprimée dans le repère du dessin
   (viewBox 64). Une même épaisseur ne marche PAS aux deux tailles : à
   3,4 rem elle donnerait un trait gras, à 1 rem un cheveu. Chaque taille
   a donc la sienne, et les primitives mises à l'échelle divisent la
   leur d'autant (classes .sc*).
   ------------------------------------------------------------------ */
.ico {
  width: 1em; height: 1em;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--sw, 3);
  stroke-linecap: round;
  stroke-linejoin: round;
  overflow: visible;
}
/* Compensation d'échelle : une primitive agrandie 1,9 fois verrait son
   trait grossir d'autant. On divise donc, et l'épaisseur reste unie. */
.sc08 { stroke-width: calc(var(--sw, 3) / 0.8); }
.sc11 { stroke-width: calc(var(--sw, 3) / 1.1); }
.sc13 { stroke-width: calc(var(--sw, 3) / 1.3); }
.sc15 { stroke-width: calc(var(--sw, 3) / 1.5); }
.sc17 { stroke-width: calc(var(--sw, 3) / 1.7); }
.sc19 { stroke-width: calc(var(--sw, 3) / 1.9); }
.sc22 { stroke-width: calc(var(--sw, 3) / 2.2); }
.sc26 { stroke-width: calc(var(--sw, 3) / 2.6); }
/* Les deux seules couleurs qui échappent à currentColor. */
.c-sun { stroke: var(--ico-sun); }
.c-wet { stroke: var(--ico-wet); }
.dash { stroke-dasharray: 3 4; }

/* Grande icône de tête, à côté de la phrase. Elle porte la même
   information que le titre : elle est donc aria-hidden, et c'est le texte
   qui parle aux lecteurs d'écran. */
.ico-lede { font-size: clamp(3rem, 11vw, 4.6rem); --sw: 2.4; color: var(--ink); }

/* Petites icônes des intitulés du relevé. Trait plus épais : à cette
   taille, l'épaisseur du grand format donnerait un cheveu invisible. */
.row dt { display: flex; align-items: center; gap: .5rem; }
.ico-dt { font-size: 1.35rem; --sw: 4.2; }

/* Apparition en deux temps : la ligne brute, puis sa traduction. */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.reveal { animation: rise .5s ease both; }
.reveal-late { animation: rise .5s ease .18s both; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 30rem) {
  .lede { flex-direction: column; gap: .5rem; }
  .temp { margin-left: 0; }
  .row { flex-direction: column; gap: .1rem; }
  .row dt { flex-basis: auto; }
}
</style>
</head>
<body>

<!-- ==================================================================
     SPRITE D'ICÔNES.

     Deux étages, et c'est volontaire :
     1. des PRIMITIVES (#p-...) : soleil, lune, nuage, gouttes, éclair...
        Chacune est centrée sur son origine, ce qui permet de la POSER
        n'importe où avec un simple translate().
     2. les 24 ICÔNES du contrat (#i-...), composées de primitives.

     Pourquoi composer plutôt que dessiner 24 fois : le contrat distingue
     rain_light / rain / rain_heavy, qui ne diffèrent QUE par le nombre de
     gouttes sous le même nuage. Dessiner chacune en entier ferait 24
     nuages à maintenir, et un nuage retouché dans 23 fichiers sur 24.
     ================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs>

  <!-- Le nuage. Repère natif 24 (celui des jeux d'icônes à trait), recentré
       sur son origine, puis mis à l'échelle voulue par chaque icône. -->
  <g id="p-cloud" transform="translate(-12,-11)">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </g>

  <!-- Le soleil : disque + huit rayons. -->
  <g id="p-sun" transform="translate(-12,-12)">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </g>

  <!-- La lune. La planche de Xavier n'a pas de variante nocturne : le
       contrat en exige pourtant huit (clear/few/partly_cloudy/showers).
       Un croissant est le seul dessin qui dise « nuit » sans un mot. -->
  <g id="p-moon" transform="translate(-12,-12)">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </g>

  <!-- Les gouttes. Repère final (64), donc AUCUNE mise à l'échelle : leur
       épaisseur suit directement celle de l'icône. Inclinées comme sur la
       planche, la pluie ne tombe pas à la verticale.
       Quatre densités, parce que le contrat en distingue quatre :
       drizzle < rain_light < rain < rain_heavy. -->
  <g id="p-drop1"><path d="M1.5,-5 -1.5,5"/></g>
  <g id="p-rain2"><path d="M-5.5,-5 -8.5,5 M8.5,-5 5.5,5"/></g>
  <g id="p-rain2w"><path d="M-13.5,-5 -16.5,5 M16.5,-5 13.5,5"/></g>
  <g id="p-rain3"><path d="M-9.5,-5 -12.5,5 M1.5,-5 -1.5,5 M12.5,-5 9.5,5"/></g>
  <g id="p-rain4"><path d="M-13.5,-5 -16.5,5 M-3.5,-5 -6.5,5 M6.5,-5 3.5,5 M16.5,-5 13.5,5"/></g>
  <!-- La bruine : mêmes traits, mais courts. C'est ce qui la distingue. -->
  <g id="p-drizzle"><path d="M-9,-3 -11,3 M1,-3 -1,3 M11,-3 9,3"/></g>

  <!-- Le flocon : trois axes et deux chevrons. -->
  <g id="p-flake">
    <path d="M0,-8V8M-6.9,-4 6.9,4M-6.9,4 6.9,-4M-3,-5 0,-8 3,-5M-3,5 0,8 3,5"/>
  </g>

  <!-- L'éclair. -->
  <g id="p-bolt"><path d="M3,-9 -5,2 1,2 -3,10"/></g>

  <!-- La grêle : des grains, donc des anneaux et non des traits. -->
  <g id="p-hail">
    <circle cx="-9" cy="-1" r="1.8"/><circle cx="0" cy="2" r="1.8"/><circle cx="9" cy="-1" r="1.8"/>
  </g>

  <!-- Le sol pris en glace : ce qui distingue la pluie VERGLAÇANTE de la
       pluie ordinaire n'est pas la goutte, c'est ce qu'elle devient en bas. -->
  <g id="p-glace"><path d="M-15,0H15"/></g>

  <!-- Brouillard : des couches horizontales. Brume : des ondes. C'est la
       distinction de la planche (FG/BR d'un côté, HZ de l'autre). -->
  <g id="p-fog"><path d="M-22,-12H8M-14,-4H22M-22,4H14M-8,12H22"/></g>
  <g id="p-waves">
    <path d="M-21,-10c7,-8 14,-8 21,0s14,8 21,0M-21,0c7,-8 14,-8 21,0s14,8 21,0M-21,10c7,-8 14,-8 21,0s14,8 21,0"/>
  </g>
  <!-- La fumée monte : les mêmes ondes, mais debout. -->
  <g id="p-plumes">
    <path d="M-14,18c0,-8 8,-10 0,-18s8,-10 0,-18M0,18c0,-8 8,-10 0,-18s8,-10 0,-18M14,18c0,-8 8,-10 0,-18s8,-10 0,-18"/>
  </g>

</defs>

<!-- ==================================================================
     LES 24 ICÔNES DU CONTRAT.

     La liste n'est pas recopiée de la planche (12 dessins) mais des
     littéraux que `pickIcon` peut réellement rendre (src/icon.ts). Un
     jeton sans symbole donnerait un carré vide EN PRODUCTION, sur un cas
     que rien en local ne déclenche : exactement la forme du défaut
     d'imports du 27/07/2026. La page retombe en plus sur #i-unknown si
     l'identifiant est inconnu.
     ================================================================== -->

<!-- Ciel dégagé. -->
<symbol id="i-clear_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc22" transform="translate(32,32) scale(2.2)"/>
</symbol>
<symbol id="i-clear_night" viewBox="0 0 64 64">
  <!-- Échelle 2,6 et non 2,2 : le croissant occupe moins de place que le
       soleil rayonnant, il faut l'agrandir pour que les deux pèsent pareil
       dans la page (mesuré : 39,5 contre 48,4 unités à échelle égale). -->
  <use href="#p-moon" class="c-sun sc26" transform="translate(32,32) scale(2.6)"/>
</symbol>

<!-- FEW : l'astre et un nuage. -->
<symbol id="i-few_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc13" transform="translate(21,20) scale(1.3)"/>
  <use href="#p-cloud" class="sc15" transform="translate(35,38) scale(1.5)"/>
</symbol>
<symbol id="i-few_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc13" transform="translate(21,20) scale(1.3)"/>
  <use href="#p-cloud" class="sc15" transform="translate(35,38) scale(1.5)"/>
</symbol>

<!-- SCT : l'astre et deux nuages, le ciel se charge. -->
<symbol id="i-partly_cloudy_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc11" transform="translate(19,19) scale(1.1)"/>
  <use href="#p-cloud" class="sc15" transform="translate(31,36) scale(1.5)"/>
  <use href="#p-cloud" class="sc08" transform="translate(50,44) scale(0.8)"/>
</symbol>
<symbol id="i-partly_cloudy_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc11" transform="translate(19,19) scale(1.1)"/>
  <use href="#p-cloud" class="sc15" transform="translate(31,36) scale(1.5)"/>
  <use href="#p-cloud" class="sc08" transform="translate(50,44) scale(0.8)"/>
</symbol>

<!-- BKN et OVC : plus d'astre du tout, et c'est le message. -->
<symbol id="i-cloudy" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc17" transform="translate(28,26) scale(1.7)"/>
  <use href="#p-cloud" class="sc11" transform="translate(44,42) scale(1.1)"/>
</symbol>
<symbol id="i-overcast" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc15" transform="translate(23,25) scale(1.5)"/>
  <use href="#p-cloud" class="sc13" transform="translate(45,27) scale(1.3)"/>
  <use href="#p-cloud" class="sc19" transform="translate(32,38) scale(1.9)"/>
</symbol>

<!-- Pluie : même nuage, densité croissante. -->
<symbol id="i-drizzle" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,25) scale(1.9)"/>
  <use href="#p-drizzle" class="c-wet" transform="translate(32,50)"/>
</symbol>
<symbol id="i-rain_light" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,25) scale(1.9)"/>
  <use href="#p-rain2" class="c-wet" transform="translate(32,49)"/>
</symbol>
<symbol id="i-rain" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,25) scale(1.9)"/>
  <use href="#p-rain3" class="c-wet" transform="translate(32,49)"/>
</symbol>
<symbol id="i-rain_heavy" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,25) scale(1.9)"/>
  <use href="#p-rain4" class="c-wet" transform="translate(32,49)"/>
</symbol>

<!-- Averses : l'astre reste visible, c'est toute la différence avec la
     pluie continue. D'où la seule paire jour/nuit du groupe humide. -->
<symbol id="i-showers_day" viewBox="0 0 64 64">
  <use href="#p-sun" class="c-sun sc11" transform="translate(17,16) scale(1.1)"/>
  <use href="#p-cloud" class="sc17" transform="translate(36,29) scale(1.7)"/>
  <use href="#p-rain2" class="c-wet" transform="translate(36,51)"/>
</symbol>
<symbol id="i-showers_night" viewBox="0 0 64 64">
  <use href="#p-moon" class="c-sun sc11" transform="translate(17,16) scale(1.1)"/>
  <use href="#p-cloud" class="sc17" transform="translate(36,29) scale(1.7)"/>
  <use href="#p-rain2" class="c-wet" transform="translate(36,51)"/>
</symbol>

<!-- Solide et mixte. -->
<symbol id="i-snow" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,24) scale(1.9)"/>
  <use href="#p-flake" class="c-wet" transform="translate(32,49)"/>
</symbol>
<symbol id="i-sleet" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,24) scale(1.9)"/>
  <use href="#p-drop1" class="c-wet" transform="translate(22,49)"/>
  <use href="#p-flake" class="c-wet sc08" transform="translate(41,49) scale(0.8)"/>
</symbol>
<symbol id="i-hail" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,25) scale(1.9)"/>
  <use href="#p-hail" class="c-wet" transform="translate(32,50)"/>
</symbol>
<symbol id="i-freezing_rain" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,23) scale(1.9)"/>
  <use href="#p-rain2" class="c-wet" transform="translate(32,45)"/>
  <use href="#p-glace" class="c-wet" transform="translate(32,56)"/>
</symbol>

<!-- Orage. Le seul jeton en `danger` du contrat : l'éclair prend l'ambre. -->
<symbol id="i-thunderstorm" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,24) scale(1.9)"/>
  <use href="#p-rain2w" class="c-wet" transform="translate(32,49)"/>
  <use href="#p-bolt" class="c-sun" transform="translate(32,47)"/>
</symbol>

<!-- Ce qui gêne la vue. -->
<symbol id="i-fog" viewBox="0 0 64 64">
  <use href="#p-fog" transform="translate(32,32)"/>
</symbol>
<symbol id="i-mist" viewBox="0 0 64 64">
  <use href="#p-waves" transform="translate(32,32)"/>
</symbol>
<symbol id="i-dust" viewBox="0 0 64 64">
  <use href="#p-waves" transform="translate(32,26)"/>
  <use href="#p-hail" transform="translate(32,51)"/>
</symbol>
<symbol id="i-smoke" viewBox="0 0 64 64">
  <use href="#p-plumes" transform="translate(32,32)"/>
</symbol>

<!-- Rien de lisible. Le nuage en pointillé dit « on ne sait pas » sans
     un mot, donc sans rien à traduire. -->
<symbol id="i-unknown" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19 dash" transform="translate(32,32) scale(1.9)"/>
</symbol>

<!-- ==================================================================
     ICÔNES DE DONNÉES (#d-...), pour les intitulés du relevé. Elles ne
     viennent PAS du contrat : ce sont les rubriques de la page, donc
     elles ne suivent pas la liste de WeatherIcon et n'ont pas de repli.
     ================================================================== -->
<symbol id="d-vent" viewBox="0 0 64 64">
  <path d="M6,24H36a7,7 0 1 0 -7,-7M6,34H44a8,8 0 1 1 -8,8M10,44H28a6,6 0 1 0 -6,6"/>
</symbol>
<symbol id="d-visibilite" viewBox="0 0 64 64">
  <path d="M6,32c8,-11 40,-11 52,0c-12,11 -44,11 -52,0z"/>
  <circle cx="32" cy="32" r="8"/>
  <circle cx="32" cy="32" r="2.4" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="d-nuages" viewBox="0 0 64 64">
  <use href="#p-cloud" class="sc19" transform="translate(32,32) scale(1.9)"/>
</symbol>
<symbol id="d-phenomenes" viewBox="0 0 64 64">
  <path d="M32,8c0,0 15,17 15,27a15,15 0 0 1 -30,0C17,25 32,8 32,8z"/>
</symbol>
<symbol id="d-mesures" viewBox="0 0 64 64">
  <path d="M26,40V18a6,6 0 0 1 12,0V40"/>
  <circle cx="32" cy="46" r="9"/>
  <path d="M40,22h6M40,30h6"/>
</symbol>

</svg>

<main>

  <!-- État de départ et messages de service. Le contenu ci-dessous est le
       repli AVANT exécution du script : dès qu'il tourne, appliquerChrome()
       le réécrit dans la langue choisie. -->
  <div class="notice" id="notice">
    <b>Recherche de la station la plus proche</b>
    Autorisez la localisation, ou saisissez une position plus bas.
  </div>

  <!-- Le relevé, masqué tant qu'il n'y a rien à montrer -->
  <article id="card" hidden>
    <p class="raw reveal" id="raw"></p>

    <div class="lede reveal-late">
      <!-- L'icône du ciel. Elle dit la MÊME chose que le titre juste à côté
           (les deux sortent du même sélecteur, src/icon.ts), donc elle est
           aria-hidden : la doubler à voix haute n'apporterait rien, et lui
           écrire un texte de remplacement créerait une formulation de plus
           à traduire et à faire valider. -->
      <svg class="ico ico-lede" id="skyIcon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <use id="skyUse" href="#i-unknown"/>
      </svg>
      <h1 class="headline" id="headline"></h1>
      <div class="temp" id="temp"></div>
    </div>

    <p class="place reveal-late" id="place"></p>

    <dl class="report reveal-late" id="report"></dl>

    <section class="sun reveal-late" id="sun">
      <div class="sun-track"><span class="sun-dot" id="sunDot"></span></div>
      <div class="sun-ends">
        <span id="sunrise"></span>
        <span id="sunset"></span>
      </div>
    </section>
  </article>

  <details class="tools">
    <summary id="toolsTitre">Choisir une position</summary>
    <div class="fields">
      <input id="lat" type="number" step="0.01" placeholder="latitude" aria-label="Latitude">
      <input id="lon" type="number" step="0.01" placeholder="longitude" aria-label="Longitude">
      <!-- Les noms de langue restent des ENDONYMES (« Français », jamais
           « French ») : c'est la convention d'un sélecteur de langue, et non
           une chaîne oubliée à la traduction. -->
      <select id="lang" aria-label="Langue">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
      <button id="go">Consulter</button>
      <button id="here" type="button">Me localiser</button>
    </div>
    <p class="tech" id="tech"></p>
  </details>

</main>

<script>
// ---------------------------------------------------------------
// Le client ne décode RIEN. Il affiche ce que l'API a déjà rédigé :
// c'est la règle du projet, et c'est pour ça que ce fichier est court.
// ---------------------------------------------------------------

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------
// TEXTES DE LA PAGE (le « chrome »).
//
// L'API traduit déjà le bloc `text` (vent, visibilité, nuages...). Mais tout
// ce qui entoure ces phrases appartient à la page : intitulés, provenance,
// messages d'échec, boutons. Ils étaient écrits en français en dur, donc
// `lang=en` rendait une page à moitié anglaise (constat du 28/07/2026).
//
// PHRASES ENTIÈRES, JAMAIS DE FRAGMENTS RECOLLÉS. C'est la leçon déjà payée
// dans src/i18n/en.ts avec le repère `{i}` : « il y a 22 min » place le
// marqueur temporel DEVANT, l'anglais le place DERRIÈRE (« 22 min ago »).
// Un dictionnaire mot à mot recollé par concaténation produirait de l'anglais
// faux. Chaque entrée porte donc sa phrase complète, avec des trous `{nom}`
// remplis au rendu.
//
// Les formulations anglaises ci-dessous ont été proposées par Claude puis
// VALIDÉES par Xavier le 28/07/2026, comme celles de src/i18n/en.ts. Elles
// sont donc acquises : on ne les retouche plus sans lui, au même titre que le
// français.
// ---------------------------------------------------------------
const TEXTES = {
  fr: {
    chercheTitre: "Recherche de la station la plus proche",
    chercheSuite: "Autorisez la localisation, ou saisissez une position plus bas.",

    ligneVent: "vent",
    ligneVisibilite: "visibilité",
    ligneNuages: "nuages",
    lignePhenomenes: "phénomènes",
    ligneMesures: "mesures",

    headlineDefaut: "Relevé disponible",
    stationInconnue: "Station inconnue",
    lieu: "{nom}, à {km} km",
    lieuSansDistance: "{nom}",
    observe: "Observé à {heure} heure locale",
    observeSansHeure: "Observé",
    age: "il y a {min} min",
    agePerime: "relevé vieux de {min} minutes",

    ressenti: "ressenti {v}°",
    humidite: "humidité {v} %",
    pression: "{v} hPa",

    lever: "lever {heure}",
    coucher: "coucher {heure}",
    fuseauInconnu: "fuseau inconnu",

    outilsTitre: "Choisir une position",
    boutonConsulter: "Consulter",
    boutonIci: "Me localiser",
    labelLat: "Latitude",
    labelLon: "Longitude",
    labelLangue: "Langue",

    // Messages d'échec : dire ce qui s'est passé et quoi faire, sans jargon.
    codeHttp: " (code {status})",
    inattendu: ["Réponse inattendue", "Réessayez dans un instant."],
    invalid_position: ["Position inutilisable", "Vérifiez la latitude (-90 à 90) et la longitude (-180 à 180)."],
    no_station: ["Aucune station à proximité", "Il n'y a pas d'aéroport observateur dans cette zone. Essayez une position plus proche d'une ville."],
    only_stale: ["Aucune observation récente", "Les stations du secteur n'ont rien publié depuis plus de trois heures."],
    network_error: ["Source météo injoignable", "Le service d'observation ne répond pas. Réessayez dans un instant."],
    // Les deux ci-dessous ne viennent PAS de l'API : ce sont nos propres pannes,
    // et les nommer distinctement évite d'accuser la source météo à tort.
    serveur: ["Le service a rencontré une erreur", "Ce n'est pas la météo qui manque, c'est notre serveur qui a échoué."],
    hors_ligne: ["Service inaccessible", "Vérifiez votre connexion, puis réessayez."],
  },
  en: {
    chercheTitre: "Looking for the nearest station",
    chercheSuite: "Allow location access, or enter a position below.",

    ligneVent: "wind",
    ligneVisibilite: "visibility",
    ligneNuages: "clouds",
    lignePhenomenes: "weather",
    ligneMesures: "readings",

    headlineDefaut: "Observation available",
    stationInconnue: "Unknown station",
    lieu: "{nom}, {km} km away",
    lieuSansDistance: "{nom}",
    observe: "Observed at {heure} local time",
    observeSansHeure: "Observed",
    age: "{min} min ago",
    agePerime: "observation is {min} minutes old",

    ressenti: "feels like {v}°",
    humidite: "humidity {v} %",
    pression: "{v} hPa",

    lever: "sunrise {heure}",
    coucher: "sunset {heure}",
    fuseauInconnu: "unknown time zone",

    outilsTitre: "Choose a position",
    boutonConsulter: "Show",
    boutonIci: "Locate me",
    labelLat: "Latitude",
    labelLon: "Longitude",
    labelLangue: "Language",

    codeHttp: " (code {status})",
    inattendu: ["Unexpected response", "Please try again in a moment."],
    invalid_position: ["Unusable position", "Check the latitude (-90 to 90) and the longitude (-180 to 180)."],
    no_station: ["No station nearby", "There is no reporting airport in this area. Try a position closer to a town."],
    only_stale: ["No recent observation", "Stations in this area have published nothing for more than three hours."],
    network_error: ["Weather source unreachable", "The observation service is not responding. Please try again in a moment."],
    serveur: ["The service hit an error", "The weather is not what is missing here: our own server failed."],
    hors_ligne: ["Service unreachable", "Check your connection, then try again."],
  },
};

// La langue est TOUJOURS passée en paramètre, jamais relue depuis le <select>
// au fond d'une fonction d'affichage. Même raison que `buildResponse(…, lang)`
// côté serveur : un défaut implicite rendrait un oubli silencieux. En prime,
// cela ferme la fenêtre où l'utilisateur change de langue pendant la requête
// et où le chrome ne dirait plus la même langue que les phrases de l'API.
const T = (lang) => TEXTES[lang] ?? TEXTES.fr;

// Remplit les trous `{nom}` d'un modèle. Aucun échappement ici : tout ce qui
// en sort passe par textContent, jamais par innerHTML.
const remplir = (modele, valeurs) =>
  modele.replace(/\{(\w+)\}/g, (_, cle) => valeurs[cle]);

// Séparateur décimal. Propriété STRUCTURELLE de la langue et non un choix de
// vocabulaire : le français écrit « 21,4 km », l'anglais « 21.4 km ». C'est la
// même règle que le .replace(".", ",") qui termine src/i18n/fr.ts, et le
// défaut visible sur la capture (« à 21.4 km » en français).
const nombre = (v, lang) => (lang === "fr" ? String(v).replace(".", ",") : String(v));

// Dernier échec affiché, retenu pour pouvoir le RE-rendre si la langue change
// alors qu'aucune donnée n'est à l'écran (un échec ne déclenche pas de
// nouvelle requête, donc rien ne repasserait par afficherEchec sans cela).
let dernierEchec = null;

// Une ligne du relevé : icône, intitulé, phrase. L'icône est décorative
// (aria-hidden) parce que l'intitulé juste à côté dit déjà la même chose.
function rangee(intitule, phrase, icone) {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML =
    `<dt><svg class="ico ico-dt" viewBox="0 0 64 64" aria-hidden="true" focusable="false">` +
    `<use href="#${icone}"/></svg><span></span></dt><dd></dd>`;
  div.querySelector("dt span").textContent = intitule;
  div.querySelector("dd").textContent = phrase;
  return div;
}

// Pose l'icône du ciel. REPLI OBLIGATOIRE : un jeton sans symbole rendrait
// un carré vide, et ce serait invisible en local (les 24 jetons ne sortent
// pas tous d'un METAR de Strasbourg). On retombe donc sur #i-unknown, qui
// est un dessin, pas un trou.
function poserIcone(jeton) {
  const id = jeton && document.getElementById(`i-${jeton}`) ? jeton : "unknown";
  $("skyUse").setAttribute("href", `#i-${id}`);
}

function rendreNotice(titre, suite) {
  $("card").hidden = true;
  $("notice").hidden = false;
  $("notice").innerHTML = `<b></b><span></span>`;
  $("notice").firstChild.textContent = titre;
  $("notice").lastChild.textContent = suite;
}

function afficherEchec(code, status, lang) {
  const t = T(lang);
  const [titre, suite] = t[code] ?? t.inattendu;
  const detail = status ? remplir(t.codeHttp, { status }) : "";
  dernierEchec = { code, status };
  rendreNotice(titre + detail, suite);
}

// Applique la langue à tout ce qui ne dépend PAS d'une réponse de l'API :
// commandes, intitulés, et l'écran de service en cours. Appelée au démarrage
// et à chaque changement de langue.
function appliquerChrome(lang) {
  const t = T(lang);
  document.documentElement.lang = lang;
  $("toolsTitre").textContent = t.outilsTitre;
  $("go").textContent = t.boutonConsulter;
  $("here").textContent = t.boutonIci;
  $("lat").setAttribute("aria-label", t.labelLat);
  $("lon").setAttribute("aria-label", t.labelLon);
  $("lang").setAttribute("aria-label", t.labelLangue);
  // Les repères de saisie restent en minuscules et identiques dans les deux
  // langues (« latitude », « longitude ») : ce sont des termes techniques.
  if ($("card").hidden) {
    if (dernierEchec) afficherEchec(dernierEchec.code, dernierEchec.status, lang);
    else rendreNotice(t.chercheTitre, t.chercheSuite);
  }
}

// Position du soleil sur sa course, en fraction de 0 à 1.
// Renvoie null aux hautes latitudes, où lever et coucher peuvent manquer
// (jour ou nuit polaire) : on n'invente pas une course qui n'existe pas.
function fractionDuJour(obs, lever, coucher) {
  if (!obs || !lever || !coucher) return null;
  const min = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const a = min(lever), b = min(coucher), t = min(obs);
  if (b <= a) return null; // course à cheval sur minuit : on s'abstient
  return Math.min(1, Math.max(0, (t - a) / (b - a)));
}

function afficher(r, lang) {
  const t = T(lang);

  // 1. La lumière de la page vient de la STATION, pas du navigateur.
  document.documentElement.dataset.sky = r.sun && r.sun.isDay === false ? "night" : "day";
  document.documentElement.lang = lang;

  dernierEchec = null;
  $("notice").hidden = true;
  $("card").hidden = false;

  $("raw").textContent = r.raw;
  poserIcone(r.icon);
  $("headline").textContent = r.text.headline || t.headlineDefaut;
  $("temp").textContent = r.temperature && r.temperature.value !== null ? `${r.temperature.value}°` : "";

  // 2. Provenance : quelle station, à quelle distance, et à quelle heure
  // LOCALE de la station. L'âge n'est signalé que s'il devient gênant.
  // Chaque morceau est une phrase entière du dictionnaire : « à 21,4 km »
  // devient « 21.4 km away », ce qu'une concaténation ne saurait pas faire.
  const s = r.station;
  const nom = s.name ?? s.icao ?? t.stationInconnue;
  const lieu = s.distanceKm !== null
    ? remplir(t.lieu, { nom, km: nombre(s.distanceKm, lang) })
    : remplir(t.lieuSansDistance, { nom });
  const heure = r.observedLocal
    ? remplir(t.observe, { heure: r.observedLocal })
    : t.observeSansHeure;
  const age = r.isStale
    ? remplir(t.agePerime, { min: r.ageMinutes })
    : remplir(t.age, { min: r.ageMinutes });

  $("place").innerHTML = `<strong></strong><span><br><span id="obs"></span> · <span id="ageTxt"></span></span>`;
  $("place").firstChild.textContent = lieu;
  $("obs").textContent = heure;
  $("ageTxt").textContent = age;
  if (r.isStale) $("ageTxt").className = "stale";

  // 3. Le relevé. Une ligne n'apparaît que si le backend a quelque chose
  // à en dire : un METAR muet sur les nuages ne produit pas de ligne vide.
  // Chaque entrée pointe une phrase DÉJÀ écrite par le backend (bloc `text`),
  // jamais une valeur à formater ici ; seul l'INTITULÉ appartient à la page.
  const LIGNES = [
    [t.ligneVent, r.text.wind, "d-vent"],
    [t.ligneVisibilite, r.text.visibility, "d-visibilite"],
    [t.ligneNuages, r.text.clouds, "d-nuages"],
    [t.lignePhenomenes, r.text.phenomena, "d-phenomenes"],
  ];
  const dl = $("report");
  dl.textContent = "";
  for (const [intitule, phrase, icone] of LIGNES) {
    if (!phrase) continue;
    dl.append(rangee(intitule, phrase, icone));
  }
  // Ligne de synthèse chiffrée, composée ici parce qu'elle n'existe pas
  // comme phrase dans le contrat : ce sont des VALEURS, pas du texte.
  const temp = r.temperature, chiffres = [];
  if (temp && temp.feelsLike !== null) chiffres.push(remplir(t.ressenti, { v: temp.feelsLike }));
  if (temp && temp.humidity !== null) chiffres.push(remplir(t.humidite, { v: temp.humidity }));
  if (r.pressure && r.pressure.value !== null) chiffres.push(remplir(t.pression, { v: r.pressure.value }));
  if (chiffres.length) dl.append(rangee(t.ligneMesures, chiffres.join(" · "), "d-mesures"));

  // 4. La course du soleil, à la longitude de la station.
  const f = r.sun ? fractionDuJour(r.observedLocal, r.sun.sunrise, r.sun.sunset) : null;
  $("sun").hidden = f === null;
  if (f !== null) {
    $("sunDot").style.left = `${f * 100}%`;
    $("sunrise").textContent = remplir(t.lever, { heure: r.sun.sunrise });
    $("sunset").textContent = remplir(t.coucher, { heure: r.sun.sunset });
  }

  // 5. Détail technique, pour la mise au point.
  $("tech").textContent =
    `icon=${r.icon} · cap ${r.station.bearingDeg}° · ${r.station.timezone ?? t.fuseauInconnu}` +
    (r.warnings.length ? ` · ${r.warnings.join(" · ")}` : "");
}

async function consulter(lat, lon) {
  // La langue est LUE UNE FOIS ici, puis transmise partout : la requête et
  // l'affichage parlent forcément la même, même si le <select> change pendant
  // que la réponse voyage.
  const lang = $("lang").value;
  appliquerChrome(lang);
  $("lat").value = lat.toFixed(2);
  $("lon").value = lon.toFixed(2);
  const url = `/api/nearest?lat=${lat}&lon=${lon}&lang=${lang}&units=metric`;
  try {
    const res = await fetch(url);
    // On lit d'abord en TEXTE. Un serveur en panne renvoie une page HTML, et
    // `res.json()` lèverait : l'incident du 27/07/2026 a montré qu'un plantage
    // à 500 se retrouvait alors affiché comme « source météo injoignable »,
    // c'est-à-dire en accusant la source d'une faute qui était la nôtre.
    const texte = await res.text();
    let body = null;
    try { body = JSON.parse(texte); } catch { /* ce n'est pas du JSON */ }

    if (body === null) return afficherEchec("serveur", res.status, lang);
    if (!res.ok) return afficherEchec(body.error, null, lang);
    afficher(body, lang);
  } catch {
    // Ici, et ici seulement, la requête n'a jamais abouti : navigateur hors
    // ligne, ou service inaccessible. C'est le seul vrai cas « injoignable ».
    afficherEchec("hors_ligne", null, lang);
  }
}

function localiser() {
  if (!navigator.geolocation) return consulter(48.73, 7.71);
  navigator.geolocation.getCurrentPosition(
    (p) => consulter(p.coords.latitude, p.coords.longitude),
    // Refus ou échec : on sert quand même quelque chose plutôt qu'un écran mort.
    () => consulter(48.73, 7.71),
    { timeout: 8000 },
  );
}

$("go").addEventListener("click", () => {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  if (Number.isFinite(lat) && Number.isFinite(lon)) consulter(lat, lon);
});
$("here").addEventListener("click", localiser);
$("lang").addEventListener("change", () => {
  const lat = Number($("lat").value), lon = Number($("lon").value);
  // Le chrome bascule TOUT DE SUITE, même sans position valide à consulter :
  // sinon changer de langue sur l'écran d'échec ne ferait rien du tout.
  if (Number.isFinite(lat) && Number.isFinite(lon)) consulter(lat, lon);
  else appliquerChrome($("lang").value);
});

appliquerChrome($("lang").value);
localiser();
</script>
</body>
</html>
