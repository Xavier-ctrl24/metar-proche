<!doctype html>
<html lang="fr" data-sky="neutral" data-lum="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuelTemps</title>
<meta name="description" content="La météo de la station d'observation la plus proche, en clair.">
<meta name="theme-color" content="#0a1526">

<!-- Le manifeste, et les icônes qu'il déclare. Un manifeste NON LIÉ ne fait
     rien du tout : c'est cette ligne, et pas le fichier, qui rend la page
     installable. La couleur ci-dessus et le theme_color du manifeste
     doivent rester identiques (voir la clé _5_couleurs).
     `rel="icon"` en plus, pour l'onglet du navigateur : le manifeste ne
     sert qu'à l'installation, il ne fournit pas la favicon.
     TROIS TAILLES ET NON UNE, depuis que le logo de Xavier a remplacé le
     dessin au trait du 28/07/2026. L'ancienne icône était un SVG de
     quelques kilo-octets, qui pouvait servir partout ; le logo est une
     image PHOTOGRAPHIQUE (dégradés, grain), donc un PNG de 378 Ko en 512.
     Servir ça en favicon ferait payer 378 Ko à chaque ouverture d'onglet
     pour un dessin affiché en 16 px. D'où 64 px (9 Ko) pour l'onglet,
     192 px (57 Ko) pour iOS, et le 512 réservé à l'installation.
     L'icône iOS est la SEULE des quatre à être totalement opaque, et ce
     n'est pas un détail d'export : iOS n'honore pas la transparence d'un
     apple-touch-icon, il aplatit sur du NOIR avant d'appliquer son
     masque. Ses coins arrondis et ses barres latérales deviendraient
     donc des échardes noires sur l'écran d'accueil. Voir CLAUDE.md,
     entrée du 29/07/2026. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* ==================================================================
   SYSTÈME DE DESIGN — d'après le handoff Claude Design du 28/07/2026
   (« Application météo interactive mobile »).

   L'IDÉE DIRECTRICE, et tout le reste en découle : LE CIEL EST
   L'INTERFACE. Le fond n'est pas un décor, c'est la traduction visuelle
   du METAR. La maquette supprime d'ailleurs l'icône météo de tête : le
   dégradé, la lumière et l'encre disent déjà le temps qu'il fait.

   Deux axes indépendants, et c'est le point à ne pas confondre :
     1. data-sky  = la CONDITION (cavok, sct, ovc, fg, ra, sn, ts, night,
                    + neutral pour l'inconnu et err pour la panne).
     2. data-lum  = la LUMIÈRE de la station (day / night), qui vient de
                    sun.isDay et non du navigateur. Consulter Fidji à 3 h
                    locales donne une page de nuit : c'est le parti pris
                    de la page depuis le 27/07/2026, il ne bouge pas.

   La maquette ne montre qu'un seul ciel de nuit (CAVOK nuit). Les sept
   autres conditions existent pourtant aussi la nuit. Plutôt que
   d'inventer sept dégradés nocturnes (ce serait écrire du design, pas
   l'appliquer), la nuit est un VOILE posé sur le ciel du jour : la
   maquette légende elle-même son écran nocturne « même hiérarchie,
   luminosité divisée par trois ». Seul le ciel clair a droit à son
   dégradé nocturne dédié, parce qu'il est dessiné dans la maquette.
   ================================================================== */

/* ------------------------------------------------------------------

    U+2212, U+2215, U+FEFF, U+FFFD;
}

  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url(/fonts/instrument-sans-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
    U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
